# Explicit opt-in overlay. No Mercado Pago variables are overridden.
services:
  core:
    environment:
      DRIVER_PAYOUT_PROVIDER_NAME: asaas
      ASAAS_PAYOUTS_ENABLED: ${ASAAS_PAYOUTS_ENABLED:-false}
      ASAAS_PAYOUT_MODE: ${ASAAS_PAYOUT_MODE:?Select sandbox or production explicitly}
      ASAAS_PAYOUT_START_AFTER: ${ASAAS_PAYOUT_START_AFTER:?Set the cutover for NEW driver payouts}
      ASAAS_API_KEY_FILE: /run/secrets/ramo-asaas-api-key
      ASAAS_WEBHOOK_TOKEN_FILE: /run/secrets/ramo-asaas-webhook-token
    volumes:
      - type: bind
        source: ${ASAAS_API_KEY_HOST_FILE:?Private API key file is required}
        target: /run/secrets/ramo-asaas-api-key
        read_only: true
      - type: bind
        source: ${ASAAS_WEBHOOK_TOKEN_HOST_FILE:?Private webhook token file is required}
        target: /run/secrets/ramo-asaas-webhook-token
        read_only: true
