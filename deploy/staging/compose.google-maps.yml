# Opt-in selected by the deployment helper after validating the private key file.
# The key is injected into Compose by the helper; never store it in this file.
services:
  core:
    environment:
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:?Validated Google Maps key is required}
      GOOGLE_ROUTES_BASE_URL: https://routes.googleapis.com/
      GOOGLE_PLACES_BASE_URL: https://places.googleapis.com/v1/
