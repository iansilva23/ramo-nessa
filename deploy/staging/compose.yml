name: ramo-nessa-staging

x-core-image: &core-image
  image: ramo-nessa-core:staging
  build:
    context: ../../backend/core
    dockerfile: Dockerfile

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-core-environment: &core-environment
  NODE_ENV: staging
  PORT: "8080"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  DB_SSL: "false"
  TRUST_PROXY: "true"
  ALLOW_DEV_IDENTITY: "false"
  ALLOW_DEV_OTP: "false"
  ALLOW_DEV_PAYMENT_GATEWAY: "false"
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
  OTP_PROVIDER: dev
  OTP_HASH_SECRET: ${OTP_HASH_SECRET:?OTP_HASH_SECRET is required}
  OTP_RATE_LIMIT_SECRET: ${OTP_RATE_LIMIT_SECRET:?OTP_RATE_LIMIT_SECRET is required}
  ADMIN_MFA_ENCRYPTION_KEY: ${ADMIN_MFA_ENCRYPTION_KEY:?ADMIN_MFA_ENCRYPTION_KEY is required}
  ADMIN_LOGIN_RATE_LIMIT_SECRET: ${ADMIN_LOGIN_RATE_LIMIT_SECRET:?ADMIN_LOGIN_RATE_LIMIT_SECRET is required}
  ADMIN_OWNER_USER_ID: ${ADMIN_OWNER_USER_ID:-}
  ADMIN_PAYOUT_APPROVER_USER_ID: ${ADMIN_PAYOUT_APPROVER_USER_ID:-}
  ROUTING_PROVIDER: google
  ROUTING_TIMEOUT_MS: ${ROUTING_TIMEOUT_MS:-5000}
  GOOGLE_MAPS_SERVER_API_KEY: "staging-google-mock-key"
  GOOGLE_ROUTES_BASE_URL: "http://google-maps-mock:8091/"
  GOOGLE_PLACES_BASE_URL: "http://google-maps-mock:8091/v1/"
  PLACE_PROOF_SECRET: ${PLACE_PROOF_SECRET:?PLACE_PROOF_SECRET is required}
  PLACE_PROOF_TTL_SECONDS: ${PLACE_PROOF_TTL_SECONDS:-1800}
  PUSH_PROVIDER: disabled
  DOCUMENT_STORAGE_LOCAL_DIR: /var/lib/ramo-nessa/documents
  DOCUMENT_INSPECTION_ENCRYPTION_KEY: ${DOCUMENT_INSPECTION_ENCRYPTION_KEY:?DOCUMENT_INSPECTION_ENCRYPTION_KEY is required}
  DOCUMENT_INSPECTION_TTL_SECONDS: ${DOCUMENT_INSPECTION_TTL_SECONDS:-60}
  MERCADO_PAGO_MODE: test
  MERCADO_PAGO_ACCESS_TOKEN_TEST: ${MERCADO_PAGO_ACCESS_TOKEN_TEST:-}
  MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
  DRIVER_PAYOUT_PROVIDER_NAME: ""
  DRIVER_PAYOUT_RECONCILE_INTERVAL_SECONDS: "60"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ramonessa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ramonessa}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ramonessa} -d ${POSTGRES_DB:-ramonessa}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    <<: *core-image
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      NODE_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: *default-logging
    restart: "no"

  google-maps-mock:
    <<: *core-image
    command: ["node", "dist/scripts/test-google-maps.js"]
    environment:
      GOOGLE_MAPS_MOCK_PORT: "8091"
      GOOGLE_MAPS_SERVER_API_KEY: "staging-google-mock-key"
    expose: ["8091"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: *default-logging
    restart: unless-stopped

  document-storage-init:
    <<: *core-image
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/ramo-nessa/documents && chown -R 1000:1000 /var/lib/ramo-nessa && chmod 700 /var/lib/ramo-nessa /var/lib/ramo-nessa/documents"]
    volumes:
      - driver_documents:/var/lib/ramo-nessa
    logging: *default-logging
    restart: "no"

  document-storage-check:
    <<: *core-image
    command: ["node", "/ops/check-document-storage.mjs"]
    environment:
      DOCUMENT_STORAGE_LOCAL_DIR: /var/lib/ramo-nessa/documents
    depends_on:
      document-storage-init:
        condition: service_completed_successfully
    volumes:
      - driver_documents:/var/lib/ramo-nessa
      - ../prod/check-document-storage.mjs:/ops/check-document-storage.mjs:ro
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: *default-logging
    restart: "no"

  core:
    <<: *core-image
    environment: *core-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      google-maps-mock:
        condition: service_started
      document-storage-init:
        condition: service_completed_successfully
      document-storage-check:
        condition: service_completed_successfully
    volumes:
      - driver_documents:/var/lib/ramo-nessa
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 30s

  gateway:
    image: ramo-nessa-admin-gateway:staging
    build:
      context: ../../apps/admin
      dockerfile: Dockerfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    depends_on:
      core:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
  driver_documents:
  caddy_data:
  caddy_config:
