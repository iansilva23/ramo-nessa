name: Ride recovery boarding and document expiry review
on:
  push:
    branches: [feature/ride-recovery-boarding-20261024]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ride-recovery-boarding
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ramo, POSTGRES_PASSWORD: ramo, POSTGRES_DB: ramo}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ramo:ramo@127.0.0.1:5432/ramo
      DB_SSL: 'false'
      RAMO_BOARDING_POSTGRES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix backend/core --no-audit --no-fund
      - run: npm run typecheck && npm run db:migrate && npm run db:migrate && npm exec -- tsx --test --test-concurrency=1 test/**/*.test.ts && npm run build
        working-directory: backend/core
      - run: npm test --prefix apps/admin
  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {app: [passenger, driver]}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test && flutter build web --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
        working-directory: apps/${{ matrix.app }}
  admin-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {engine: [chromium, webkit]}
    env:
      RAMO_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix scripts/web/browser-tests --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps ${{ matrix.engine }}
        working-directory: scripts/web/browser-tests
      - run: node --test scripts/web/boarding_admin_browser_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boarding-admin-${{ matrix.engine }}
          path: artifacts/ride-recovery/
          if-no-files-found: ignore
