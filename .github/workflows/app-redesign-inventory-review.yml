name: App redesign Web deployment rehearsal
on:
  push:
    branches: [ops/app-redesign-packages-20261105]
    paths: ['deploy/app-redesign/**', '.github/workflows/app-redesign-inventory-review.yml']
permissions: {contents: read}
jobs:
  inventory-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only inventory using isolated fixtures
        run: |
          command -v docker
          docker compose version
          sudo env RAMO_REDESIGN_DOCKER_REHEARSAL=1 python3 -m unittest discover -s deploy/app-redesign -p 'test_*.py' -v
