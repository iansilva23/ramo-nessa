name: Bootstrap Passenger Platforms

on:
  push:
    paths:
      - ".github/workflows/bootstrap-passenger-platforms.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Preserve Ramo Nessa source
        working-directory: apps/passenger
        run: |
          mkdir -p /tmp/ramo-passenger
          cp -a lib /tmp/ramo-passenger/lib
          cp -a test /tmp/ramo-passenger/test
          cp pubspec.yaml /tmp/ramo-passenger/pubspec.yaml
          cp analysis_options.yaml /tmp/ramo-passenger/analysis_options.yaml
          cp README.md /tmp/ramo-passenger/README.md

      - name: Generate Android and iOS projects
        working-directory: apps/passenger
        run: |
          flutter create \
            --platforms=android,ios \
            --project-name ramo_nessa_passenger \
            --org br.com.ramonessa \
            .

      - name: Restore Ramo Nessa source
        working-directory: apps/passenger
        run: |
          rm -rf lib test
          cp -a /tmp/ramo-passenger/lib ./lib
          cp -a /tmp/ramo-passenger/test ./test
          cp /tmp/ramo-passenger/pubspec.yaml ./pubspec.yaml
          cp /tmp/ramo-passenger/analysis_options.yaml ./analysis_options.yaml
          cp /tmp/ramo-passenger/README.md ./README.md

      - name: Validate generated project
        working-directory: apps/passenger
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Android debug APK
        working-directory: apps/passenger
        run: flutter build apk --debug

      - name: Remove generated build output
        run: rm -rf apps/passenger/build apps/passenger/.dart_tool

      - name: Commit native platform scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/passenger/android apps/passenger/ios apps/passenger/.metadata apps/passenger/pubspec.lock
          if git diff --cached --quiet; then
            echo "No native platform changes to commit."
            exit 0
          fi
          git commit -m "chore(passenger): generate Android and iOS scaffolding"
          git push
