name: Driver white cards and restored GPS Cinema
on:
  push:
    branches: [fix/driver-white-cards-gps-20261026]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: driver-white-gps-fix
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - name: Resolve locked dependencies and check Driver
        working-directory: apps/driver
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter test --platform chrome test/driver_web_heading_config_test.dart test/driver_web_cinematic_camera_test.dart
      - name: Compile unchanged Core for browser session fixture
        run: |
          npm ci --prefix backend/core --no-audit --no-fund
          npm run build --prefix backend/core
      - name: Build configured real Driver Web with restored production vector ID
        env:
          RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/web/generate_pwa_icons.py
          node scripts/web/prepare_configured_web.mjs --role=driver
          cd apps/driver
          flutter build web --release --no-web-resources-cdn --base-href=/motorista/ --dart-define=RAMO_CORE_BASE_URL= --dart-define=RAMO_PREVIEW_MODE=false
      - name: Verify bundle and retained GPS build configuration
        run: |
          node scripts/web/verify_web_bundle.mjs --role=driver --dist=apps/driver/build/web
          grep -Fq de20bf289d6db3ad15fdb14b apps/driver/build/web/main.dart.js
          mkdir -p release
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, json
          root=pathlib.Path('apps/driver/build/web')
          files=[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          manifest={'schemaVersion':1,'role':'driver','sourceCommit':'6ca7e544eb014e994937560da5095250c0ff8b3b','expectedOrigin':'https://app.ramonessa.com.br','expectedProject':'ramo-nessa','basePath':'/motorista/','compiledFinanceTerms':True,'browserLoginChromium':True,'browserLoginWebKit':True,'realProviderAcceptance':False,'publicConfigSha256':hashlib.sha256((root/'ramo_push_config.js').read_bytes()).hexdigest(),'files':files}
          with zipfile.ZipFile('release/RamoNessa-Motorista-Branco-GPS.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('release.driver.json',json.dumps(manifest))
              for f in files: z.write(root/f['path'],'driver/'+f['path'])
          PY
          cd release
          sha256sum RamoNessa-Motorista-Branco-GPS.zip > RamoNessa-Motorista-Branco-GPS.zip.sha256
      - name: Install browser engines
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          npm ci --prefix scripts/web/browser-tests --no-audit --no-fund
          node scripts/web/browser-tests/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Compiled Web and installed launch session regression
        run: |
          for engine in chromium webkit; do
            RAMO_WEB_TEST_ROLE=driver RAMO_BROWSER_ENGINE="$engine" node --test scripts/web/web_direct_entry_auth_test.mjs
          done
      - name: Rehearse driver-only switch and both recovery paths with Caddy
        run: |
          node --check deploy/staging/driver-white-gps-update.mjs
          docker pull caddy:2.11.7-alpine
          sudo env GITHUB_ACTIONS=true PATH="$PATH" node deploy/staging/test-driver-white-gps-update.mjs "$PWD/release/RamoNessa-Motorista-Branco-GPS.zip"
          git archive HEAD deploy/staging scripts/web | gzip -n > release/Instalador-Motorista-Branco-GPS.tar.gz
          cd release
          sha256sum Instalador-Motorista-Branco-GPS.tar.gz > Instalador-Motorista-Branco-GPS.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: driver-white-gps-tested
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-white-gps-browser-evidence
          path: artifacts/web-csp/
          if-no-files-found: ignore

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: driver-white-gps-tested, path: release}
      - name: Publish verified operator package only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum -c RamoNessa-Motorista-Branco-GPS.zip.sha256
          sha256sum -c Instalador-Motorista-Branco-GPS.tar.gz.sha256
          gh release create driver-white-gps-20261026-r1 ./* --target "$GITHUB_SHA" --prerelease --latest=false --title 'Motorista — cartões brancos e GPS Cinema' --notes 'Driver source 6ca7e544. Mantém base atual de destino/notificações. Testes Flutter e Web/PWA, troca e retorno ensaiados. Não instala na VPS automaticamente. Sem alterações no Core, banco, ADM ou Passageiro.'
