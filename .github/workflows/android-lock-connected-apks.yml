name: Android screen lock - connected device APKs
on:
  push:
    branches: [feature/android-lock-offer-safety-20261031]
    paths: [.github/workflows/android-lock-connected-apks.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-lock-connected-${{ github.ref }}
  cancel-in-progress: true
env:
  RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    env:
      RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ matrix.app == 'passenger' && (secrets.RAMO_GOOGLE_MAPS_ANDROID_PASSENGER_API_KEY || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY) || (secrets.RAMO_GOOGLE_MAPS_ANDROID_DRIVER_API_KEY || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY) }}
      RAMO_FIREBASE_API_KEY: ${{ matrix.app == 'passenger' && (secrets.RAMO_FIREBASE_ANDROID_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY) || (secrets.RAMO_FIREBASE_ANDROID_DRIVER_API_KEY || secrets.RAMO_FIREBASE_API_KEY) }}
      RAMO_FIREBASE_APP_ID: ${{ matrix.app == 'passenger' && (secrets.RAMO_FIREBASE_ANDROID_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_PASSENGER_APP_ID) || (secrets.RAMO_FIREBASE_ANDROID_DRIVER_APP_ID || secrets.RAMO_FIREBASE_DRIVER_APP_ID) }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
      RAMO_PREVIEW_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Validate configured services; refuse broken mobile package
        run: |
          set -euo pipefail
          node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_ANDROID_API_KEY --surface="Screen lock ${{ matrix.app }} Android"
          node tooling/validate-firebase-mobile-config.mjs --platform=android --surface="Screen lock ${{ matrix.app }} Android"
      - name: Test and build connected APK without store signing
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build apk --release --no-pub \
            --build-number=$((200000 + ${{ github.run_number }})) \
            --dart-define=RAMO_PREVIEW_MODE=false \
            --dart-define=RAMO_APP_VERSION=0.1.0-connected-lock \
            --dart-define=RAMO_APP_BUILD=$((200000 + ${{ github.run_number }})) \
            --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
            --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
            --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
            --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
            --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
      - name: Verify APK and attach release identity
        run: |
          set -euo pipefail
          apk="apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$signer" verify "$apk"
          mkdir -p artifacts
          cp "$apk" "artifacts/RamoNessa-Bloqueio-${{ matrix.app }}-Android-TESTE-CONECTADO.apk"
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS
          printf 'source=%s\nrole=%s\ncore=%s\nmode=real-api-test-signature-not-for-store\n' "${{ github.sha }}" "${{ matrix.app }}" "$RAMO_CORE_BASE_URL" > artifacts/README.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data={"source":os.environ["GITHUB_SHA"],"role":"${{ matrix.app }}","api":"https://app.ramonessa.com.br", "previewMode":False,"testSignature":True,"build":200000+int(os.environ["GITHUB_RUN_NUMBER"])}
          Path('artifacts/build-identity.json').write_text(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-lock-${{ matrix.app }}-CONNECTED-DEVICE-TEST
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
