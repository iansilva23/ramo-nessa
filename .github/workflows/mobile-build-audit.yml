name: Mobile Build Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mobile-build-audit.yml"

concurrency:
  group: mobile-build-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/passenger
        run: flutter pub get

      - name: Analyze
        working-directory: apps/passenger
        run: flutter analyze

      - name: Test
        working-directory: apps/passenger
        run: flutter test

      - name: Build Android release
        working-directory: apps/passenger
        run: flutter build apk --release

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/passenger
        run: flutter pub get

      - name: Analyze
        working-directory: apps/passenger
        run: flutter analyze

      - name: Test
        working-directory: apps/passenger
        run: flutter test

      - name: Build iOS simulator
        working-directory: apps/passenger
        run: flutter build ios --simulator --debug
