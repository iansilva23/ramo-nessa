name: Mobile Build Audit

on:
  workflow_dispatch:

concurrency:
  group: mobile-build-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  passenger-android-release:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve Passenger dependencies from lockfile
        working-directory: apps/passenger
        run: flutter pub get --enforce-lockfile

      - name: Build Passenger Android release
        working-directory: apps/passenger
        run: flutter build apk --release

      - name: Upload Passenger APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ramo-nessa-passenger-release
          path: apps/passenger/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  driver-android-release:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve Driver dependencies from lockfile
        working-directory: apps/driver
        run: flutter pub get --enforce-lockfile

      - name: Build Driver Android release
        working-directory: apps/driver
        run: flutter build apk --release

      - name: Upload Driver APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ramo-nessa-driver-release
          path: apps/driver/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  passenger-ios-simulator:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve Passenger dependencies from lockfile
        working-directory: apps/passenger
        run: flutter pub get --enforce-lockfile

      - name: Build Passenger iOS simulator
        working-directory: apps/passenger
        run: flutter build ios --simulator --debug
