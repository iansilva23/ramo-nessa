name: Passenger quote stability
on:
  push:
    branches: [fix/passenger-quote-stability-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope the change to Passenger quote state and tests
        run: |
          diff -u <(printf '%s\n' .github/workflows/passenger-quote-stability-review.yml apps/passenger/lib/src/features/home/presentation/vehicle_selection_screen.dart apps/passenger/test/vehicle_selection_prices_test.dart | sort) <(git diff --name-only 3e1c72c2b68f835ad41d739a228f6c2511eb0562 HEAD | sort)
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Test pricing and rapid occupancy changes
        working-directory: apps/passenger
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/vehicle_selection_prices_test.dart test/buggy_passenger_policy_ui_test.dart test/password_access_visual_test.dart
