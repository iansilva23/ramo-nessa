name: Passenger route availability
on:
  pull_request:
    branches: [fix/passenger-quote-stability-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node --import tsx --test --test-concurrency=1 test/public_pricing_policy.test.ts test/managed_quote_security.test.ts test/managed_ride_pricing_integration.test.ts
  passenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/passenger
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/managed_route_availability_test.dart test/pricing_policy_http_test.dart test/vehicle_selection_prices_test.dart test/web_map_selection_race_test.dart
