name: Regions and Pricing - Candidate Preparation Review
on:
  workflow_dispatch:
  push:
    branches: [feature/admin-regions-pricing-simple-20261020]
    paths:
      - deploy/staging/*web-map-update*
      - deploy/staging/prepare-regions-pricing*
      - deploy/staging/backup-regions-pricing*
      - deploy/staging/inspect-regions-pricing*
      - deploy/staging/asaas-activation-plan-contract.mjs
      - deploy/staging/regions-restoration-probe.mjs
      - deploy/staging/prepare-regions-activation.mjs
      - deploy/staging/regions-activation-contract*
      - deploy/staging/stage-regions-web.py
      - deploy/staging/test_stage_regions_web.py
      - deploy/staging/activate-regions-pricing*
      - deploy/staging/regions-live-catalog-probe.mjs
      - deploy/staging/regions-runtime-switch*
      - .github/workflows/regions-pricing-candidate-review.yml
permissions:
  contents: read
  actions: read
jobs:
  candidate-offline:
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, rollback_after_reset, map_rollback]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard contracts
        run: |
          node --test deploy/staging/backup-regions-pricing.test.mjs deploy/staging/prepare-regions-pricing.test.mjs deploy/staging/regions-activation-contract.test.mjs deploy/staging/regions-runtime-switch.test.mjs deploy/staging/activate-regions-pricing.test.mjs
          python3 deploy/staging/test_stage_regions_web.py
      - name: Download approved configured Web archive from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/iansilva23/ramo-nessa/actions/artifacts/12299797049/zip \
            --output "$RUNNER_TEMP/regions-configured.zip"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/iansilva23/ramo-nessa/actions/artifacts/12355793923/zip \
            --output "$RUNNER_TEMP/installed-maps-configured.zip"
          echo "872e17e87dedd8cf8410b5e0103c5ba1f0a747aaa94e4b6e16c2e86d3338b19a  $RUNNER_TEMP/installed-maps-configured.zip" | sha256sum --check
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/iansilva23/ramo-nessa/actions/artifacts/12365640705/zip \
            --output "$RUNNER_TEMP/maps-configured.zip"
          echo "392f89862e0a46ad7010cb44618f2110f87cb1e3fd860e7c135beefefa84b46e  $RUNNER_TEMP/maps-configured.zip" | sha256sum --check
      - name: Build candidate, backup real synthetic PostgreSQL and rehearse preparation
        shell: bash
        env:
          REGIONS_TEST_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          docker pull postgres:16
          mkdir -p "$RUNNER_TEMP/regions/original"
          git archive 9a5a888946e851e8b370dc952d1caa081d809895 backend/core | tar -x -C "$RUNNER_TEMP/regions/original"
          git archive 6f90c616ec181943d093b0e373e21fdb23b57f4f apps/admin | tar -x -C "$RUNNER_TEMP/regions/original"
          docker build -t ramo-regions-ci-original:local "$RUNNER_TEMP/regions/original/backend/core"
          docker build -t ramo-regions-ci-gateway:local "$RUNNER_TEMP/regions/original/apps/admin"
          python3 - <<'WEB'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'regions'
          for role in ['passenger','driver']:
            target=root/'web'/role;target.mkdir(parents=True)
            for name in ['index.html','main.dart.js','flutter_bootstrap.js','manifest.json','ramo_push_config.js','ramo_push_worker.js','ramo_web_push.js','ramo_entry_gate.js','ramo_entry_gate.css']:(target/name).write_text('old-synthetic-web-'+role+'-'+name)
          (root/'Caddyfile').write_text('''{
            admin off
          }
          :8080 {
            handle /healthz {
              respond 200
            }
            @api path /v1/* /health /ready
            handle @api {
              reverse_proxy core:8080
            }
            handle_path /administrodo/* {
              root * /srv/admin
              try_files {path} /index.html
              file_server
            }
            handle_path /passageiro/* {
              root * /srv/web/passenger
              file_server
            }
            handle_path /motorista/* {
              root * /srv/web/driver
              file_server
            }
            handle /api/health {
              respond 200
            }
            handle / {
              respond "synthetic institutional site" 200
            }
          }
          ''')
          WEB
          docker volume create regions-ci-docs
          docker run --rm --network none -v regions-ci-docs:/docs postgres:16 sh -c 'echo synthetic-document > /docs/test.txt'
          docker run -d --name ramo-nessa-staging-postgres-1 --env POSTGRES_USER=ramo --env POSTGRES_PASSWORD=synthetic-only --env POSTGRES_DB=ramo postgres:16
          for n in $(seq 1 60); do
            if docker exec ramo-nessa-staging-postgres-1 sh -c 'test "$(cat /proc/1/comm)" = postgres && psql -U ramo -d ramo -Atqc "SELECT 1"' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          dbid=$(docker inspect -f '{{.Id}}' ramo-nessa-staging-postgres-1)
          docker run --rm --network "container:$dbid" --env DATABASE_URL=postgresql://ramo:synthetic-only@127.0.0.1:5432/ramo --env DB_SSL=false ramo-regions-ci-original:local node dist/scripts/migrate.js
          docker exec ramo-nessa-staging-postgres-1 psql -v ON_ERROR_STOP=1 -U ramo -d ramo -c "INSERT INTO admin_users(id,name,email_normalized,password_hash,totp_secret_ciphertext,scopes,status,created_at,updated_at) VALUES('11111111-1111-4111-8111-111111111111','Synthetic Owner','owner@example.invalid','unused-ci-only','unused-ci-only',ARRAY['pricing:write'],'active',now(),now());"
          docker run --rm --network "container:$dbid" --env DATABASE_URL=postgresql://ramo:synthetic-only@127.0.0.1:5432/ramo --env DB_SSL=false ramo-regions-ci-original:local node --input-type=module -e '
            import {createPostgresPool} from "./dist/src/db/postgres.js";
            import {STATIC_PRICING_CATALOG_V1,normalizePricingCatalogSnapshot} from "./dist/src/pricing/catalog-snapshot.js";
            const p=createPostgresPool(process.env.DATABASE_URL);
            await p.query("INSERT INTO pricing_catalog_versions(id,status,snapshot,effective_from,created_by_kind,created_by_id,created_by_name,published_by_kind,published_by_id,published_by_name,created_at,updated_at,published_at) VALUES ($1,$2,$3,now(),$4,$5,$6,$4,$5,$6,now(),now(),now())",["22222222-2222-4222-8222-222222222222","published",normalizePricingCatalogSnapshot(STATIC_PRICING_CATALOG_V1),"user","11111111-1111-4111-8111-111111111111","Synthetic Owner"]);
            await p.end();'
          docker exec -i ramo-nessa-staging-postgres-1 psql -v ON_ERROR_STOP=1 -U ramo -d ramo <<'HISTORY'
          INSERT INTO rides(id,passenger_id,state,payment_status,origin_zone_id,origin_locality_id,destination_zone_id,destination_locality_id,category,price_period,passengers,pricing_rule_id,base_amount_cents,pickup_compensation_cents,total_amount_cents,platform_commission_cents,driver_net_cents,pricing_catalog_version_id,pricing_catalog_version_number)
          VALUES('33333333-3333-4333-8333-333333333333','synthetic-passenger','completed','paid','prea','prea','prea','prea','moto','day',1,'synthetic-historical-rule',1000,0,1000,100,900,'22222222-2222-4222-8222-222222222222',1);
          INSERT INTO payments(id,ride_id,method,processor,status,amount_cents,idempotency_key) VALUES('44444444-4444-4444-8444-444444444444','33333333-3333-4333-8333-333333333333','pix','synthetic-only','paid',1000,'synthetic-historical-payment');
          INSERT INTO ledger_transactions(id,kind,ride_id,payment_id,reference_key) VALUES('55555555-5555-4555-8555-555555555555','synthetic-history','33333333-3333-4333-8333-333333333333','44444444-4444-4444-8444-444444444444','synthetic-history');
          INSERT INTO ledger_entries(transaction_id,account_key,direction,amount_cents) VALUES('55555555-5555-4555-8555-555555555555','synthetic-escrow','debit',1000),('55555555-5555-4555-8555-555555555555','synthetic-bank','credit',1000);
          HISTORY
          python3 - <<'COMPOSE'
          import json,os,base64
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'regions'
          model={'name':'ramo-nessa-staging','services':{
            'core':{'image':'ramo-regions-ci-original:local','labels':{'br.com.ramonessa.regions-ci':'true'},'environment':{'NODE_ENV':'staging','ADMIN_OWNER_USER_ID':'11111111-1111-4111-8111-111111111111','DATABASE_URL':'postgresql://ramo:synthetic-only@postgres:5432/ramo','DB_SSL':'false','FIXTURE_DOLLARS':'one$$two$$$$three','OTP_HASH_SECRET':'synthetic-only-otp-hash-secret-123456789','OTP_RATE_LIMIT_SECRET':'synthetic-only-otp-limit-secret-123456789','ADMIN_MFA_ENCRYPTION_KEY':base64.b64encode(bytes([29])*32).decode(),'ADMIN_LOGIN_RATE_LIMIT_SECRET':'synthetic-only-admin-limit-secret-123456789','PLACE_PROOF_SECRET':'synthetic-only-place-proof-secret-123456789','ROUTING_PROVIDER':'google','MERCADO_PAGO_MODE':'disabled','PUSH_PROVIDER':'disabled','GEO_CATALOG_SEARCH_ENABLED':'false','GEO_PASSENGER_LEARNING_ENABLED':'false','GEO_STORAGE_AUTOMATION_ENABLED':'false'},'volumes':[{'type':'volume','source':'docs','target':'/var/lib/ramo-nessa'}]},
            'gateway':{'image':'ramo-regions-ci-gateway:local','labels':{'br.com.ramonessa.regions-ci':'true'},'ports':['127.0.0.1:18080:8080'],'volumes':[{'type':'bind','source':str(root/'web'),'target':'/srv/web','read_only':True},{'type':'bind','source':str(root/'Caddyfile'),'target':'/etc/caddy/Caddyfile','read_only':True}]}},'volumes':{'docs':{'external':True,'name':'regions-ci-docs'}}}
          (root/'runtime.compose.json').write_text(json.dumps(model))
          COMPOSE
          docker compose --project-name ramo-nessa-staging -f "$RUNNER_TEMP/regions/runtime.compose.json" up -d --no-build --pull never
          docker network connect --alias postgres ramo-nessa-staging_default ramo-nessa-staging-postgres-1
          for n in $(seq 1 90); do
            if test "$(docker inspect -f '{{.State.Health.Status}}' ramo-nessa-staging-core-1)" = healthy && test "$(docker inspect -f '{{.State.Health.Status}}' ramo-nessa-staging-gateway-1)" = healthy; then break; fi
            sleep 1
          done
          docker run -d --name ramo-nessa-staging-google-maps-mock-1 --entrypoint sleep postgres:16 1200
          docker run -d --name ramo-nessa-site-institutional-site-1 --entrypoint sleep postgres:16 1200
          core_image=$(docker inspect -f '{{.Image}}' ramo-nessa-staging-core-1)
          gateway_image=$(docker inspect -f '{{.Image}}' ramo-nessa-staging-gateway-1)
          sudo mkdir -p /opt/ramo-nessa
          sudo cp -a .git /opt/ramo-nessa/
          git archive "$GITHUB_SHA" | sudo tar -x -C /opt/ramo-nessa
          sudo "$(command -v node)" deploy/staging/backup-regions-pricing.mjs "--core-image=$core_image" "--gateway-image=$gateway_image"
          backup=$(sudo find /var/backups/ramo-nessa-regions -mindepth 1 -maxdepth 1 -type d ! -name '*.incomplete')
          digest=$(sudo sha256sum "$backup/verified.private.json" | cut -d ' ' -f 1)
          # Replay the original activation against its matching frozen Web sources.
          original_revision=e24a5ecb93e22b8054b599c4f377809fc63dcffb
          sudo "$(command -v node)" deploy/staging/prepare-regions-pricing.mjs "$original_revision" "$backup" "$digest"
          sudo "$(command -v node)" --input-type=module - <<'VERIFY'
          import assert from 'node:assert/strict';
          import {readFileSync,readdirSync} from 'node:fs';
          const releases='/opt/ramo-nessa-regions/releases';
          const dirs=readdirSync(releases);assert.equal(dirs.length,1);
          const root=releases+'/'+dirs[0];
          const p=JSON.parse(readFileSync(root+'/prepared.private.json'));
          assert.equal(p.offlineResetVerified,true); assert.equal(p.resetApplied,false); assert.equal(p.servicesRestarted,false);
          console.log('Candidate builds, migration parity, Caddy validation, offline reset/idempotency/restore and business preservation passed.');
          VERIFY
          release=/opt/ramo-nessa-regions/releases/${original_revision:0:12}
          prepared_digest=$(sudo sha256sum "$release/prepared.private.json" | cut -d ' ' -f 1)
          sudo "$(command -v node)" deploy/staging/prepare-regions-activation.mjs "$release" "$prepared_digest" "$RUNNER_TEMP/regions-configured.zip"
          sudo "$(command -v node)" --input-type=module - <<'PLAN'
          import assert from 'node:assert/strict';
          import {readdirSync,readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const root='/opt/ramo-nessa-regions/releases',r=root+'/'+readdirSync(root)[0];
          const dirs=readdirSync(r).filter(n=>n.startsWith('activation-'));assert.equal(dirs.length,1);
          const dir=r+'/'+dirs[0],p=JSON.parse(readFileSync(dir+'/plan.private.json'));
          assert.equal(p.servicesChanged,false);assert.equal(p.resetApplied,false);
          const candidate=JSON.parse(readFileSync(dir+'/gateway-candidate.compose.private.json'));
          assert.equal(candidate.services.gateway.volumes.find(m=>m.target==='/srv/web').source,p.webRoot);
          const before=JSON.parse(readFileSync(dir+'/runtime-before.private.json'));
          for(const c of Object.values(before)){const out=spawnSync('docker',['inspect',c.Id],{encoding:'utf8'});assert.equal(out.status,0);assert.equal(JSON.parse(out.stdout)[0].State.Running,true);}
          const db=spawnSync('docker',['exec','ramo-nessa-staging-postgres-1','psql','-U','ramo','-d','ramo','-Atqc','SELECT count(*) FROM pricing_catalog_versions'],{encoding:'utf8'});assert.equal(db.status,0);assert.equal(db.stdout.trim(),'1');
          console.log('Real Compose models, configured Web files, effective dollar-containing environment, active read-only reset plan and no service/catalog mutations verified.');
          PLAN
          activation=$(sudo find "$release" -mindepth 1 -maxdepth 1 -type d -name 'activation-*')
          plan_digest=$(sudo sha256sum "$activation/plan.private.json" | cut -d ' ' -f 1)
          sudo env GITHUB_ACTIONS=true RAMO_REGIONS_CI_ORIGIN=http://127.0.0.1:18080 REGIONS_TEST_SCENARIO="$REGIONS_TEST_SCENARIO" REGIONS_TEST_PLAN="$activation" REGIONS_TEST_DIGEST="$plan_digest" "$(command -v node)" --input-type=module - <<'ACTIVATE'
          import {activate} from './deploy/staging/activate-regions-pricing.mjs';
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const dir=process.env.REGIONS_TEST_PLAN,scenario=process.env.REGIONS_TEST_SCENARIO;
          await activate([dir,process.env.REGIONS_TEST_DIGEST],scenario==='rollback_after_reset'?{testAfterReset:async()=>{throw Error('Synthetic failure after committed reset');}}:{});
          const journal=JSON.parse(readFileSync(dir+'/activation.private.json'));
          const policy=await (await fetch('http://127.0.0.1:18080/v1/pricing/policy')).json();
          const historical=spawnSync('docker',['exec','ramo-nessa-staging-postgres-1','psql','-U','ramo','-d','ramo','-Atqc',"SELECT json_build_array((SELECT total_amount_cents FROM rides WHERE id='33333333-3333-4333-8333-333333333333'),(SELECT amount_cents FROM payments WHERE id='44444444-4444-4444-8444-444444444444'),(SELECT count(*) FROM ledger_entries WHERE transaction_id='55555555-5555-4555-8555-555555555555'),(SELECT pricing_catalog_version_id FROM rides WHERE id='33333333-3333-4333-8333-333333333333'))"],{encoding:'utf8'});assert.equal(historical.status,0);assert.deepEqual(JSON.parse(historical.stdout),[1000,1000,2,'22222222-2222-4222-8222-222222222222']);
          if(scenario!=='rollback_after_reset'){
            assert.equal(journal.phase,'completed');assert.equal(journal.resetApplied,true);
            assert.equal(policy.managementMode,'managed');assert.equal(policy.regions.length,3);assert.deepEqual(policy.enabledCategories,[]);
          }else{
            assert.equal(journal.phase,'rolled-back');assert.equal(journal.rollbackComplete,true);assert.equal(journal.catalogRestoredAsNewVersion,true);
            assert.equal(policy.managementMode,undefined);
            const expected=JSON.parse(readFileSync(dir+'/runtime-before.private.json'));
            for(const role of ['core','gateway']){const r=spawnSync('docker',['inspect',expected[role].Name.slice(1)],{encoding:'utf8'});assert.equal(r.status,0);assert.equal(JSON.parse(r.stdout)[0].Image,expected[role].Image);}
            process.exitCode=0;
          }
          console.log('ACTUAL CORE/CADDY/POSTGRES ROLLOUT VERIFIED: '+scenario);
          ACTIVATE
          if test "$REGIONS_TEST_SCENARIO" != rollback_after_reset; then
            # First recreate the exact c639 Web version already installed on the VPS.
            installed_tools=$(mktemp -d)
            git archive 9ab768635d8763db030e8aa850f11be5dabcdf5a deploy/staging | tar -x -C "$installed_tools"
            sudo env GITHUB_ACTIONS=true MAP_BASELINE="$activation/plan.private.json" MAP_BASELINE_DIGEST="$plan_digest" MAP_ARCHIVE="$RUNNER_TEMP/installed-maps-configured.zip" INSTALLED_MAP_TOOLS="$installed_tools/deploy/staging" "$(command -v node)" --input-type=module - <<'INSTALLED_MAPS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {pathToFileURL} from 'node:url';
          const root=process.env.INSTALLED_MAP_TOOLS;
          const {prepareMapWeb,mapWebSource}=await import(pathToFileURL(root+'/prepare-web-map-update.mjs'));
          const {activateMapWeb}=await import(pathToFileURL(root+'/activate-web-map-update.mjs'));
          await prepareMapWeb([process.env.MAP_ARCHIVE,'872e17e87dedd8cf8410b5e0103c5ba1f0a747aaa94e4b6e16c2e86d3338b19a'],{baselinePlan:process.env.MAP_BASELINE,baselineDigest:process.env.MAP_BASELINE_DIGEST});
          const dir='/opt/ramo-nessa-regions/map-web-updates/'+mapWebSource.slice(0,12);
          await activateMapWeb([dir,createHash('sha256').update(readFileSync(dir+'/prepared.private.json')).digest('hex')]);
          console.log('INSTALLED C639 WEB BASELINE RECREATED BEFORE FOLLOW-UP UPGRADE');
          INSTALLED_MAPS
            previous_map=/opt/ramo-nessa-regions/map-web-updates/c6390a6d5561/prepared.private.json
            previous_digest=$(sudo sha256sum "$previous_map" | cut -d ' ' -f 1)
            sudo env GITHUB_ACTIONS=true MAP_BASELINE="$previous_map" MAP_BASELINE_DIGEST="$previous_digest" MAP_ARCHIVE="$RUNNER_TEMP/maps-configured.zip" MAP_SCENARIO="$REGIONS_TEST_SCENARIO" "$(command -v node)" --input-type=module - <<'MAPS'
          import {prepareMapWeb,mapWebSource} from './deploy/staging/prepare-web-map-update.mjs';
          import {activateMapWeb} from './deploy/staging/activate-web-map-update.mjs';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          await prepareMapWeb([process.env.MAP_ARCHIVE,'392f89862e0a46ad7010cb44618f2110f87cb1e3fd860e7c135beefefa84b46e'],{baselinePlan:process.env.MAP_BASELINE,baselineDigest:process.env.MAP_BASELINE_DIGEST});
          const dir='/opt/ramo-nessa-regions/map-web-updates/'+mapWebSource.slice(0,12);
          const bytes=readFileSync(dir+'/prepared.private.json'),hash=createHash('sha256').update(bytes).digest('hex'),plan=JSON.parse(bytes);
          const query=()=>{const r=spawnSync('docker',['exec','ramo-nessa-staging-postgres-1','psql','-U','ramo','-d','ramo','-Atqc',"SELECT json_build_array((SELECT json_agg(row_to_json(t) ORDER BY id) FROM pricing_catalog_versions t),(SELECT json_agg(row_to_json(t) ORDER BY id) FROM rides t),(SELECT json_agg(row_to_json(t) ORDER BY id) FROM payments t),(SELECT json_agg(row_to_json(t)) FROM ledger_entries t))"],{encoding:'utf8'});assert.equal(r.status,0);return r.stdout;};
          const databaseBefore=query(),shouldRollback=process.env.MAP_SCENARIO==='map_rollback';
          if(shouldRollback)await assert.rejects(activateMapWeb([dir,hash],{failAfterSwitch:true}),e=>e.rollbackComplete===true);
          else await activateMapWeb([dir,hash]);
          const journal=JSON.parse(readFileSync(dir+'/activation.private.json'));
          assert.equal(journal.phase,shouldRollback?'rolled-back':'completed');
          assert.equal(query(),databaseBefore,'Web rollout must not change catalog, rides or financial records');
          const r=spawnSync('docker',['inspect','ramo-nessa-staging-gateway-1'],{encoding:'utf8'});assert.equal(r.status,0);
          const current=JSON.parse(r.stdout)[0];assert.equal(current.Mounts.find(m=>m.Destination==='/srv/web').Source,shouldRollback?plan.oldBundleRoot:plan.bundleRoot);
          console.log('REAL TWO-ROLE MAP WEB SWITCH VERIFIED; CATALOG/FINANCE UNCHANGED: '+(shouldRollback?'rollback':'success'));
          MAPS
          fi
      - name: Synthetic fixture diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if test -d /opt/ramo-nessa-regions/releases; then
            sudo find /opt/ramo-nessa-regions/releases -type f \( -name prepare-last.private.log -o -name last-cli-error.private.log -o -name failure.private.log -o -name activation-last.private.log -o -name activation-error.private.log \) -exec tail -c 8000 {} \;
          fi
          docker logs --tail 40 ramo-nessa-staging-core-1 || true
          docker logs --tail 40 ramo-nessa-staging-gateway-1 || true
          sudo "$(command -v node)" --input-type=module - <<'DIFFERENCES'
          import {existsSync,readdirSync,readFileSync} from 'node:fs';
          import {join} from 'node:path';
          function differences(a,b,p='',out=[]){if(JSON.stringify(a)===JSON.stringify(b))return out;if(a&&b&&typeof a==='object'&&typeof b==='object'){for(const k of new Set([...Object.keys(a),...Object.keys(b)]))differences(a[k],b[k],p+'.'+k,out);}else out.push(p);return out;}
          function visit(p){if(!existsSync(p))return;for(const e of readdirSync(p,{withFileTypes:true})){const f=join(p,e.name);if(e.isDirectory())visit(f);else if(['runtime-changed.private.json','runtime-difference.private.json'].includes(e.name)){const d=JSON.parse(readFileSync(f));console.log('Changed runtime fields only:',d.role,differences(d.before,d.after||d.current).slice(0,100));}}}
          visit('/var/backups/ramo-nessa-regions');visit('/opt/ramo-nessa-regions/releases');
          DIFFERENCES

