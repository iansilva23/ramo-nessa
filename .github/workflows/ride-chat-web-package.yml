name: Ride chat configured Web and verified installation
on:
  push:
    branches: [ops/ride-chat-web-install-20261023]
    paths:
      - 'deploy/staging/chat*'
      - 'deploy/staging/stage-chat.py'
      - 'deploy/staging/test-chat-web-update.mjs'
      - 'deploy/staging/test_stage_chat.py'
      - 'scripts/web/package_chat_window.mjs'
      - '.github/workflows/ride-chat-web-package.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ride-chat-web-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve the tested application revision
        run: git diff --exit-code 75ca2b7c3d9a97cfaa6f48a3748c2f12867a19f1 HEAD -- backend apps packages config/web
      - name: Unit checks for extraction, scoped plans and argument guards
        run: |
          node --check deploy/staging/chat-web-update.mjs
          node --check deploy/staging/chat-migration.mjs
          node --check deploy/staging/test-chat-web-update.mjs
          node --test deploy/staging/chat-web.test.mjs deploy/staging/google-search-update.test.mjs deploy/staging/asaas-activation-plan-contract.test.mjs deploy/staging/asaas-driver-web-switch-contract.test.mjs
          python3 -m unittest discover -s deploy/staging -p test_stage_chat.py
      - name: Build the exact compiled Guide baseline and the chat patch
        run: |
          mkdir -p baseline
          git archive 7fd822356f84c435d28c0c43b2bcbf585e306710 backend/core apps/admin | tar -x -C baseline
          npm ci --prefix baseline/backend/core --no-audit --no-fund
          npm run build --prefix baseline/backend/core
          npm ci --prefix backend/core --no-audit --no-fund
          npm run build --prefix backend/core
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - name: Build configured Passenger and Driver Web only
        env:
          RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/web/generate_pwa_icons.py
          for role in passenger driver; do
            node scripts/web/prepare_configured_web.mjs --role="$role"
            if [ "$role" = passenger ]; then route=passageiro; else route=motorista; fi
            (cd "apps/$role" && flutter pub get --enforce-lockfile && flutter build web --release --no-web-resources-cdn --base-href="/$route/" --dart-define=RAMO_CORE_BASE_URL= --dart-define=RAMO_PREVIEW_MODE=false)
            node scripts/web/verify_web_bundle.mjs --role="$role" --dist="apps/$role/build/web"
          done
      - name: Verify production Web configuration and stage the reviewed payload
        run: |
          node scripts/web/verify_web_bundle.mjs --role=passenger --dist=apps/passenger/build/web
          node scripts/web/package_chat_window.mjs baseline release
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('RamoNessa-Chat-Web-75ca2b7c.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(pathlib.Path('release').rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to('release'))
          PY
          sha256sum RamoNessa-Chat-Web-75ca2b7c.zip > RamoNessa-Chat-Web-75ca2b7c.zip.sha256
      - name: Use Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm ci --prefix scripts/web/browser-tests --no-audit --no-fund
          node scripts/web/browser-tests/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Configured compiled Web sessions in both roles and browsers
        run: |
          for role in passenger driver; do
            for engine in chromium webkit; do
              RAMO_WEB_TEST_ROLE="$role" RAMO_BROWSER_ENGINE="$engine" node --test scripts/web/web_direct_entry_auth_test.mjs
            done
          done
      - name: Real Docker backup, additive receipts, three recovery scenarios and HTTP chat
        run: |
          docker pull postgres:16
          docker pull caddy:2.11.7-alpine
          sudo --preserve-env=PATH,GITHUB_ACTIONS node deploy/staging/test-chat-web-update.mjs "$PWD/RamoNessa-Chat-Web-75ca2b7c.zip" "$PWD/baseline"
      - name: Package the exact installer sources
        run: |
          git archive HEAD deploy/staging scripts/web | gzip -n > Instalador-Chat-Web-75ca2b7c-r1.tar.gz
          sha256sum Instalador-Chat-Web-75ca2b7c-r1.tar.gz > Instalador-Chat-Web-75ca2b7c-r1.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ride-chat-configured-web-tested
          path: |
            RamoNessa-Chat-Web-75ca2b7c.zip
            RamoNessa-Chat-Web-75ca2b7c.zip.sha256
            Instalador-Chat-Web-75ca2b7c-r1.tar.gz
            Instalador-Chat-Web-75ca2b7c-r1.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-chat-web-session-evidence
          path: artifacts/web-csp/
          if-no-files-found: ignore
  publish-package:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: ride-chat-configured-web-tested, path: package}
      - name: Publish only a verified installation package, no server deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd package
          sha256sum -c RamoNessa-Chat-Web-75ca2b7c.zip.sha256
          sha256sum --check Instalador-Chat-Web-75ca2b7c-r1.tar.gz.sha256
          gh release create ride-chat-web-75ca2b7c-r1 RamoNessa-Chat-Web-75ca2b7c.zip RamoNessa-Chat-Web-75ca2b7c.zip.sha256 Instalador-Chat-Web-75ca2b7c-r1.tar.gz Instalador-Chat-Web-75ca2b7c-r1.tar.gz.sha256 --target "$GITHUB_SHA" --prerelease --latest=false --title 'Chat Web — mensagens não lidas e WhatsApp' --notes 'Passageiro e Motorista Web configurados, delta Core sobre imagem ativa e tabela aditiva de leitura. Chromium/WebKit, backup com restauração isolada, retornos após falha e chat HTTP ensaiados antes de publicar estes arquivos. Não instala automaticamente na VPS. Android/iOS não distribuídos.'
