name: Ramo Nessa V5 - ADM Browser Flow
on:
  push:
    branches: [feature/v5-seven-fixes-20261016]
    paths:
      - 'apps/admin/**'
      - 'scripts/web/admin_localities_browser_test.mjs'
      - '.github/workflows/v5-admin-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-contract:
    name: Localities create/edit/draft safety in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/web/browser-tests/package-lock.json
      - name: Install existing Playwright test dependency
        working-directory: scripts/web/browser-tests
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for local UI tests
        working-directory: scripts/web/browser-tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke without VPS or production data
        run: node --test scripts/web/admin_localities_browser_test.mjs
