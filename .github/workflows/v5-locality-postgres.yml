name: Ramo Nessa V5 - Isolated PostgreSQL Locality Batch

on:
  push:
    branches: [feature/v5-seven-fixes-20261016]
    paths:
      - 'backend/core/src/pricing/**'
      - 'backend/core/src/admin/repositories/postgres-admin-repository.ts'
      - 'backend/core/test/pricing_locality_postgres_atomicity.test.ts'
      - 'backend/core/test/pricing_locality_http_postgres.test.ts'
      - 'backend/core/migrations/**'
      - '.github/workflows/v5-locality-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-postgres-ci:
    name: Atomic locality save against disposable PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ramo_v5_ci
          POSTGRES_USER: ramo_ci
          POSTGRES_PASSWORD: ramo_ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ramo_ci -d ramo_v5_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ramo_ci:ramo_ci_ephemeral_only@127.0.0.1:5432/ramo_v5_ci
      RAMO_V5_ATOMIC_PG_URL: postgresql://ramo_ci:ramo_ci_ephemeral_only@127.0.0.1:5432/ramo_v5_ci
      RAMO_V5_EPHEMERAL_PG: 'true'
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/core/package-lock.json
      - name: Install backend test dependencies
        working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - name: Assert database is local and disposable
        run: |
          test "$RAMO_V5_EPHEMERAL_PG" = "true"
          test "$DATABASE_URL" = "postgresql://ramo_ci:ramo_ci_ephemeral_only@127.0.0.1:5432/ramo_v5_ci"
      - name: Apply real schema migrations only to disposable database
        working-directory: backend/core
        run: npm run db:migrate
      - name: Typecheck and execute isolated PostgreSQL atomicity test
        working-directory: backend/core
        run: |
          npm run typecheck
          node --import tsx --test test/pricing_locality_postgres_atomicity.test.ts
      - name: Run Core HTTP authorization and pricing on localhost only
        working-directory: backend/core
        run: node --import tsx --test test/pricing_locality_http_postgres.test.ts
