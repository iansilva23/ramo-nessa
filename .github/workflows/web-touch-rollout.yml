name: Web touch rollout contracts
on:
  push:
    branches: [ops/web-touch-fix-refresh-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check gateway isolation and archive integrity guards
        run: |
          node --check deploy/staging/refresh-web-bundles.mjs
          node --test deploy/staging/web-refresh-contract.test.mjs
          python3 -m unittest discover -s deploy/staging -p web_refresh_stage_test.py
