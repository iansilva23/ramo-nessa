name: Motorista - toque de nova corrida

on:
  push:
    branches:
      - feature/driver-new-ride-ringtone-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Resolver dependências e atualizar lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolver pacotes do motorista
        working-directory: apps/driver
        run: flutter pub get
      - name: Atualizar somente o lockfile do motorista
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/driver/pubspec.lock; then
            echo 'pubspec.lock ja esta atualizado'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/driver/pubspec.lock
          git commit -m 'build(driver): lock ringtone audio dependency [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  verify:
    name: Compilar e testar ${{ matrix.target }}
    needs: lockfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            runner: ubuntu-24.04
          - target: android
            runner: ubuntu-24.04
          - target: ios
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/driver-new-ride-ringtone-20261101
      - uses: actions/setup-java@v5
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Dependências travadas
        working-directory: apps/driver
        run: flutter pub get --enforce-lockfile
      - name: Análise Flutter
        working-directory: apps/driver
        run: flutter analyze
      - name: Testes
        working-directory: apps/driver
        run: flutter test
      - name: Build Web
        if: matrix.target == 'web'
        working-directory: apps/driver
        run: flutter build web --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Build Android debug
        if: matrix.target == 'android'
        working-directory: apps/driver
        run: flutter build apk --debug --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Build iOS simulator
        if: matrix.target == 'ios'
        working-directory: apps/driver
        run: flutter build ios --simulator --debug --no-pub --no-codesign --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
