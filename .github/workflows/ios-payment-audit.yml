name: iOS Payment Audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ios-payment-audit.yml"
      - "apps/passenger/ios/**"
      - "apps/passenger/lib/src/features/payments/data/card_tokenization_service.dart"
  workflow_dispatch:

concurrency:
  group: ios-payment-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  passenger-ios-payment:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve Passenger dependencies from lockfile
        working-directory: apps/passenger
        run: flutter pub get --enforce-lockfile

      - name: Configure Passenger Google Maps iOS key
        working-directory: apps/passenger/ios/Flutter
        env:
          RAMO_GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_IOS_PASSENGER_API_KEY || secrets.RAMO_GOOGLE_MAPS_IOS_API_KEY }}
        run: printf 'GOOGLE_MAPS_API_KEY = %s\n' "$RAMO_GOOGLE_MAPS_IOS_API_KEY" > GoogleMaps.local.xcconfig

      - name: Check Passenger Firebase push config
        env:
          RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
          RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_APP_ID }}
          RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
          RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
        run: |
          missing=0
          for name in RAMO_FIREBASE_API_KEY RAMO_FIREBASE_APP_ID RAMO_FIREBASE_MESSAGING_SENDER_ID RAMO_FIREBASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::${name} não configurado; este audit iOS compilará com push desativado."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Firebase push configurado para o audit iOS Passageiro."
          fi

      - name: Build Passenger iOS simulator with Mercado Pago
        working-directory: apps/passenger
        env:
          RAMO_MERCADO_PAGO_PUBLIC_KEY: APP_USR-d88c8e2c-cc73-4792-a348-41d6282af1fd
          RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
          RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_APP_ID }}
          RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
          RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
          RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
          SWIFT_VERSION: "5.0"
        run: >
          flutter build ios --simulator --debug
          --dart-define=RAMO_MERCADO_PAGO_PUBLIC_KEY=$RAMO_MERCADO_PAGO_PUBLIC_KEY
          --dart-define=RAMO_FIREBASE_API_KEY=$RAMO_FIREBASE_API_KEY
          --dart-define=RAMO_FIREBASE_APP_ID=$RAMO_FIREBASE_APP_ID
          --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID=$RAMO_FIREBASE_MESSAGING_SENDER_ID
          --dart-define=RAMO_FIREBASE_PROJECT_ID=$RAMO_FIREBASE_PROJECT_ID
          --dart-define=RAMO_FIREBASE_STORAGE_BUCKET=$RAMO_FIREBASE_STORAGE_BUCKET
