name: Driver flow screenshots
on:
  push:
    branches: [review/driver-flow-screenshots]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Instrument the existing driver flow test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/driver/test/driver_flow_test.dart')
          source = path.read_text()
          a = source.index('  for (final viewport in const [')
          b = source.index("  testWidgets(\n    'cadastro aprovado sem supply", a)
          flow = source[a:b].replace('    Size(320, 640),\n    Size(375, 667),\n', '').replace('    Size(430, 932),\n', '')
          flow = flow.replace('        RamoNessaDriverApp(\n', "        RepaintBoundary(key:const Key('real-driver-capture'),child:RamoNessaDriverApp(\n", 1)
          flow = flow.replace('          navigationService: _FakeNavigationService(),\n        ),', '          navigationService: _FakeNavigationService(),\n        )),', 1)
          def capture(stage):
              return f"""      await expectLater(find.byKey(const Key('real-driver-capture')),
                matchesGoldenFile('../../../artifacts/driver-flow/{stage}-__viewport__.png'));
          """.replace('__viewport__', chr(36)+'{viewport.width.toInt()}')
          stages = [
              ('01-nova-corrida', "      await tester.ensureVisible(find.text('Aceitar corrida'));"),
              ('02-indo-buscar', "      await tester.tap(find.text('Cheguei'));"),
              ('03-no-embarque', "      expect(find.text('Iniciar corrida').hitTestable(), findsOneWidget);"),
              ('04-em-andamento', "      expect(find.text('Finalizar corrida').hitTestable(), findsOneWidget);"),
              ('05-finalizada', "      expect(tester.takeException(), isNull, reason: 'resumo final $viewport');"),
          ]
          for stage, anchor in stages:
              assert flow.count(anchor) == 1, stage
              settle = '      await tester.pump(const Duration(seconds: 5));\n      await tester.pumpAndSettle();\n' if stage == '05-finalizada' else ''
              flow = flow.replace(anchor, settle+capture(stage)+anchor, 1)
          a_main = source.index('void main() {')
          # Include all helpers from the real suite, including declarations before the fake API.
          result = ("import 'dart:io';\nimport 'package:flutter/services.dart';\nimport 'ride_identity_visual_review.dart' show fonts;\n"+source[:a_main]+
              'void main() {\n TestWidgetsFlutterBinding.ensureInitialized();\n setUpAll(() async { await fonts(); final bytes=await File("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf").readAsBytes(); await (FontLoader("Ahem")..addFont(Future.value(ByteData.sublistView(bytes)))).load(); });\n setUp(() { TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger.setMockMethodCallHandler(const MethodChannel("br.com.ramonessa.driver/screen-lock"), (_) async => null); });\n'+
              flow + '}\n'+source[source.index('\n}', b)+3:])
          # Simulated cash trip and directions using the same app widgets.
          result = result.replace('final api = _FakeDriverApi();', 'final api = _CaptureDriverApi();', 1)
          result = result.replace('          navigationService: _FakeNavigationService(),', '          navigationService: _FakeNavigationService(),\n          routeService: _CountingRouteService(),', 1)
          begin=result.index('class _FakeDriverApi')
          end=result.index('class _IdentityReviewApi', begin)
          fixture=result[begin:end]
          fixture=fixture.replace('Duration(minutes: 2)', 'Duration(seconds: 35)', 1)
          fixture=fixture.replace('pickupCompensationCents: 200,', "pickupCompensationCents: 200,\n      paymentMethod: 'cash',\n      cashCollectionAmountCents: 12000,\n      cashTenderedCents: 15000,")
          fixture=fixture.replace('pickupCompensationCents: ride.pickupCompensationCents,', 'pickupCompensationCents: ride.pickupCompensationCents,\n      paymentMethod: ride.paymentMethod,\n      cashCollectionAmountCents: ride.cashCollectionAmountCents,\n      cashTenderedCents: ride.cashTenderedCents,')
          result=result[:begin]+fixture+result[end:]
          result += "\nclass _CaptureDriverApi extends _FakeDriverApi implements DriverRideIdentityApi { @override Future<Map<String,dynamic>> rideIdentification(String rideId) async => {'passengerName':'Mariana'}; }\n"
          Path('apps/driver/test/driver_flow_capture_test.dart').write_text(result)
          Path('artifacts/driver-flow').mkdir(parents=True, exist_ok=True)
          # Pin the runtime's normal Android font family instead of the test font.
          theme=Path('packages/design_system/lib/src/theme/ramo_theme.dart')
          theme.write_text(theme.read_text().replace('      useMaterial3: true,', "      useMaterial3: true,\n      fontFamily: 'Roboto',", 1))
          # The screenshot runner has no installed device audio plugin.
          Path('apps/driver/lib/src/features/home/presentation/offer_tone_player_native.dart').write_text(
              'class OfferTonePlayer { void prepare() {} Future<void> startLoop() async {} '
              'Future<void> stop() async {} Future<void> dispose() async {} }')
          PY
      - working-directory: apps/driver
        run: |
          flutter pub get --enforce-lockfile
          flutter test --no-pub --update-goldens test/driver_flow_capture_test.dart
      - name: Assemble the five real screenshots
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root=Path('artifacts/driver-flow')
          fonts='/usr/share/fonts/truetype/dejavu/'
          for width in (320, 390):
              files=sorted(root.glob(f'0*-{width}.png'))
              assert len(files)==5,files
              imgs=[Image.open(f).convert('RGB') for f in files]
              assert all(img.width==width for img in imgs)
              labels=['Nova corrida','Indo buscar','No embarque','Em andamento','Finalizada']
              pad,gap=20,16
              canvas=Image.new('RGB',(pad*2+5*width+4*gap, max(i.height for i in imgs)+104),'#eeeef1')
              draw=ImageDraw.Draw(canvas)
              draw.text((20,16),f'RAMO NESSA  /  MOTORISTA  /  {width} px',font=ImageFont.truetype(fonts+'DejaVuSans-Bold.ttf',27),fill='#121212')
              for index,(im,label) in enumerate(zip(imgs,labels)):
                  x=pad+index*(width+gap)
                  draw.text((x,61),label,font=ImageFont.truetype(fonts+'DejaVuSans-Bold.ttf',19),fill='#121212')
                  canvas.paste(im,(x,89))
              canvas.save(root/f'Ramo-Nessa-Motorista-Fluxo-{width}px.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ramo-nessa-motorista-painel-fixo-previa
          path: artifacts/driver-flow/
          if-no-files-found: error
