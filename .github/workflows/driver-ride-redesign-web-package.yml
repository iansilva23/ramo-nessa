name: Driver Web installer verified recovery
on:
  push:
    branches: [ops/driver-ride-redesign-web-20261023]
    paths: [.github/workflows/driver-ride-redesign-web-package.yml, deploy/staging/*driver-ride-web*, deploy/staging/test_stage_driver_ride_web.py]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: driver-ride-redesign-web-package
  cancel-in-progress: true
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require unchanged tested application and successful configured Web evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code a133772531357e00eaa6ab385d06705dde610735 HEAD -- apps packages backend scripts/web
          gh api repos/iansilva23/ramo-nessa/actions/runs/39983939822 > /tmp/driver-web-evidence.json
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('/tmp/driver-web-evidence.json'));
          if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!=='8ac0c7b996fa09abb40380a0cbd79341d9de867e')throw Error('Configured Web evidence differs.');
          NODE
      - name: Download exact tested configured Web ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/driver-package
          gh release download driver-ride-web-a13377253135 --repo iansilva23/ramo-nessa --pattern RamoNessa-Motorista-Web-a13377253135.zip --dir artifacts/driver-package
          cd artifacts/driver-package
          printf '%s  %s\n' 0cd8a874bdba37ea41caccca0bc8bb13468ceaf4973e11053277269816a0d8b8 RamoNessa-Motorista-Web-a13377253135.zip | sha256sum --check -
          printf '%s  %s\n' 0cd8a874bdba37ea41caccca0bc8bb13468ceaf4973e11053277269816a0d8b8 RamoNessa-Motorista-Web-a13377253135.zip > RamoNessa-Motorista-Web-a13377253135.zip.sha256
      - name: Integrity and installer contracts
        run: |
          node --check deploy/staging/driver-ride-web-update.mjs
          node --test deploy/staging/asaas-driver-web-contract.test.mjs deploy/staging/asaas-driver-web-switch-contract.test.mjs
          python3 -m unittest discover -s deploy/staging -p test_stage_driver_ride_web.py -v
      - name: Rehearse publication, post-switch rollback and missing-container recovery
        run: |
          docker pull caddy:2.11.7-alpine
          sudo env GITHUB_ACTIONS=true PATH="$PATH" node deploy/staging/test-driver-ride-web-update.mjs "$PWD/artifacts/driver-package/RamoNessa-Motorista-Web-a13377253135.zip"
      - name: Package pinned installer sources
        run: |
          git archive HEAD deploy/staging scripts/web | gzip -n > artifacts/driver-package/Instalador-Motorista-Web-a13377253135-r2.tar.gz
          sha256sum artifacts/driver-package/Instalador-Motorista-Web-a13377253135-r2.tar.gz | sed 's|artifacts/driver-package/||' > artifacts/driver-package/Instalador-Motorista-Web-a13377253135-r2.tar.gz.sha256
          cat artifacts/driver-package/Instalador-Motorista-Web-a13377253135-r2.tar.gz.sha256
      - name: Publish tested installer revision with identical configured Web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create driver-ride-web-a13377253135-r2 \
            artifacts/driver-package/RamoNessa-Motorista-Web-a13377253135.zip \
            artifacts/driver-package/RamoNessa-Motorista-Web-a13377253135.zip.sha256 \
            artifacts/driver-package/Instalador-Motorista-Web-a13377253135-r2.tar.gz \
            artifacts/driver-package/Instalador-Motorista-Web-a13377253135-r2.tar.gz.sha256 \
            --prerelease --target "$GITHUB_SHA" --title "Motorista Web — redesign e recuperação verificada" \
            --notes "Mesmo Web validado em 117 testes e Chromium/WebKit no run 39983939822; instalador com publicação, retorno após falha e recriação de Gateway ausente testados com Caddy. Não executa publicação automática na VPS. Não inclui APK/IPA."
      - uses: actions/upload-artifact@v4
        with:
          name: driver-ride-web-final-package
          path: artifacts/driver-package/
          if-no-files-found: error
          retention-days: 14
