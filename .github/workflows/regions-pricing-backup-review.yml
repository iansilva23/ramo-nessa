name: Regions and Pricing - Backup Review
on:
  workflow_dispatch:
  push:
    branches: [feature/admin-regions-pricing-simple-20261020]
    paths:
      - deploy/staging/backup-regions-pricing*
      - .github/workflows/regions-pricing-backup-review.yml
permissions:
  contents: read
jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard contracts
        run: node --test deploy/staging/backup-regions-pricing.test.mjs
      - name: Real Docker backup and isolated PostgreSQL restoration
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:16
          docker pull alpine:3.21
          mkdir -p "$RUNNER_TEMP/regions/web"
          printf 'synthetic-web' > "$RUNNER_TEMP/regions/web/index.html"
          printf 'synthetic-caddy' > "$RUNNER_TEMP/regions/Caddyfile"
          docker volume create regions-ci-docs
          docker run --rm --network none -v regions-ci-docs:/docs alpine:3.21 sh -c 'echo synthetic-document > /docs/test.txt'
          docker run -d --name ramo-nessa-staging-postgres-1 --env POSTGRES_USER=ramo --env POSTGRES_PASSWORD=synthetic-only --env POSTGRES_DB=ramo postgres:16
          for n in $(seq 1 60); do
            if docker exec ramo-nessa-staging-postgres-1 sh -c 'test "$(cat /proc/1/comm)" = postgres && psql -U ramo -d ramo -Atqc "SELECT 1"' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec ramo-nessa-staging-postgres-1 psql -v ON_ERROR_STOP=1 -U ramo -d ramo -c "CREATE TABLE schema_migrations(filename text PRIMARY KEY, checksum text); INSERT INTO schema_migrations VALUES ('synthetic.sql','abc'); CREATE TABLE rides(id int PRIMARY KEY); INSERT INTO rides VALUES(1); CREATE TABLE payments(id int PRIMARY KEY, ride_id int REFERENCES rides(id)); INSERT INTO payments VALUES(1,1);"
          docker run -d --name ramo-nessa-staging-core-1 --mount type=volume,src=regions-ci-docs,dst=/var/lib/ramo-nessa alpine:3.21 sleep 600
          docker run -d --name ramo-nessa-staging-gateway-1 --mount "type=bind,src=$RUNNER_TEMP/regions/web,dst=/srv/web,readonly" --mount "type=bind,src=$RUNNER_TEMP/regions/Caddyfile,dst=/etc/caddy/Caddyfile,readonly" alpine:3.21 sleep 600
          docker run -d --name ramo-nessa-staging-google-maps-mock-1 alpine:3.21 sleep 600
          docker run -d --name ramo-nessa-site-institutional-site-1 alpine:3.21 sleep 600
          image=$(docker inspect -f '{{.Image}}' ramo-nessa-staging-core-1)
          sudo "$(command -v node)" deploy/staging/backup-regions-pricing.mjs "--core-image=$image" "--gateway-image=$image"
          sudo "$(command -v node)" --input-type=module - <<'VERIFY'
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const root='/var/backups/ramo-nessa-regions';
          const dirs=readdirSync(root); assert.equal(dirs.length,1); assert.ok(!dirs[0].endsWith('.incomplete'));
          const directory=root+'/'+dirs[0], manifest=JSON.parse(readFileSync(directory+'/verified.private.json'));
          assert.equal(manifest.databaseRestoredInIsolation,true); assert.equal(manifest.resetApplied,false);
          assert.equal(statSync(directory).mode & 0o777,0o700);
          for(const f of manifest.files) { assert.equal(statSync(directory+'/'+f.name).mode & 0o777,0o600); assert.equal(createHash('sha256').update(readFileSync(directory+'/'+f.name)).digest('hex'),f.sha256); }
          const counts=readFileSync(directory+'/restored-counts.private.txt','utf8'); assert.match(counts,/public.payments\|1/); assert.match(counts,/public.rides\|1/);
          for(const f of ['runtime.private.json','images-before.tar','mount-0.tar.gz','mount-1.tar.gz','mount-2.tar.gz']) assert.ok(manifest.files.some(x=>x.name===f));
          const docker=args=>{const r=spawnSync('docker',args,{encoding:'utf8'}); assert.equal(r.status,0); return r.stdout.trim();};
          assert.equal(docker(['ps','--filter','name=ramo-regions-restore-','--format','{{.Names}}']),'');
          assert.equal(docker(['volume','ls','--filter','label=br.com.ramonessa.regions-backup','--format','{{.Name}}']),'');
          assert.equal(docker(['exec','ramo-nessa-staging-postgres-1','psql','-U','ramo','-d','ramo','-Atqc','SELECT count(*) FROM payments']), '1');
          console.log('Restore, archive hashes, permissions, disposable cleanup and active data preservation verified.');
          VERIFY
