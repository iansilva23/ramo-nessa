name: Current and recovered Pix rollout checks
on:
  push:
    branches: [ops/pix-complete-rollout-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIX_GUARD_PATH: /tmp/pix-complete-prepare-guard.py
      PIX_PACKAGE_PATH: /tmp/pix-complete-passenger-web.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned inputs and both deployment phases
        run: |
          curl -fLsS --retry 2 --max-time 45 https://raw.githubusercontent.com/iansilva23/ramo-nessa/437d951ff1327fbd45cf305f41e90c686846181c/deploy/second-update/prepare.py -o "$PIX_GUARD_PATH"
          curl -fLsS --retry 2 --max-time 120 https://github.com/iansilva23/ramo-nessa/releases/download/pix-completo-20261119-b06e61c8db8e/RamoNessa-Passageiro-Pix-Completo-Web-20261119.zip -o "$PIX_PACKAGE_PATH"
          printf '%s  %s\n' aa586db1ce856ab7d86d6cefc4380847024a096750451dd281db9e651da65393 "$PIX_GUARD_PATH" 09b57fccb92c1bb0a5a6720fae4ec75a94298aae08e9cccfc7b939ed8ea49003 "$PIX_PACKAGE_PATH" | sha256sum -c -
          python3 -m unittest discover -s deploy/pix-complete -p 'test_*.py' -v
      - run: npm ci
        working-directory: backend/core
      - name: Verify compiled Core payload against tested source and smoke both flows
        working-directory: backend/core
        run: |
          npm run build
          python3 - <<'VERIFY'
          from pathlib import Path
          import importlib.util,subprocess
          spec=importlib.util.spec_from_file_location('rollout',Path('../../deploy/pix-complete/core-rollout.py'))
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for name,digest in m.AFTER.items():
              assert m.sha((Path('dist/src')/name).read_bytes())==digest,name
          subprocess.run(['node','--input-type=module','-e',m.SMOKE.replace('/app/dist/src/',str(Path('dist/src').resolve())+'/')],check=True)
          VERIFY
