name: Ride identity and manual cancellation review
on:
  push:
    branches: [feature/ride-identification-cancellation-20261024]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ride-identity-manual-cancellation
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ramonessa, POSTGRES_PASSWORD: ramonessa, POSTGRES_DB: ramonessa}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ramonessa:ramonessa@127.0.0.1:5432/ramonessa
      DB_SSL: 'false'
      RAMO_CANCELLATION_TEST_POSTGRES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
        working-directory: backend/core
      - run: npm run typecheck && npm run db:migrate && npm run db:migrate && npm test && npm run build
        working-directory: backend/core
      - run: npm test --prefix apps/admin
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {app: [passenger, driver]}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile && flutter analyze && flutter test && flutter build web --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
        working-directory: apps/${{ matrix.app }}
      - run: flutter test --update-goldens test/ride_identity_visual_review.dart
        working-directory: apps/${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-identity-visual-${{ matrix.app }}
          path: apps/${{ matrix.app }}/ride-identity-artifacts/
          if-no-files-found: ignore
  admin-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          npm ci --prefix scripts/web/browser-tests --no-audit --no-fund
          node scripts/web/browser-tests/node_modules/playwright/cli.js install --with-deps chromium webkit
          for engine in chromium webkit; do RAMO_BROWSER_ENGINE="$engine" node --test scripts/web/manual_refunds_admin_browser_test.mjs; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: manual-refunds-admin-visual, path: artifacts/manual-refunds/, if-no-files-found: ignore}
