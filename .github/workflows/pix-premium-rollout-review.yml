name: Premium Pix Web rollout checks
on:
  push:
    branches: [ops/pix-premium-rollout-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PIX_GUARD_PATH: /tmp/pix-premium-rollout-prepare-guard.py
      PIX_PACKAGE_PATH: /tmp/pix-premium-rollout-passenger-web.zip
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exactly the already reviewed guard and published package
        run: |
          curl -fLsS --retry 2 --max-time 45 https://raw.githubusercontent.com/iansilva23/ramo-nessa/437d951ff1327fbd45cf305f41e90c686846181c/deploy/second-update/prepare.py -o "$PIX_GUARD_PATH"
          curl -fLsS --retry 2 --max-time 120 https://github.com/iansilva23/ramo-nessa/releases/download/pix-premium-20261119-db71dbd92a68/RamoNessa-Passageiro-Pix-Premium-Web-20261119.zip -o "$PIX_PACKAGE_PATH"
          printf '%s  %s\n' aa586db1ce856ab7d86d6cefc4380847024a096750451dd281db9e651da65393 "$PIX_GUARD_PATH" 1d1afd54ad358f424d5b295baba273ab7cf0dd1cbac26d42ca51419aa2dddf3d "$PIX_PACKAGE_PATH" | sha256sum -c -
      - name: Validate preparation, narrow scope, failure recovery and real bundle
        run: python3 -m unittest discover -s deploy/pix-premium -p test_rollout_web.py -v
