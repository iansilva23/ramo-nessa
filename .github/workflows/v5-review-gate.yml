name: Ramo Nessa V5 - Review Gate

on:
  push:
    branches:
      - feature/v5-seven-fixes-20261016
      - fix/pricing-route-eligibility-20261018
      - integration/pricing-v5-finance-safe-20261019
  pull_request:
    branches:
      - ops/asaas-pricing-integration-20261019
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ramo-v5-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: ADM lint and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Protect approved passenger “Escolha seu destino” card
        if: github.ref == 'refs/heads/integration/pricing-v5-finance-safe-20261019' || github.head_ref == 'integration/pricing-v5-finance-safe-20261019'
        shell: bash
        run: |
          set -euo pipefail
          card=apps/passenger/lib/src/features/home/presentation/widgets/ride_bottom_sheet.dart
          # Exact Git blob of the already-approved component in the PR #35 base.
          # Any intentional redesign requires the owner's explicit approval
          # and a separately reviewed update to this baseline.
          approved_blob=989b87d931937f45b8217f8a63191e4b7c7c57b8
          current_blob=$(git hash-object -- "$card")
          if [[ "$current_blob" != "$approved_blob" ]]; then
            echo "::error file=$card::Card Escolha seu destino mudou sem autorização explícita."
            exit 1
          fi
          echo "Card Escolha seu destino preservado: $current_blob" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source syntax
        working-directory: apps/admin
        run: npm run check
      - name: Run ADM regression tests
        working-directory: apps/admin
        run: npm test

  shared-flutter:
    name: Shared Flutter design system
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/design_system
        run: flutter pub get
      - name: Analyze and test shared UI
        working-directory: packages/design_system
        run: |
          flutter analyze --no-fatal-infos
          flutter test

  flutter-apps:
    name: Flutter ${{ matrix.app }} analyze and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get --enforce-lockfile
      - name: Analyze and run widget tests
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter analyze --no-fatal-infos
          flutter test

  core:
    name: Backend Core typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/core/package-lock.json
      - name: Install without running providers or connecting to production
        working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - name: Typecheck and test Core
        working-directory: backend/core
        run: |
          npm run typecheck
          npm test
      - name: Export read-only V5 commercial and municipality audit
        working-directory: backend/core
        run: |
          node --import tsx scripts/v5-release-readiness-report.ts "$RUNNER_TEMP/v5-release-readiness.md"
          cat "$RUNNER_TEMP/v5-release-readiness.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload static V5 release audit for human review
        uses: actions/upload-artifact@v4
        with:
          name: v5-readiness-source-code-audit
          path: |
            ${{ runner.temp }}/v5-release-readiness.md
            ${{ runner.temp }}/v5-release-readiness.json
          if-no-files-found: error
          retention-days: 14

  admin-browser:
    name: ADM Chromium isolated browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install disposable Playwright runner
        working-directory: apps/admin
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.1
      - name: Install Chromium in isolated CI runner
        working-directory: apps/admin
        run: npx playwright install --with-deps chromium
      - name: Browser smoke with loopback-only API mocks
        working-directory: apps/admin
        run: node test/browser/pricing-admin-smoke.mjs
      - name: Upload synthetic desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-admin-browser-evidence
          path: apps/admin/pricing-browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7


  pricing-postgres:
    name: Pricing V5 PostgreSQL 16 disposable lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ramo_v5_ci
          POSTGRES_USER: ramo_ci
          POSTGRES_PASSWORD: ramo_ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ramo_ci -d ramo_v5_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ramo_ci:ramo_ci_ephemeral_only@127.0.0.1:5432/ramo_v5_ci
      RAMO_V5_ATOMIC_PG_URL: postgresql://ramo_ci:ramo_ci_ephemeral_only@127.0.0.1:5432/ramo_v5_ci
      RAMO_V5_EPHEMERAL_PG: 'true'
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/core/package-lock.json
      - name: Install Core packages without provider calls
        working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - name: Refuse non-disposable database
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$RAMO_V5_EPHEMERAL_PG" = "true"
          test "$DATABASE_URL" = "postgresql://ramo_ci:ramo_ci_ephemeral_only@127.0.0.1:5432/ramo_v5_ci"
      - name: Apply real historical migrations to ephemeral PostgreSQL only
        working-directory: backend/core
        run: npm run db:migrate
      - name: Install existing isolated Chromium E2E dependencies
        working-directory: scripts/web/browser-tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test pricing persistence, CAS and future effective versions
        working-directory: backend/core
        run: |
          npm run typecheck
          node --import tsx --test test/postgres_pricing_v5_finance_safe.test.ts test/pricing_locality_postgres_atomicity.test.ts
      - name: Test real Core HTTP, ADM API and Chromium against disposable PostgreSQL
        working-directory: backend/core
        run: node --import tsx --test test/pricing_locality_http_postgres.test.ts
