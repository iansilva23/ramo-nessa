name: Password-only access - passenger and driver partner
on:
  push:
    branches: [feature/driver-password-login-20261103]
    paths: ['backend/core/**', 'apps/driver/**', 'apps/passenger/**', 'packages/design_system/**', '.github/workflows/driver-password-login.yml', 'deploy/driver-password/package-core.mjs']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: driver-password-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ramonessa:ramonessa@127.0.0.1:5432/ramonessa
      DB_SSL: 'false'
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ramonessa, POSTGRES_PASSWORD: ramonessa, POSTGRES_DB: ramonessa}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ramonessa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix backend/core --no-audit --no-fund
      - run: npm run typecheck --prefix backend/core && npm run build --prefix backend/core
      - name: Apply and verify additive schema in disposable PostgreSQL
        run: node backend/core/dist/scripts/migrate.js
      - name: Complete Core regressions and real PostgreSQL auth tests
        working-directory: backend/core
        run: npm test
      - name: Package Core without retired authentication modules
        run: |
          test ! -e backend/core/dist/src/auth/phone-otp-service.js
          test ! -e backend/core/dist/src/auth/otp-delivery-provider.js
          test ! -e backend/core/dist/src/auth/entrar-whatsapp-otp-provider.js
          mkdir -p release/driver-password
          cd backend/core
          zip -qr ../../release/driver-password/RamoNessa-Core-Acesso-Senha.zip dist migrations package.json package-lock.json
          cd ../../release/driver-password
          sha256sum *.zip > SHA256SUMS-Core
      - uses: actions/upload-artifact@v4
        with: {name: driver-password-core, path: release/driver-password/, if-no-files-found: error}
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
      RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_ANDROID_DRIVER_API_KEY || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY }}
      RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
      RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_ANDROID_DRIVER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_ANDROID_DRIVER_APP_ID || secrets.RAMO_FIREBASE_DRIVER_APP_ID }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
      RAMO_PREVIEW_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - name: Validate retained Maps and Firebase configuration
        run: |
          node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_ANDROID_API_KEY --surface='Driver password Android'
          node tooling/validate-firebase-mobile-config.mjs --platform=android --surface='Driver password Android'
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/driver
      - name: Driver analysis and full existing plus new auth tests
        working-directory: apps/driver
        run: flutter analyze && flutter test
      - name: Build connected Android APK with retained stable test signing
        working-directory: apps/driver
        run: |
          flutter build apk --release --no-pub --build-number="$(date +%s)" \
            --dart-define=RAMO_PREVIEW_MODE=false --dart-define=RAMO_APP_VERSION=0.1.0-driver-password \
            --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
            --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
            --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
            --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
            --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
      - name: Prepare retained public Web configuration
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/web/generate_pwa_icons.py
          node scripts/web/prepare_configured_web.mjs --role=driver
      - name: Build Driver Web
        working-directory: apps/driver
        run: flutter build web --release --no-web-resources-cdn --base-href=/motorista/ --dart-define=RAMO_CORE_BASE_URL= --dart-define=RAMO_PREVIEW_MODE=false
      - name: Verify and package connected artifacts
        run: |
          node scripts/web/verify_web_bundle.mjs --role=driver --dist=apps/driver/build/web
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$signer" verify apps/driver/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p release/driver-password
          cp apps/driver/build/app/outputs/flutter-apk/app-release.apk release/driver-password/RamoNessa-Motorista-Login-Senha.apk
          python3 - <<'PY'
          import zipfile, pathlib, os, json, hashlib
          root=pathlib.Path('apps/driver/build/web')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          with zipfile.ZipFile('release/driver-password/RamoNessa-Motorista-Login-Web.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('manifest.json',json.dumps({'schema':1,'source':os.environ['GITHUB_SHA'],'role':'driver','basePath':'/motorista/','files':files}))
              for path in files: z.write(root/path,'driver/'+path)
          PY
          cd release/driver-password
          sha256sum *.apk *.zip > SHA256SUMS-Driver
          printf 'source=%s\napi=https://app.ramonessa.com.br\npreviewMode=false\nsigning=existing-test-key-not-for-store\n' "$GITHUB_SHA" > LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with: {name: driver-password-apps, path: release/driver-password/, if-no-files-found: error}
  passenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
      RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_ANDROID_PASSENGER_API_KEY || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY }}
      RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
      RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_PASSENGER_APP_ID }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
      RAMO_PREVIEW_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - name: Validate retained Maps and Firebase configuration
        run: |
          node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_ANDROID_API_KEY --surface='Passenger password Android'
          node tooling/validate-firebase-mobile-config.mjs --platform=android --surface='Passenger password Android'
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/passenger
      - name: Passenger analysis and full existing plus new auth tests
        working-directory: apps/passenger
        run: flutter analyze && flutter test
      - name: Build connected Android APK with retained stable test signing
        working-directory: apps/passenger
        run: |
          flutter build apk --release --no-pub --build-number="$(date +%s)" \
            --dart-define=RAMO_PREVIEW_MODE=false --dart-define=RAMO_APP_VERSION=0.1.0-driver-password \
            --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
            --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
            --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
            --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
            --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
      - name: Prepare retained public Web configuration
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/web/generate_pwa_icons.py
          node scripts/web/prepare_configured_web.mjs --role=passenger
      - name: Build Passenger Web
        working-directory: apps/passenger
        run: flutter build web --release --no-web-resources-cdn --base-href=/passageiro/ --dart-define=RAMO_CORE_BASE_URL= --dart-define=RAMO_PREVIEW_MODE=false
      - name: Verify and package connected artifacts
        run: |
          node scripts/web/verify_web_bundle.mjs --role=passenger --dist=apps/passenger/build/web
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$signer" verify apps/passenger/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p release/driver-password
          cp apps/passenger/build/app/outputs/flutter-apk/app-release.apk release/driver-password/RamoNessa-Passageiro-Login-Senha.apk
          python3 - <<'PY'
          import zipfile, pathlib, os, json, hashlib
          root=pathlib.Path('apps/passenger/build/web')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          with zipfile.ZipFile('release/driver-password/RamoNessa-Passageiro-Login-Web.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('manifest.json',json.dumps({'schema':1,'source':os.environ['GITHUB_SHA'],'role':'passenger','basePath':'/passageiro/','files':files}))
              for path in files: z.write(root/path,'passenger/'+path)
          PY
          cd release/driver-password
          sha256sum *.apk *.zip > SHA256SUMS-Passenger
          printf 'source=%s\napi=https://app.ramonessa.com.br\npreviewMode=false\nsigning=existing-test-key-not-for-store\n' "$GITHUB_SHA" > LEIA-ME-Passageiro.txt
      - uses: actions/upload-artifact@v4
        with: {name: passenger-password-apps, path: release/driver-password/, if-no-files-found: error}
  ios:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
      RAMO_GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_IOS_DRIVER_API_KEY }}
      RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_IOS_DRIVER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_IOS_DRIVER_APP_ID }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - name: Validate retained iOS services
        run: |
          node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_IOS_API_KEY --surface='Driver password iOS'
          node tooling/validate-firebase-mobile-config.mjs --platform=ios --surface='Driver password iOS'
          printf 'GOOGLE_MAPS_API_KEY = %s\n' "$RAMO_GOOGLE_MAPS_IOS_API_KEY" > apps/driver/ios/Flutter/GoogleMaps.local.xcconfig
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/driver
      - name: Build iPhone code without Apple distribution signing
        working-directory: apps/driver
        run: |
          flutter build ios --release --no-codesign --no-pub --build-number="$(date +%s)" \
            --dart-define=RAMO_PREVIEW_MODE=false --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
            --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
            --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
            --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
            --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
      - name: Package unsigned iPhone build separately
        run: |
          mkdir -p release/driver-password
          ditto -c -k --sequesterRsrc --keepParent apps/driver/build/ios/iphoneos/Runner.app release/driver-password/RamoNessa-Motorista-Login-iPhone-SEM-ASSINATURA.zip
          printf 'Exige assinatura e provisionamento Apple. Nao instalavel diretamente. Fonte %s\n' "$GITHUB_SHA" > release/driver-password/LEIA-ME-iPhone.txt
      - uses: actions/upload-artifact@v4
        with: {name: driver-password-ios, path: release/driver-password/, if-no-files-found: error}
  passenger-ios:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
      RAMO_GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_IOS_PASSENGER_API_KEY }}
      RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_APP_ID }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - name: Validate retained iOS services
        run: |
          node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_IOS_API_KEY --surface='Passenger password iOS'
          node tooling/validate-firebase-mobile-config.mjs --platform=ios --surface='Passenger password iOS'
          printf 'GOOGLE_MAPS_API_KEY = %s\n' "$RAMO_GOOGLE_MAPS_IOS_API_KEY" > apps/passenger/ios/Flutter/GoogleMaps.local.xcconfig
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/passenger
      - name: Build iPhone code without Apple distribution signing
        working-directory: apps/passenger
        run: |
          flutter build ios --release --no-codesign --no-pub --build-number="$(date +%s)" \
            --dart-define=RAMO_PREVIEW_MODE=false --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
            --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
            --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
            --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
            --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
      - name: Package unsigned iPhone build separately
        run: |
          mkdir -p release/driver-password
          ditto -c -k --sequesterRsrc --keepParent apps/passenger/build/ios/iphoneos/Runner.app release/driver-password/RamoNessa-Passageiro-Login-iPhone-SEM-ASSINATURA.zip
          printf 'Exige assinatura e provisionamento Apple. Nao instalavel diretamente. Fonte %s\n' "$GITHUB_SHA" > release/driver-password/LEIA-ME-iPhone-Passageiro.txt
      - uses: actions/upload-artifact@v4
        with: {name: passenger-password-ios, path: release/driver-password/, if-no-files-found: error}
  publish:
    needs: [backend, driver, passenger, ios, passenger-ios]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: "*-password-*", path: release, merge-multiple: true}
      - name: Publish tested operator artifacts only; no VPS deployment
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          cd release
          sha256sum -c SHA256SUMS-Core
          sha256sum -c SHA256SUMS-Driver
          sha256sum -c SHA256SUMS-Passenger
          gh release create "driver-password-${GITHUB_SHA:0:12}" ./*.zip ./*.apk ./SHA256SUMS* ./LEIA-ME*.txt --target "$GITHUB_SHA" --prerelease --latest=false --title 'Acesso por senha - passageiro e motorista parceiro' --notes 'Acesso por senha sem autenticacao WhatsApp nem recuperacao. Dois apps usam o mesmo fluxo visual. Core tem migration aditiva de retirada 102. Nao instala na VPS automaticamente; nao executar instaladores antigos. Android com assinatura de teste existente. iPhone sem assinatura Apple.'
