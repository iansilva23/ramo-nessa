name: Passenger CI

on:
  push:
    paths:
      - "apps/passenger/**"
      - "packages/design_system/**"
      - ".github/workflows/passenger-ci.yml"
  pull_request:
    paths:
      - "apps/passenger/**"
      - "packages/design_system/**"
      - ".github/workflows/passenger-ci.yml"

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get design system dependencies
        working-directory: packages/design_system
        run: flutter pub get

      - name: Analyze design system
        working-directory: packages/design_system
        run: flutter analyze

      - name: Test design system
        working-directory: packages/design_system
        run: flutter test

      - name: Get passenger dependencies
        working-directory: apps/passenger
        run: flutter pub get

      - name: Analyze passenger
        working-directory: apps/passenger
        run: flutter analyze

      - name: Test passenger
        working-directory: apps/passenger
        run: flutter test

      - name: Build Android debug APK
        working-directory: apps/passenger
        run: flutter build apk --debug
