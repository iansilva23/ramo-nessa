name: Regions and Pricing - Web Review
on:
  push:
    branches: [feature/admin-regions-pricing-simple-20261020]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: regions-pricing-web-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/core/package-lock.json
      - name: Preserve financial providers and native projects
        run: |
          git diff --exit-code 6f90c616ec181943d093b0e373e21fdb23b57f4f -- backend/core/src/payments backend/core/src/finance backend/core/src/wallet backend/core/migrations apps/admin/src/payout-policy.js apps/driver/android apps/driver/ios apps/passenger/android apps/passenger/ios apps/passenger/lib/src/features/home/presentation/widgets/ride_bottom_sheet.dart
      - working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - working-directory: backend/core
        run: npm run typecheck && npm test && npm run build
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: apps/admin
        run: npm run check && npm run check:help && npm test
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - working-directory: apps/${{ matrix.app }}
        run: flutter pub get --enforce-lockfile
      - name: Verify route and GPS selection races on Web screen
        if: matrix.app == 'passenger'
        working-directory: apps/passenger
        run: flutter test --platform chrome --reporter expanded test/web_map_selection_race_test.dart
      - name: Verify Web pin map SDK ownership on Chrome
        if: matrix.app == 'passenger'
        working-directory: apps/passenger
        run: flutter test --platform chrome --reporter expanded test/web_pin_map_lifecycle_test.dart
      - name: Verify managed region route availability on Chrome
        if: matrix.app == 'passenger'
        working-directory: apps/passenger
        run: flutter test --platform chrome --reporter expanded test/managed_route_availability_test.dart test/google_primary_search_test.dart
      - working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos && flutter test
      - name: Verify shared map projection and padding
        if: matrix.app == 'passenger'
        working-directory: packages/design_system
        run: flutter pub get && flutter test test/ramo_map_camera_fit_test.dart
      - name: Verify Web map camera regression on Chrome without touch input
        working-directory: apps/${{ matrix.app }}
        run: flutter test --platform chrome test/web_map_camera_test.dart
      - name: Prove early Web route regression on the installed source
        if: matrix.app == 'passenger'
        shell: bash
        run: |
          set -euo pipefail
          map_home_file=apps/passenger/lib/src/features/home/presentation/passenger_home_screen.dart
          saved=$(mktemp)
          cp "$map_home_file" "$saved"
          trap 'cp "$saved" "$map_home_file"; rm -f "$saved"' EXIT
          git show fb76419fc003fb5ee89cb952a6ec72d2abc11541:"$map_home_file" > "$map_home_file"
          set +e
          (cd apps/passenger && flutter test --platform chrome --reporter expanded test/web_map_selection_race_test.dart --plain-name 'Web waits for search transition before applying the selected route') > "$RUNNER_TEMP/map-return-regression.log" 2>&1
          result=$?
          set -e
          cp "$saved" "$map_home_file"
          rm -f "$saved"
          trap - EXIT
          if test "$result" = 0; then
            echo 'Expected the installed version to fail the route transition regression.'
            exit 1
          fi
          if ! grep -q WEB_ROUTE_MUST_WAIT_FOR_SEARCH_TRANSITION "$RUNNER_TEMP/map-return-regression.log"; then
            cat "$RUNNER_TEMP/map-return-regression.log"
            exit 1
          fi
          echo 'Installed source reproduces route computation before reverse transition completion.'


      - name: Verify managed pricing on actual Chrome runtime
        if: matrix.app == 'passenger'
        working-directory: apps/passenger
        run: flutter test --platform chrome --reporter expanded test/managed_pricing_catalog_test.dart
      - name: Prove generated region routes were blocked by installed Web matrix
        if: matrix.app == 'passenger'
        shell: bash
        run: |
          set -euo pipefail
          route_home_file=apps/passenger/lib/src/features/home/presentation/passenger_home_screen.dart
          saved=$(mktemp)
          cp "$route_home_file" "$saved"
          trap 'cp "$saved" "$route_home_file"; rm -f "$saved"' EXIT
          git show 0ad3ba73cfe2a1265344de09c75309b95daac8dd:"$route_home_file" > "$route_home_file"
          set +e
          (cd apps/passenger && flutter test --platform chrome --reporter expanded test/managed_route_availability_test.dart --plain-name 'managed route Fortaleza fixture, reverse=false reaches authoritative quote') > "$RUNNER_TEMP/managed-region-regression.log" 2>&1
          result=$?
          set -e
          cp "$saved" "$route_home_file"
          rm -f "$saved"
          trap - EXIT
          if test "$result" = 0; then
            echo 'Expected installed Web route matrix to reject generated region ID.'
            exit 1
          fi
          if ! grep -q MANAGED_GENERATED_REGION_MUST_REACH_ROUTE "$RUNNER_TEMP/managed-region-regression.log"; then
            cat "$RUNNER_TEMP/managed-region-regression.log"
            exit 1
          fi
          echo 'Installed Web matrix reproduces generated region route rejection.'
      - working-directory: apps/${{ matrix.app }}
        run: flutter build web --release --dart-define=RAMO_CORE_BASE_URL=https://example.invalid --dart-define=RAMO_PREVIEW_MODE=false
      - name: Review bundle only, no deployment
        uses: actions/upload-artifact@v4
        with:
          name: regions-pricing-web-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/web
          retention-days: 7

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ramo_v5_ci
          POSTGRES_USER: ramo_ci
          POSTGRES_PASSWORD: ramo_ci_ephemeral_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ramo_ci -d ramo_v5_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ramo_ci:ramo_ci_ephemeral_only@127.0.0.1:5432/ramo_v5_ci
      RAMO_V5_EPHEMERAL_PG: 'true'
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - working-directory: backend/core
        run: npm run db:migrate
      - working-directory: backend/core
        run: node --import tsx --test test/postgres_managed_operations.test.ts test/postgres_pricing_v5_finance_safe.test.ts test/postgres_google_primary_http.test.ts

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - working-directory: apps/admin
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.1
      - working-directory: apps/admin
        run: npx playwright install --with-deps chromium webkit
      - name: Real controller, HTTP, pricing, password and MFA on loopback
        working-directory: backend/core
        run: node --import tsx ../../apps/admin/test/browser/regions-pricing-flow.mjs
      - name: Upload browser evidence with synthetic data only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regions-pricing-browser-evidence
          path: apps/admin/regions-browser-artifacts
          if-no-files-found: ignore
          retention-days: 14


