name: Regions and Pricing - Web Review
on:
  push:
    branches: [feature/admin-regions-pricing-simple-20261020]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: regions-pricing-web-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/core/package-lock.json
      - name: Preserve financial providers and native projects
        run: |
          git diff --exit-code 6f90c616ec181943d093b0e373e21fdb23b57f4f -- backend/core/src/payments backend/core/src/finance backend/core/src/wallet backend/core/migrations apps/admin/src/payout-policy.js apps/driver/android apps/driver/ios apps/passenger/android apps/passenger/ios apps/passenger/lib/src/features/home/presentation/widgets/ride_bottom_sheet.dart
      - working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - working-directory: backend/core
        run: npm run typecheck && npm test && npm run build
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: apps/admin
        run: npm run check && npm run check:help && npm test
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - working-directory: apps/${{ matrix.app }}
        run: flutter pub get --enforce-lockfile
      - working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos && flutter test
      - name: Verify shared map projection and padding
        if: matrix.app == 'passenger'
        working-directory: packages/design_system
        run: flutter pub get && flutter test test/ramo_map_camera_fit_test.dart
      - name: Verify Web map camera regression on Chrome without touch input
        working-directory: apps/${{ matrix.app }}
        run: flutter test --platform chrome test/web_map_camera_test.dart
      - name: Verify route and GPS selection races on Web screen
        if: matrix.app == 'passenger'
        working-directory: apps/passenger
        run: flutter test --platform chrome --reporter expanded test/web_map_selection_race_test.dart
      - name: Verify managed pricing on actual Chrome runtime
        if: matrix.app == 'passenger'
        working-directory: apps/passenger
        run: flutter test --platform chrome test/managed_pricing_catalog_test.dart
      - working-directory: apps/${{ matrix.app }}
        run: flutter build web --release --dart-define=RAMO_CORE_BASE_URL=https://example.invalid --dart-define=RAMO_PREVIEW_MODE=false
      - name: Review bundle only, no deployment
        uses: actions/upload-artifact@v4
        with:
          name: regions-pricing-web-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/web
          retention-days: 7

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ramo_v5_ci
          POSTGRES_USER: ramo_ci
          POSTGRES_PASSWORD: ramo_ci_ephemeral_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ramo_ci -d ramo_v5_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ramo_ci:ramo_ci_ephemeral_only@127.0.0.1:5432/ramo_v5_ci
      RAMO_V5_EPHEMERAL_PG: 'true'
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - working-directory: backend/core
        run: npm run db:migrate
      - working-directory: backend/core
        run: node --import tsx --test test/postgres_managed_operations.test.ts test/postgres_pricing_v5_finance_safe.test.ts

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - working-directory: apps/admin
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.1
      - working-directory: apps/admin
        run: npx playwright install --with-deps chromium webkit
      - name: Real controller, HTTP, pricing, password and MFA on loopback
        working-directory: backend/core
        run: node --import tsx ../../apps/admin/test/browser/regions-pricing-flow.mjs
      - name: Upload browser evidence with synthetic data only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regions-pricing-browser-evidence
          path: apps/admin/regions-browser-artifacts
          if-no-files-found: ignore
          retention-days: 14


