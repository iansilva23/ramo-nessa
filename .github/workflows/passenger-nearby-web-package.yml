name: Passenger nearby - configured Web and verified installation
on:
  push:
    branches: [ops/passenger-nearby-web-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passenger-nearby-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve tested application source
        run: git diff --exit-code 9ccd91e0c8dfd69eb5401a86b7c91975ba0d454c HEAD -- backend apps packages config/web
      - name: Installer and safe extraction contracts
        run: |
          node --check deploy/staging/nearby-web-update.mjs
          node --test deploy/staging/nearby-web.test.mjs
          python3 deploy/staging/test_stage_nearby.py
      - name: Download exact previous configured bundles
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release download ride-chat-web-75ca2b7c-r1 --pattern RamoNessa-Chat-Web-75ca2b7c.zip --dir /tmp/previous-chat
          gh release download passenger-rating-web-20261023-r1 --pattern RamoNessa-Avaliacao-Passageiro-Web.zip --dir /tmp/previous-rating
          printf '%s  %s\n' 00220b162e99aa57b604ade3d4a3eabb4370ea28e3aedcf98ca42cc0a1d63966 /tmp/previous-chat/RamoNessa-Chat-Web-75ca2b7c.zip 5d1e87c9f1885db58f149444155d3489b8e87f04e7859c5f444ee4239f85151c /tmp/previous-rating/RamoNessa-Avaliacao-Passageiro-Web.zip | sha256sum --check -
          python3 - <<'PY'
          import zipfile
          for archive,prefix in [('/tmp/previous-chat/RamoNessa-Chat-Web-75ca2b7c.zip','passenger/'),('/tmp/previous-rating/RamoNessa-Avaliacao-Passageiro-Web.zip','driver/')]:
              with zipfile.ZipFile(archive) as z:
                  for n in z.namelist():
                      if n.startswith(prefix): z.extract(n,'baseline-web')
          PY
      - name: Build baseline and reviewed Core patch
        run: |
          mkdir baseline
          git archive ec4bc00d6ffd8d3d5708fdd97a49f3d2e18ddb25 backend/core apps/admin | tar -x -C baseline
          npm ci --prefix baseline/backend/core --no-audit --no-fund
          npm run build --prefix baseline/backend/core
          npm ci --prefix backend/core --no-audit --no-fund
          npm run build --prefix backend/core
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - name: Build configured Passenger Web only
        env:
          RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/web/generate_pwa_icons.py
          node scripts/web/prepare_configured_web.mjs --role=passenger
          (cd apps/passenger && flutter pub get --enforce-lockfile && flutter build web --release --no-web-resources-cdn --base-href=/passageiro/ --dart-define=RAMO_CORE_BASE_URL= --dart-define=RAMO_PREVIEW_MODE=false)
          node scripts/web/verify_web_bundle.mjs --role=passenger --dist=apps/passenger/build/web
      - name: Stage exact reviewed payload
        run: |
          node scripts/web/package_nearby_window.mjs baseline release
          python3 - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('RamoNessa-Passageiro-Veiculos-Proximos-Web.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(pathlib.Path('release').rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to('release'))
          PY
          sha256sum RamoNessa-Passageiro-Veiculos-Proximos-Web.zip > RamoNessa-Passageiro-Veiculos-Proximos-Web.zip.sha256
      - name: Browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          npm ci --prefix scripts/web/browser-tests --no-audit --no-fund
          node scripts/web/browser-tests/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Configured compiled Web login sessions in both browsers
        run: |
          for engine in chromium webkit; do
            RAMO_WEB_TEST_ROLE=passenger RAMO_BROWSER_ENGINE="$engine" node --test scripts/web/web_direct_entry_auth_test.mjs
          done
      - name: Real backup, preservation, update and rollback rehearsal
        run: |
          docker pull postgres:16
          docker pull caddy:2.11.7-alpine
          sudo --preserve-env=PATH,GITHUB_ACTIONS node deploy/staging/test-nearby-web-update.mjs "$PWD/RamoNessa-Passageiro-Veiculos-Proximos-Web.zip" "$PWD/baseline"
      - name: Package installer
        run: |
          git archive HEAD deploy/staging scripts/web | gzip -n > Instalador-Veiculos-Proximos-Web-r1.tar.gz
          sha256sum Instalador-Veiculos-Proximos-Web-r1.tar.gz > Instalador-Veiculos-Proximos-Web-r1.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: passenger-nearby-configured-web-tested
          path: |
            RamoNessa-Passageiro-Veiculos-Proximos-Web.zip
            RamoNessa-Passageiro-Veiculos-Proximos-Web.zip.sha256
            Instalador-Veiculos-Proximos-Web-r1.tar.gz
            Instalador-Veiculos-Proximos-Web-r1.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: passenger-nearby-web-session-evidence, path: artifacts/web-csp/, if-no-files-found: ignore}
  publish-package:
    needs: package
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: passenger-nearby-configured-web-tested, path: release}
      - name: Publish tested installation assets
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create passenger-nearby-web-20261024-r1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Veículos próximos no Passageiro Web" --notes "Pacote Web testado com instalação e retorno verificados. Sem publicação Android/iOS." release/*
