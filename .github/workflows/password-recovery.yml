name: Password recovery validation

on:
  push:
    branches: [feature/password-recovery-20261104, feature/recovery-flow-20261104]
  pull_request:
    branches: [feature/driver-password-login-20261103]
    paths: [backend/core/**, apps/driver/**, apps/passenger/**, packages/design_system/**, .github/workflows/password-recovery.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://ramonessa:ramonessa@127.0.0.1:5432/ramonessa
      DB_SSL: 'false'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ramonessa
          POSTGRES_PASSWORD: ramonessa
          POSTGRES_DB: ramonessa
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ramonessa" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run build
      - run: node dist/scripts/migrate.js
      - run: npm test

  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      matrix:
        role: [driver, passenger]
    defaults:
      run:
        working-directory: apps/${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/password_access_visual_test.dart test/password_registration_http_test.dart
