name: Direct Web entry - isolated switch and recovery
on:
  push:
    branches: [feature/admin-web-entry-toggle-20261021]
    paths:
      - deploy/staging/*direct-entry*
      - .github/workflows/web-direct-entry-update-review.yml
permissions:
  contents: read
  actions: read
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact removal, guards and backward-compatible staging
        run: |
          node --test deploy/staging/web-direct-entry.test.mjs deploy/staging/asaas-driver-web-switch-contract.test.mjs
          python3 -m unittest discover -s deploy/staging -p test_stage_regions_web.py
          node --check deploy/staging/prepare-web-direct-entry.mjs
          node --check deploy/staging/activate-web-direct-entry.mjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39693460184
          artifact-ids: '12389892455'
          path: approved
          merge-multiple: true
      - name: Download disposable service images
        run: |
          docker pull caddy:2.11.7-alpine
          docker pull postgres:16
      - name: Actual HTTP switch and forced recovery with protected service/database sentinels
        run: sudo --preserve-env=PATH,GITHUB_ACTIONS node deploy/staging/test-web-direct-entry.mjs
