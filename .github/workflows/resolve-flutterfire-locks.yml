name: Resolve FlutterFire Locks

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/passenger/pubspec.yaml"
      - "apps/driver/pubspec.yaml"
      - ".github/workflows/resolve-flutterfire-locks.yml"

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve Passenger
        working-directory: apps/passenger
        run: flutter pub get

      - name: Resolve Driver
        working-directory: apps/driver
        run: flutter pub get

      - name: Commit resolved lockfiles
        run: |
          if git diff --quiet -- apps/passenger/pubspec.lock apps/driver/pubspec.lock; then
            echo "Lockfiles already resolved."
            exit 0
          fi
          git config user.name "ramo-nessa-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/passenger/pubspec.lock apps/driver/pubspec.lock
          git commit -m "chore(push): resolve FlutterFire lockfiles"
          git push origin "HEAD:${{ github.head_ref }}"
