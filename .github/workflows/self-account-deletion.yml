name: Self account deletion and external request page
'on':
  push:
    branches: [feature/self-account-deletion-20261106]
permissions: {contents: read}
concurrency:
  group: self-account-deletion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ramonessa:ramonessa@127.0.0.1:5432/ramonessa
      DB_SSL: 'false'
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ramonessa, POSTGRES_PASSWORD: ramonessa, POSTGRES_DB: ramonessa}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ramonessa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix backend/core --no-audit --no-fund
      - run: npm run typecheck --prefix backend/core && npm run build --prefix backend/core
      - run: node backend/core/dist/scripts/migrate.js
      - name: Account and existing financial and authentication regressions
        working-directory: backend/core
        run: npm test
      - name: Validate the public deletion route in Caddy
        run: docker run --rm -v "$PWD/deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro" -e APP_DOMAIN=app.example.test -e ACME_EMAIL=ci@example.test caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Test the external page with a real browser and synthetic API
        run: |
          npm ci --prefix scripts/web/browser-tests --no-audit --no-fund
          node scripts/web/browser-tests/node_modules/playwright/cli.js install --with-deps chromium
          node --test scripts/web/account_deletion_page_test.mjs
  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: {role: [passenger, driver]}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - working-directory: packages/design_system
        run: flutter pub get && flutter analyze && flutter test
      - working-directory: apps/${{ matrix.role }}
        run: flutter pub get --enforce-lockfile && flutter analyze && flutter test && flutter build web --release --no-pub --dart-define=RAMO_PREVIEW_MODE=false --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Preserve approved Guide, map and camera source
        run: |
          git diff --exit-code 6a7066bfbef533363821610d73d3acb7e4af577d HEAD -- apps/passenger/lib/src/features/guide apps/passenger/lib/src/features/map apps/driver/lib/src/features/home/presentation/widgets/driver_live_map.dart apps/driver/lib/src/core/map packages/design_system/lib/src/map packages/design_system/lib/src/theme apps/admin backend/core/src/payments
      - name: Driver home changes only the privacy logout callback
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          path='apps/driver/lib/src/features/home/presentation/driver_home_screen.dart'
          expected=subprocess.check_output(['git','show','6a7066bfbef533363821610d73d3acb7e4af577d:'+path]).decode().replace('DriverPrivacyScreen(service: widget.privacyService)','DriverPrivacyScreen(service: widget.privacyService, onLogout: widget.onLogout)')
          assert Path(path).read_text()==expected
          PYCODE
