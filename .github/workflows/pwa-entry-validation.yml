name: PWA entry validation continuation
on:
  push:
    branches: [ops/pwa-entry-gate-validation-20261016]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pwa-entry-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Browser gate - ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact application source already under native test
        run: git diff --exit-code aab0b0c36fe15cf78c24d7b2beab8b69c099294a HEAD -- apps packages backend/core config/web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser harness
        run: |
          npm ci --prefix scripts/web/browser-tests --ignore-scripts --no-audit --no-fund
          node scripts/web/browser-tests/node_modules/playwright/cli.js install --with-deps ${{ matrix.engine }}
      - name: Test ordinary tabs, both swipe directions and lifecycle
        env:
          RAMO_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node --test scripts/web/pwa_entry_gate_browser_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-entry-gate-${{ matrix.engine }}
          path: artifacts/pwa-entry-gate/
          retention-days: 7

  configured:
    name: Configured pair from exact native-tested source
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aab0b0c36fe15cf78c24d7b2beab8b69c099294a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful actual installed launch and foreground evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module - <<'NODE'
          import {execFileSync} from 'node:child_process';
          const target='aab0b0c36fe15cf78c24d7b2beab8b69c099294a';
          if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==target)throw Error('Source differs.');
          const base='https://api.github.com/repos/'+process.env.GH_REPOSITORY+'/actions/runs/38983323962';
          async function get(url){const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('Evidence unavailable: '+r.status);return r.json();}
          const deadline=Date.now()+12*60*1000;
          for(;;){
            const run=await get(base);if(run.head_sha!==target)throw Error('Native evidence commit differs.');
            const {jobs}=await get(base+'/jobs?per_page=100');
            const job=jobs.find(j=>j.name==='native-cold-launch');
            if(job?.status==='completed'){if(job.conclusion!=='success')throw Error('Installed native test did not pass.');break;}
            if(Date.now()>deadline)throw Error('Native evidence not complete before packaging deadline.');
            console.log('Waiting for existing native launch/foreground trial; no repeated installation.');
            await new Promise(resolve=>setTimeout(resolve,15000));
          }
          console.log('Installed launch, foreground and application touch evidence approved.');
          NODE
      - name: Check public configuration and require real browser Maps key
        env:
          RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
        run: |
          node --input-type=module - <<'NODE'
          import {loadPublicWebConfiguration} from './scripts/web/public_web_configuration.mjs';
          import {validateMapsWebKey} from './scripts/web/maps_web_config.mjs';
          await loadPublicWebConfiguration();
          validateMapsWebKey(process.env.RAMO_GOOGLE_MAPS_WEB_API_KEY);
          console.log('Public configuration present; no provider calls.');
          NODE
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate correctly-sized PWA icons
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/web/generate_pwa_icons.py
      - name: Compile both configured roles with enforced dependency locks
        env:
          RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
        run: |
          set -euo pipefail
          for role in passenger driver; do
            node scripts/web/prepare_configured_web.mjs --role="$role"
            if [ "$role" = passenger ]; then app_path=passageiro; else app_path=motorista; fi
            (
              cd "apps/$role"
              flutter pub get --enforce-lockfile
              flutter build web --release --no-web-resources-cdn \
                --base-href="/$app_path/" \
                --dart-define=RAMO_CORE_BASE_URL= \
                --dart-define=RAMO_PREVIEW_MODE=false
            )
            node scripts/web/verify_web_bundle.mjs --role="$role" --dist="apps/$role/build/web"
          done
          git diff --exit-code -- '*.dart' '*/pubspec.yaml'
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const normalize=value=>value.replace(/\n+$/,'\n');
          for(const role of ['passenger','driver']){
            const path='apps/'+role+'/pubspec.lock';
            const committed=execFileSync('git',['show','HEAD:'+path],{encoding:'utf8'});
            if(normalize(readFileSync(path,'utf8'))!==normalize(committed))throw Error('Dependency lock changed beyond terminal blank lines: '+path);
          }
          console.log('Dart/manifests unchanged; lock content identical except terminal blank lines.');
          NODE
      - name: Verify pair and write exact-source bundle hashes
        run: |
          mkdir -p artifacts/configured-web
          node scripts/web/write_homologation_manifest.mjs \
            --passenger=apps/passenger/build/web \
            --driver=apps/driver/build/web \
            --commit=aab0b0c36fe15cf78c24d7b2beab8b69c099294a \
            --output=artifacts/configured-web/release.json
          cp -a apps/passenger/build/web artifacts/configured-web/passenger
          cp -a apps/driver/build/web artifacts/configured-web/driver
      - uses: actions/upload-artifact@v4
        with:
          name: ramo-web-configured-aab0b0c36fe15cf78c24d7b2beab8b69c099294a
          path: artifacts/configured-web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
