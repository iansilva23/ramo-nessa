name: Pix Back reservation regression
on:
  push:
    branches: [fix/pix-back-reservation-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/passenger
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/pix_back_reservation_test.dart test/cancelled_payment_recovery_test.dart test/coupon_flow_test.dart test/flow_safety_test.dart
