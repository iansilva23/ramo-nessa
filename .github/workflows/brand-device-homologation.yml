name: Ramo Nessa device homologation packages
on:
  push:
    branches: [ops/brand-device-homologation-20261119]
    paths: [.github/workflows/brand-device-homologation.yml]
permissions:
  contents: read
env:
  RAMO_PRODUCTION_SIGNING: 'false'
  RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: passenger
            label: Passageiro
            upper: PASSENGER
          - app: driver
            label: Motorista
            upper: DRIVER
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets[format('RAMO_GOOGLE_MAPS_ANDROID_{0}_API_KEY', matrix.upper)] || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY }}
      RAMO_FIREBASE_API_KEY: ${{ secrets[format('RAMO_FIREBASE_ANDROID_{0}_API_KEY', matrix.upper)] || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets[format('RAMO_FIREBASE_ANDROID_{0}_APP_ID', matrix.upper)] }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
      RAMO_PREVIEW_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63739a7640e4eb12a8bde860005fdbc548b7700e
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Validate Android browser-independent Maps and Firebase configuration
        run: |
          node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_ANDROID_API_KEY --surface="${{ matrix.label }} Android connected"
          node tooling/validate-firebase-mobile-config.mjs --platform=android --surface="${{ matrix.label }} Android connected"
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/${{ matrix.app }}
      - name: Analyze and test Android application
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build connected Android APK with stable test signature
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build apk --release --no-pub \
            --build-number="$(date +%s)" \
            --dart-define=RAMO_PREVIEW_MODE=false \
            --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
            --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
            --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
            --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
            --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
      - name: Verify signature and package application identity
        run: |
          apk=apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          fingerprint=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' "$RUNNER_TEMP/signature.txt")
          test "$fingerprint" = 21867b7cf8beb84b4c55d648e7be3aa18f0ca78a5c57d18c1557fb503cd9efc9
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          node -e "if(!require('fs').readFileSync(process.env.RUNNER_TEMP+'/package.txt','utf8').includes(\"name='br.com.ramonessa.${{ matrix.app }}.preview'\"))throw Error('Unexpected APK application ID')"
          version=$(sed -nE "s/^package:.*versionCode='([0-9]+)'.*/\1/p" "$RUNNER_TEMP/package.txt")
          test "$version" -gt 1795104000
          mkdir -p artifacts/android
          printf '%s\n' "$fingerprint" > artifacts/android/CERTIFICATE-SHA256.txt
          cp "$apk" artifacts/android/RamoNessa-${{ matrix.label }}-Android-Nova-Marca-Homologacao.apk
          cp "$RUNNER_TEMP/package.txt" artifacts/android/package.txt
          cd artifacts/android
          sha256sum RamoNessa-${{ matrix.label }}-Android-Nova-Marca-Homologacao.apk > SHA256SUMS
          printf '%s\n' '${{ matrix.label }} Android conectado a https://app.ramonessa.com.br. Fonte 63739a7640e4eb12a8bde860005fdbc548b7700e. RAMO_PREVIEW_MODE=false; assinatura de homologacao e pacote br.com.ramonessa.${{ matrix.app }}.preview. Nao destinado a publicacao nas lojas. GPS, login e push exigem aceite no aparelho. Nenhuma configuração do servidor é alterada.' > LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ramo-${{ matrix.app }}-android-conectado-Nova-Marca-Homologacao
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: passenger
            route: passageiro
            label: Passageiro
          - app: driver
            route: motorista
            label: Motorista
    env:
      ROLE: ${{ matrix.app }}
      ROUTE: ${{ matrix.route }}
      APP_LABEL: ${{ matrix.label }}
      RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63739a7640e4eb12a8bde860005fdbc548b7700e
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: node scripts/web/prepare_configured_web.mjs --role="$ROLE"
      - name: Build HTTPS same-origin PWA candidate
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get --enforce-lockfile
          flags=()
          if [ "$ROLE" = driver ]; then
            flags+=(--dart-define=RAMO_WEB_2D_HEADING_ENABLED=true --dart-define=RAMO_GOOGLE_MAPS_WEB_VECTOR_MAP_ID=de20bf289d6db3ad15fdb14b --dart-define=RAMO_WEB_CINEMATIC_TILT_ENABLED=true)
          fi
          flutter build web --release --no-pub --no-web-resources-cdn --base-href="/$ROUTE/" --dart-define=RAMO_CORE_BASE_URL= --dart-define=RAMO_PREVIEW_MODE=false "${flags[@]}"
      - name: Verify and archive the isolated PWA candidate
        run: |
          set -euo pipefail
          dist="apps/$ROLE/build/web"
          for file in "$dist"/icons/*.png; do cmp "$file" "apps/$ROLE/web/icons/${file##*/}"; done
          cmp "$dist/manifest.json" "apps/$ROLE/web/manifest.json"
          cmp "$dist/ramo_install_tutorial_ios.gif" "apps/$ROLE/web/ramo_install_tutorial_ios.gif"
          echo "a40bc26a4ebcc4691f2ea6e77909a1642d8a90d5fe80d45f294ab9a82d99b7c7  $dist/ramo_install_tutorial_ios.gif" | sha256sum -c -
          for name in flutter_bootstrap.js main.dart.js ramo_push_worker.js ramo_web_push.js ramo_push_config.js; do test -s "$dist/$name"; done
          grep -Fq "<base href=\"/$ROUTE/\">" "$dist/index.html"
          if grep -q '__RAMO_GOOGLE_MAPS_WEB_KEY__' "$dist/index.html"; then exit 1; fi
          if [ "$ROLE" = driver ]; then grep -Fq de20bf289d6db3ad15fdb14b "$dist/main.dart.js"; fi
          mkdir -p artifacts/web
          python3 - <<'PACKAGE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          role, label = os.environ['ROLE'], os.environ['APP_LABEL']
          root = Path('apps',role,'build','web')
          target = Path('artifacts/web',f'RamoNessa-{label}-PWA-Nova-Marca-Homologacao.zip')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with ZipFile(target,'w',ZIP_DEFLATED) as package:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      package.write(path,os.environ['ROUTE']+'/'+path.relative_to(root).as_posix())
              package.writestr('BUILD-INFO.json',json.dumps({
                  'source':source,'role':role,'path':'/'+os.environ['ROUTE']+'/',
                  'mainSha256':hashlib.sha256((root/'main.dart.js').read_bytes()).hexdigest(),
                  'environment':'homologation only; same-origin HTTPS'
              },indent=2)+'\n')
          PACKAGE
          (cd artifacts/web && sha256sum *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ramo-${{ matrix.app }}-pwa-nova-marca-homologacao
          path: artifacts/web
          if-no-files-found: error
          retention-days: 14
  apple-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Report configured signing inputs without exposing values
        env:
          IOS_CERTIFICATE: ${{ secrets.RAMO_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.RAMO_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PASSENGER_PROFILE: ${{ secrets.RAMO_IOS_PASSENGER_PROVISIONING_PROFILE_BASE64 }}
          IOS_DRIVER_PROFILE: ${{ secrets.RAMO_IOS_DRIVER_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM: ${{ secrets.RAMO_APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os,json
          print(json.dumps({name:bool(os.environ.get(name)) for name in ['IOS_CERTIFICATE','IOS_CERTIFICATE_PASSWORD','IOS_PASSENGER_PROFILE','IOS_DRIVER_PROFILE','IOS_TEAM']},indent=2))
          PY
