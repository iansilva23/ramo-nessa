name: Generate Passenger Brand Icons

on:
  push:
    paths:
      - ".github/workflows/generate-passenger-brand-icons.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebuild verified passenger artwork
        run: |
          cat .brand-transfer/passenger_icon/*.b64 | tr -d '\n' | base64 --decode > apps/passenger/assets/brand/passenger/app_icon_source.jpg
          echo "5fdffc4bde89ed0ebceba5ebe365bef2b5a15c33273597ffe7df07d76b7c9c9c  apps/passenger/assets/brand/passenger/app_icon_source.jpg" | sha256sum -c -

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/passenger
        run: flutter pub get

      - name: Generate Android and iOS launcher icons
        working-directory: apps/passenger
        run: dart run flutter_launcher_icons

      - name: Validate generated icon files
        run: |
          test -s apps/passenger/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s apps/passenger/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s apps/passenger/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png

      - name: Commit generated launcher icons
        run: |
          rm -rf .brand-transfer/passenger_icon
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .brand-transfer
          git add apps/passenger/assets/brand/passenger/app_icon_source.jpg
          git add apps/passenger/android/app/src/main/res
          git add apps/passenger/ios/Runner/Assets.xcassets/AppIcon.appiconset
          git add apps/passenger/pubspec.lock
          if git diff --cached --quiet; then
            echo "Launcher icons already synchronized."
            exit 0
          fi
          git commit -m "feat(brand): generate official passenger launcher icons"
          git pull --rebase origin main
          git push origin HEAD:main
