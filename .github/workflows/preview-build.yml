# Preview usa GPS do aparelho e centralização com leitura nova; operação demonstrativa.
name: Preview APKs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/preview-build.yml"

concurrency:
  group: preview-apks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  passenger-preview:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21 for Android build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve Passenger dependencies from lockfile
        working-directory: apps/passenger
        run: flutter pub get --enforce-lockfile

      - name: Validate Passenger Google Maps key
        env:
          RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_ANDROID_PASSENGER_API_KEY || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          if [ -z "$RAMO_GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo "::error::RAMO_GOOGLE_MAPS_ANDROID_API_KEY não está configurada. O APK seria gerado com o Google Maps quebrado."
            exit 1
          fi

      - name: Check Passenger Firebase push config
        env:
          RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
          RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_APP_ID }}
          RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
          RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
        run: |
          missing=0
          for name in RAMO_FIREBASE_API_KEY RAMO_FIREBASE_APP_ID RAMO_FIREBASE_MESSAGING_SENDER_ID RAMO_FIREBASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::${name} não configurado; o Preview Passageiro será gerado com push desativado."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Firebase push configurado para o Preview Passageiro."
          fi

      - name: Check Passenger connected Preview Core
        env:
          RAMO_CORE_BASE_URL: ${{ secrets.RAMO_PREVIEW_CORE_BASE_URL }}
        run: |
          if [ -z "$RAMO_CORE_BASE_URL" ]; then
            echo "::warning::RAMO_PREVIEW_CORE_BASE_URL não configurado; a busca usará somente o catálogo local e a rota será demonstrativa."
          elif [[ "$RAMO_CORE_BASE_URL" != https://* ]]; then
            echo "::error::RAMO_PREVIEW_CORE_BASE_URL precisa usar HTTPS."
            exit 1
          else
            echo "Preview Passageiro conectado ao Core de teste para Google Places e Routes."
          fi

      - name: Build Passenger Preview APK
        working-directory: apps/passenger
        env:
          RAMO_CORE_BASE_URL: ${{ secrets.RAMO_PREVIEW_CORE_BASE_URL }}
          RAMO_MERCADO_PAGO_PUBLIC_KEY: APP_USR-d88c8e2c-cc73-4792-a348-41d6282af1fd
          RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_ANDROID_PASSENGER_API_KEY || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY }}
          RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
          RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_APP_ID }}
          RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
          RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
          RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
          RAMO_PREVIEW_SIGNING: "true"
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=RAMO_PREVIEW_MODE=true
          --dart-define=RAMO_CORE_BASE_URL=$RAMO_CORE_BASE_URL
          --dart-define=RAMO_MERCADO_PAGO_PUBLIC_KEY=$RAMO_MERCADO_PAGO_PUBLIC_KEY
          --dart-define=RAMO_FIREBASE_API_KEY=$RAMO_FIREBASE_API_KEY
          --dart-define=RAMO_FIREBASE_APP_ID=$RAMO_FIREBASE_APP_ID
          --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID=$RAMO_FIREBASE_MESSAGING_SENDER_ID
          --dart-define=RAMO_FIREBASE_PROJECT_ID=$RAMO_FIREBASE_PROJECT_ID
          --dart-define=RAMO_FIREBASE_STORAGE_BUCKET=$RAMO_FIREBASE_STORAGE_BUCKET
          --dart-define=RAMO_APP_VERSION=0.1.0-preview
          --dart-define=RAMO_APP_BUILD=${{ github.run_number }}

      - name: Verify Passenger Preview APK signature
        working-directory: apps/passenger
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Passenger Preview APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ramo-nessa-passenger-preview
          path: apps/passenger/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  driver-preview:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21 for Android build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve Driver dependencies from lockfile
        working-directory: apps/driver
        run: flutter pub get --enforce-lockfile

      - name: Validate Driver Google Maps key
        env:
          RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_ANDROID_DRIVER_API_KEY || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          if [ -z "$RAMO_GOOGLE_MAPS_ANDROID_API_KEY" ]; then
            echo "::error::RAMO_GOOGLE_MAPS_ANDROID_API_KEY não está configurada. O APK seria gerado com o Google Maps quebrado."
            exit 1
          fi

      - name: Check Driver Firebase push config
        env:
          RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_ANDROID_DRIVER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
          RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_ANDROID_DRIVER_APP_ID || secrets.RAMO_FIREBASE_DRIVER_APP_ID || secrets.RAMO_FIREBASE_APP_ID }}
          RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
          RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
        run: |
          missing=0
          for name in RAMO_FIREBASE_API_KEY RAMO_FIREBASE_APP_ID RAMO_FIREBASE_MESSAGING_SENDER_ID RAMO_FIREBASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::${name} não configurado; o Preview Motorista será gerado com push desativado."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Firebase push configurado para o Preview Motorista."
          fi

      - name: Check Driver connected Preview Core
        env:
          RAMO_CORE_BASE_URL: ${{ secrets.RAMO_PREVIEW_CORE_BASE_URL }}
        run: |
          if [ -z "$RAMO_CORE_BASE_URL" ]; then
            echo "::warning::RAMO_PREVIEW_CORE_BASE_URL não configurado; a rota do Motorista será demonstrativa."
          elif [[ "$RAMO_CORE_BASE_URL" != https://* ]]; then
            echo "::error::RAMO_PREVIEW_CORE_BASE_URL precisa usar HTTPS."
            exit 1
          else
            echo "Preview Motorista conectado ao Core de teste para Google Routes."
          fi

      - name: Build Driver Preview APK
        working-directory: apps/driver
        env:
          RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_ANDROID_DRIVER_API_KEY || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY }}
          RAMO_CORE_BASE_URL: ${{ secrets.RAMO_PREVIEW_CORE_BASE_URL }}
          RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_ANDROID_DRIVER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
          RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_ANDROID_DRIVER_APP_ID || secrets.RAMO_FIREBASE_DRIVER_APP_ID || secrets.RAMO_FIREBASE_APP_ID }}
          RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
          RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
          RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
          RAMO_PREVIEW_SIGNING: "true"
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=RAMO_PREVIEW_MODE=true
          --dart-define=RAMO_CORE_BASE_URL=$RAMO_CORE_BASE_URL
          --dart-define=RAMO_FIREBASE_API_KEY=$RAMO_FIREBASE_API_KEY
          --dart-define=RAMO_FIREBASE_APP_ID=$RAMO_FIREBASE_APP_ID
          --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID=$RAMO_FIREBASE_MESSAGING_SENDER_ID
          --dart-define=RAMO_FIREBASE_PROJECT_ID=$RAMO_FIREBASE_PROJECT_ID
          --dart-define=RAMO_FIREBASE_STORAGE_BUCKET=$RAMO_FIREBASE_STORAGE_BUCKET
          --dart-define=RAMO_APP_VERSION=0.1.0-preview
          --dart-define=RAMO_APP_BUILD=${{ github.run_number }}

      - name: Verify Driver Preview APK signature
        working-directory: apps/driver
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Driver Preview APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ramo-nessa-driver-preview
          path: apps/driver/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
