name: V5 review-only Web artifacts (never deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ramo-v5-review-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-web:
    if: github.ref == 'refs/heads/integration/pricing-v5-finance-safe-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: passenger
            route: passageiro
          - role: driver
            route: motorista
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: apps/${{ matrix.role }}
        run: flutter pub get --enforce-lockfile
      - name: Compile isolated inert Web bundle
        working-directory: apps/${{ matrix.role }}
        run: |
          flutter build web --release --no-web-resources-cdn --no-pub \
            --base-href=/${{ matrix.route }}/ \
            --dart-define=RAMO_PREVIEW_MODE=false \
            --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Audit output and stamp non-publishable artifact
        env:
          ROLE: ${{ matrix.role }}
          ROUTE: ${{ matrix.route }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s "apps/$ROLE/build/web/index.html"
          test -s "apps/$ROLE/build/web/main.dart.js"
          grep -Fq "<base href=\"/$ROUTE/\">" "apps/$ROLE/build/web/index.html"
          mkdir -p "artifacts/v5-review/$ROLE"
          cp -a "apps/$ROLE/build/web/." "artifacts/v5-review/$ROLE/"
          node --input-type=module - <<'NODE'
          import {writeFileSync} from 'node:fs';
          const manifest={
            schemaVersion:1,kind:'REVIEW_ONLY_NOT_DEPLOYABLE',
            sourceCommit:process.env.COMMIT,role:process.env.ROLE,
            route:'/'+process.env.ROUTE+'/',
            apiBase:'https://example.invalid',
            containsProviderCredentials:false,
            deployApproved:false
          };
          writeFileSync('artifacts/v5-review/'+process.env.ROLE+'/REVIEW_ONLY.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
          git diff --exit-code -- "apps/$ROLE/lib" "apps/$ROLE/pubspec.yaml" "apps/$ROLE/pubspec.lock" packages/
      - uses: actions/upload-artifact@v4
        with:
          name: v5-${{ matrix.role }}-web-REVIEW-ONLY
          path: artifacts/v5-review/${{ matrix.role }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
