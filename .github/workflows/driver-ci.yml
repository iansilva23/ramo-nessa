name: Driver CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/driver/**"
      - "packages/design_system/**"
      - ".github/workflows/driver-ci.yml"
  pull_request:
    paths:
      - "apps/driver/**"
      - "packages/design_system/**"
      - ".github/workflows/driver-ci.yml"

concurrency:
  group: driver-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get design system dependencies
        working-directory: packages/design_system
        run: flutter pub get

      - name: Analyze design system
        working-directory: packages/design_system
        run: flutter analyze

      - name: Test design system
        working-directory: packages/design_system
        run: flutter test

      - name: Get driver dependencies
        working-directory: apps/driver
        run: flutter pub get

      - name: Analyze driver
        working-directory: apps/driver
        run: flutter analyze

      - name: Test driver
        working-directory: apps/driver
        run: flutter test

      - name: Build Android debug APK
        working-directory: apps/driver
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ramo-nessa-driver-debug
          path: apps/driver/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
