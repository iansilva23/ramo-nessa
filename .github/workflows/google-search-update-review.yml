name: Google search update - isolated activation and rollback
on:
  push:
    branches: [feature/admin-regions-pricing-simple-20261020]
    paths:
      - deploy/staging/*google*search*
      - deploy/staging/stage-google-core.py
      - .github/workflows/google-search-update-review.yml
permissions:
  contents: read
  actions: read
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify update ordering, concurrent version guards and rollback reporting
        run: |
          node --check deploy/staging/prepare-google-search-update.mjs
          node --check deploy/staging/activate-google-search-update.mjs
          node --check deploy/staging/test-google-search-update.mjs
          node --test deploy/staging/google-search-update.test.mjs deploy/staging/asaas-activation-plan-contract.test.mjs deploy/staging/asaas-driver-web-switch-contract.test.mjs
          python3 -m unittest discover -s deploy/staging -p test_stage_regions_web.py
      - name: Download exact immutable artifact ZIP bytes for checksum validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p exact-zips baseline-core
          gh api repos/iansilva23/ramo-nessa/actions/artifacts/12389892455/zip > exact-zips/web.zip
          gh api repos/iansilva23/ramo-nessa/actions/artifacts/12390246564/zip > exact-zips/core.zip
          gh api repos/iansilva23/ramo-nessa/actions/artifacts/12388210585/zip > exact-zips/old.zip
          git archive 0f5305ddef3398112ca1e7d10a00fd05fa8548e8 backend/core | tar -x -C baseline-core
          docker pull caddy:2.11.7-alpine
          docker pull postgres:16
      - name: Real Docker Core and Caddy upgrade, two forced failures and database preservation
        run: |
          sudo --preserve-env=PATH,GITHUB_ACTIONS node deploy/staging/test-google-search-update.mjs \
            "$PWD/exact-zips/web.zip" "$PWD/exact-zips/core.zip" "$PWD/exact-zips/old.zip" "$PWD/baseline-core/backend/core"
