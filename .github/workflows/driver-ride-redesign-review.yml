name: Driver ride redesign review
on:
  push:
    branches: [feature/driver-ride-redesign-20261023]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: driver-ride-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    name: Driver ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            runner: ubuntu-24.04
          - target: android
            runner: ubuntu-24.04
          - target: ios
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve unchanged dependencies
        working-directory: apps/driver
        run: flutter pub get --enforce-lockfile
      - name: Format review sources
        run: dart format apps/driver/lib/src/features/home/presentation/driver_home_screen.dart apps/driver/lib/src/features/home/presentation/widgets/driver_ride_design.dart apps/driver/test/driver_flow_test.dart apps/driver/test/realtime_offer_test.dart
      - name: Analyze
        working-directory: apps/driver
        run: flutter analyze
      - name: Widget and regression tests
        working-directory: apps/driver
        run: flutter test
      - name: Compile Web
        if: matrix.target == 'web'
        working-directory: apps/driver
        run: flutter build web --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Compile Android
        if: matrix.target == 'android'
        working-directory: apps/driver
        run: flutter build apk --debug --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Compile iOS simulator
        if: matrix.target == 'ios'
        working-directory: apps/driver
        run: flutter build ios --simulator --debug --no-pub --no-codesign --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'web'
        with:
          name: driver-redesign-review
          path: |
            apps/driver/lib/src/features/home/presentation/driver_home_screen.dart
            apps/driver/lib/src/features/home/presentation/widgets/driver_ride_design.dart
            apps/driver/test/driver_flow_test.dart
            apps/driver/test/realtime_offer_test.dart
            apps/driver/build/ride-review/
