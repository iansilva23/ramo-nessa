name: Passenger rating configured Web and verified installation
on:
  push:
    branches: [ops/passenger-rating-web-20261023]
    paths:
      - 'deploy/staging/rating*'
      - 'deploy/staging/stage-rating.py'
      - 'deploy/staging/test-rating-web-update.mjs'
      - 'deploy/staging/test_stage_rating.py'
      - 'scripts/web/package_rating_window.mjs'
      - '.github/workflows/passenger-rating-web-package.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passenger-rating-web-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve the tested application revision
        run: git diff --exit-code 8c178d84b00e57a506c2661cdfb026963eac4938 HEAD -- backend apps packages config/web
      - name: Unit checks for extraction, scoped plans and argument guards
        run: |
          node --check deploy/staging/rating-web-update.mjs
          node --check deploy/staging/rating-migration.mjs
          node --check deploy/staging/test-rating-web-update.mjs
          node --test deploy/staging/rating-web.test.mjs deploy/staging/google-search-update.test.mjs deploy/staging/asaas-activation-plan-contract.test.mjs deploy/staging/asaas-driver-web-switch-contract.test.mjs
          python3 -m unittest discover -s deploy/staging -p test_stage_rating.py
      - name: Download exact active Web bundles for the preservation rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ride-chat-web-75ca2b7c-r1 --pattern RamoNessa-Chat-Web-75ca2b7c.zip --dir /tmp/active-web
          printf '%s  %s\n' 00220b162e99aa57b604ade3d4a3eabb4370ea28e3aedcf98ca42cc0a1d63966 /tmp/active-web/RamoNessa-Chat-Web-75ca2b7c.zip | sha256sum --check -
          python3 - <<'PY2'
          import zipfile
          with zipfile.ZipFile('/tmp/active-web/RamoNessa-Chat-Web-75ca2b7c.zip') as z:
              for n in z.namelist():
                  if n.startswith(('passenger/','driver/')): z.extract(n,'baseline-web')
          PY2
      - name: Build the exact compiled Guide baseline and the passenger rating patch
        run: |
          mkdir -p baseline
          git archive 75ca2b7c3d9a97cfaa6f48a3748c2f12867a19f1 backend/core apps/admin | tar -x -C baseline
          npm ci --prefix baseline/backend/core --no-audit --no-fund
          npm run build --prefix baseline/backend/core
          npm ci --prefix backend/core --no-audit --no-fund
          npm run build --prefix backend/core
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - name: Build configured Driver Web only
        env:
          RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/web/generate_pwa_icons.py
          for role in driver; do
            node scripts/web/prepare_configured_web.mjs --role="$role"
            if [ "$role" = passenger ]; then route=passageiro; else route=motorista; fi
            (cd "apps/$role" && flutter pub get --enforce-lockfile && flutter build web --release --no-web-resources-cdn --base-href="/$route/" --dart-define=RAMO_CORE_BASE_URL= --dart-define=RAMO_PREVIEW_MODE=false)
            node scripts/web/verify_web_bundle.mjs --role="$role" --dist="apps/$role/build/web"
          done
      - name: Verify production Web configuration and stage the reviewed payload
        run: |
          node scripts/web/verify_web_bundle.mjs --role=driver --dist=apps/driver/build/web
          node scripts/web/package_rating_window.mjs baseline release
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('RamoNessa-Avaliacao-Passageiro-Web.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(pathlib.Path('release').rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to('release'))
          PY
          sha256sum RamoNessa-Avaliacao-Passageiro-Web.zip > RamoNessa-Avaliacao-Passageiro-Web.zip.sha256
      - name: Use Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm ci --prefix scripts/web/browser-tests --no-audit --no-fund
          node scripts/web/browser-tests/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Configured compiled Driver Web sessions in both browsers
        run: |
          for role in driver; do
            for engine in chromium webkit; do
              RAMO_WEB_TEST_ROLE="$role" RAMO_BROWSER_ENGINE="$engine" node --test scripts/web/web_direct_entry_auth_test.mjs
            done
          done
      - name: Real Docker backup, additive receipts, three recovery scenarios and HTTP chat and passenger rating
        run: |
          docker pull postgres:16
          docker pull caddy:2.11.7-alpine
          sudo --preserve-env=PATH,GITHUB_ACTIONS node deploy/staging/test-rating-web-update.mjs "$PWD/RamoNessa-Avaliacao-Passageiro-Web.zip" "$PWD/baseline"
      - name: Package the exact installer sources
        run: |
          git archive HEAD deploy/staging scripts/web | gzip -n > Instalador-Avaliacao-Passageiro-Web-r1.tar.gz
          sha256sum Instalador-Avaliacao-Passageiro-Web-r1.tar.gz > Instalador-Avaliacao-Passageiro-Web-r1.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: passenger-rating-configured-web-tested
          path: |
            RamoNessa-Avaliacao-Passageiro-Web.zip
            RamoNessa-Avaliacao-Passageiro-Web.zip.sha256
            Instalador-Avaliacao-Passageiro-Web-r1.tar.gz
            Instalador-Avaliacao-Passageiro-Web-r1.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passenger-rating-web-session-evidence
          path: artifacts/web-csp/
          if-no-files-found: ignore
  publish-package:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: passenger-rating-configured-web-tested, path: package}
      - name: Publish only a verified installation package, no server deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd package
          sha256sum -c RamoNessa-Avaliacao-Passageiro-Web.zip.sha256
          sha256sum --check Instalador-Avaliacao-Passageiro-Web-r1.tar.gz.sha256
          gh release create passenger-rating-web-20261023-r1 RamoNessa-Avaliacao-Passageiro-Web.zip RamoNessa-Avaliacao-Passageiro-Web.zip.sha256 Instalador-Avaliacao-Passageiro-Web-r1.tar.gz Instalador-Avaliacao-Passageiro-Web-r1.tar.gz.sha256 --target "$GITHUB_SHA" --prerelease --latest=false --title 'Motorista Web — avaliação do passageiro' --notes 'Motorista Web conforme referência, nota e motivos persistidos uma vez por corrida concluída. Passageiro Web, chat, ADM, Caddy e provedores preservados. Backup e retorno ensaiados com Core/PostgreSQL/Caddy reais. Não instala automaticamente na VPS. Android/iOS não distribuídos.'
