name: Preflight

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/core/**"
      - "apps/passenger/**"
      - "apps/driver/**"
      - "apps/admin/**"
      - "deploy/test/**"
      - "deploy/prod/**"
      - ".github/workflows/test-stack-audit.yml"
      - "packages/design_system/**"
      - "tooling/validate-google-maps-key.mjs"
      - ".github/workflows/preflight.yml"
      - ".github/workflows/mobile-build-audit.yml"
  push:
    branches: [main]
    paths:
      - "backend/core/**"
      - "apps/passenger/**"
      - "apps/driver/**"
      - "apps/admin/**"
      - "deploy/test/**"
      - "deploy/prod/**"
      - ".github/workflows/test-stack-audit.yml"
      - "packages/design_system/**"
      - "tooling/validate-google-maps-key.mjs"
      - ".github/workflows/preflight.yml"
      - ".github/workflows/mobile-build-audit.yml"

concurrency:
  # github.workflow is the caller name for reusable workflows. This keeps
  # standalone PR Preflight and Mobile Build Audit Preflight from cancelling
  # each other while still cancelling obsolete runs of the same workflow.
  group: preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://ramonessa:ramonessa@127.0.0.1:5432/ramonessa
      DB_SSL: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ramonessa
          POSTGRES_PASSWORD: ramonessa
          POSTGRES_DB: ramonessa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ramonessa -d ramonessa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/core/package-lock.json

      - name: Install Core dependencies from lockfile
        working-directory: backend/core
        run: npm ci --no-audit --no-fund

      - name: Core typecheck
        working-directory: backend/core
        run: npm run typecheck

      - name: Apply PostgreSQL migrations
        working-directory: backend/core
        run: npm run db:migrate

      - name: Verify migrations are idempotent
        working-directory: backend/core
        run: npm run db:migrate

      - name: Core tests
        working-directory: backend/core
        run: npm test

      - name: Build Core production output
        working-directory: backend/core
        run: npm run build

      - name: Check Admin web syntax
        working-directory: apps/admin
        run: npm run check

      - name: Test Admin web
        working-directory: apps/admin
        run: npm test

      - name: Check deployment scripts
        run: |
          node --check deploy/test/env.mjs
          node --check deploy/test/generate-env.mjs
          node --check deploy/test/start.mjs
          node --check deploy/test/create-admin.mjs
          node --check deploy/test/smoke.mjs
          node --check deploy/prod/env.mjs
          node --check deploy/prod/generate-env.mjs
          node --check deploy/prod/validate-env.mjs
          node --check deploy/prod/backup.mjs
          node --check deploy/prod/verify-backup.mjs
          node --check deploy/prod/health-check.mjs
          node --check tooling/validate-google-maps-key.mjs

      - name: Validate test-stack Compose
        env:
          POSTGRES_PASSWORD: ci-compose-only
          DATABASE_URL: postgresql://ramonessa:ci-compose-only@postgres:5432/ramonessa
          OTP_HASH_SECRET: 1111111111111111111111111111111111111111111111111111111111111111
          OTP_RATE_LIMIT_SECRET: 2222222222222222222222222222222222222222222222222222222222222222
          ADMIN_MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ADMIN_LOGIN_RATE_LIMIT_SECRET: 3333333333333333333333333333333333333333333333333333333333333333
        run: docker compose -f deploy/test/compose.yml config > /dev/null

      - name: Validate production deployment config
        run: |
          cat > /tmp/ramo-prod.env <<'EOF'
          APP_DOMAIN=ci.ramonessa.test
          ACME_EMAIL=ops@ramonessa.test
          POSTGRES_USER=ramonessa
          POSTGRES_DB=ramonessa
          POSTGRES_PASSWORD=cccccccccccccccccccccccccccccccc
          DATABASE_URL=postgresql://ramonessa:cccccccccccccccccccccccccccccccc@postgres:5432/ramonessa
          DB_POOL_MAX=20
          DB_SSL=false
          DB_SSL_CA=
          SHUTDOWN_TIMEOUT_MS=10000
          OTP_HASH_SECRET=1111111111111111111111111111111111111111111111111111111111111111
          OTP_RATE_LIMIT_SECRET=2222222222222222222222222222222222222222222222222222222222222222
          OTP_WEBHOOK_URL=https://otp.ramonessa.test/send
          OTP_WEBHOOK_TOKEN=33333333333333333333333333333333
          ADMIN_MFA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ADMIN_LOGIN_RATE_LIMIT_SECRET=4444444444444444444444444444444444444444444444444444444444444444
          ROUTING_TIMEOUT_MS=5000
          GOOGLE_MAPS_SERVER_API_KEY=55555555555555555555555555555555
          PLACE_PROOF_SECRET=6666666666666666666666666666666666666666666666666666666666666666
          PLACE_PROOF_TTL_SECONDS=1800
          PUSH_PROVIDER=disabled
          PUSH_WEBHOOK_URL=
          PUSH_WEBHOOK_SECRET=
          DOCUMENT_INSPECTION_ENCRYPTION_KEY=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
          DOCUMENT_INSPECTION_TTL_SECONDS=60
          MERCADO_PAGO_ACCESS_TOKEN=7777777777777777777777777777777777777777
          MERCADO_PAGO_WEBHOOK_SECRET=88888888888888888888888888888888
          DRIVER_PAYOUT_PROVIDER_NAME=
          DRIVER_PAYOUT_PROVIDER_URL=
          DRIVER_PAYOUT_PROVIDER_TOKEN=
          DRIVER_PAYOUT_RECONCILE_INTERVAL_SECONDS=60
          EOF

          node deploy/prod/validate-env.mjs --env-file=/tmp/ramo-prod.env
          docker compose \
            --env-file /tmp/ramo-prod.env \
            -f deploy/prod/compose.yml \
            config > /dev/null

          docker run --rm \
            -e APP_DOMAIN=ci.ramonessa.test \
            -e ACME_EMAIL=ops@ramonessa.test \
            -v "$PWD/deploy/prod/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve design system dependencies
        working-directory: packages/design_system
        run: flutter pub get

      - name: Analyze design system
        working-directory: packages/design_system
        run: flutter analyze

      - name: Test design system
        working-directory: packages/design_system
        run: flutter test

      - name: Resolve Passenger dependencies
        working-directory: apps/passenger
        run: |
          flutter pub get
          echo "=== PASSENGER_PUBSPEC_LOCK_BEGIN ==="
          cat pubspec.lock
          echo "=== PASSENGER_PUBSPEC_LOCK_END ==="

      - name: Analyze Passenger
        working-directory: apps/passenger
        run: flutter analyze

      - name: Test Passenger
        working-directory: apps/passenger
        run: flutter test

      - name: Resolve Driver dependencies
        working-directory: apps/driver
        run: |
          flutter pub get
          echo "=== DRIVER_PUBSPEC_LOCK_BEGIN ==="
          cat pubspec.lock
          echo "=== DRIVER_PUBSPEC_LOCK_END ==="

      - name: Analyze Driver
        working-directory: apps/driver
        run: flutter analyze

      - name: Test Driver
        working-directory: apps/driver
        run: flutter test
