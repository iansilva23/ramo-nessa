name: Passenger nearby vehicles - Core and Web
on:
  push:
    branches: [feature/passenger-nearby-vehicles-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passenger-nearby-review
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ramonessa, POSTGRES_PASSWORD: ramonessa, POSTGRES_DB: ramonessa}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ramonessa:ramonessa@127.0.0.1:5432/ramonessa
      DB_SSL: 'false'
      RAMO_CHAT_TEST_POSTGRES: 'true'
      RAMO_RATING_TEST_POSTGRES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix backend/core --no-audit --no-fund
      - run: npm run typecheck && npm run db:migrate && npm test && npm run build
        working-directory: backend/core
      - name: Actual Core/PostgreSQL nearby endpoint
        run: node --import tsx --test test/passenger_nearby_http.test.ts
        working-directory: backend/core
        env: {RAMO_NEARBY_HTTP: 'true'}
  passenger-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/passenger
      - run: flutter analyze && flutter test
        working-directory: apps/passenger
      - run: flutter build web --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
        working-directory: apps/passenger
