    needs: identify
    name: passenger connected android and Web
  ios:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
      RAMO_GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_IOS_DRIVER_API_KEY }}
      RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_IOS_DRIVER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_IOS_DRIVER_APP_ID }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
      SOURCE_BUILD: ${{ needs.identify.outputs.build_number }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.SOURCE_COMMIT }}
    - name: Verify immutable approved source
      run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: subosito/flutter-action@v2.23.0
      with:
        flutter-version: 3.47.5
        channel: stable
        cache: true
    - name: Validate retained iOS services
      run: |
        node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_IOS_API_KEY --surface='Driver password iOS'
        node tooling/validate-firebase-mobile-config.mjs --platform=ios --surface='Driver password iOS'
        printf 'GOOGLE_MAPS_API_KEY = %s\n' "$RAMO_GOOGLE_MAPS_IOS_API_KEY" > apps/driver/ios/Flutter/GoogleMaps.local.xcconfig
    - run: flutter pub get --enforce-lockfile
      working-directory: apps/driver
    - name: Build iPhone code without Apple distribution signing
      working-directory: apps/driver
      run: |
        flutter build ios --release --no-codesign --no-pub --build-number="$SOURCE_BUILD" \
          --dart-define=RAMO_PREVIEW_MODE=false --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
          --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
          --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
          --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
          --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
          --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
    - name: Package unsigned iPhone build separately
      run: |
        mkdir -p release/redesign
        ditto -c -k --sequesterRsrc --keepParent apps/driver/build/ios/iphoneos/Runner.app release/redesign/RamoNessa-Motorista-Redesign-iPhone-SEM-ASSINATURA.zip
        printf 'Exige assinatura e provisionamento Apple. Nao instalavel diretamente. Fonte %s\n' "$SOURCE_COMMIT" > release/redesign/LEIA-ME-iPhone.txt
    - name: Record source, build identity and artifact checksums
      run: |
        python3 - <<'REPORT'
        import os,json,hashlib
        from pathlib import Path
        root=Path('release/redesign')
        files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
        data={'schema':1,'source':os.environ['SOURCE_COMMIT'],'workflowCommit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'buildNumber':int(os.environ['SOURCE_BUILD']),'role':'driver','platform':'ios','apiOrigin':os.environ['RAMO_CORE_BASE_URL'],'previewMode':False,'signing':'unsigned-apple-provisioning-required','installed':False,'files':files}
        (root/'BUILD-MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
        REPORT
    - name: Keep approved application code unchanged
      run: git diff --exit-code -- apps/driver/lib apps/driver/pubspec.yaml apps/driver/pubspec.lock packages/
    - uses: actions/upload-artifact@v4
      with:
        name: redesign-driver-ios
        path: release/redesign/
        if-no-files-found: error
        retention-days: 14
    needs: identify
    name: driver connected ios unsigned
  passenger-ios:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
      RAMO_GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_IOS_PASSENGER_API_KEY }}
      RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_APP_ID }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
