      RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_APP_ID || secrets.RAMO_FIREBASE_PASSENGER_APP_ID }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
      RAMO_PREVIEW_SIGNING: 'true'
      SOURCE_BUILD: ${{ needs.identify.outputs.build_number }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.SOURCE_COMMIT }}
    - name: Verify immutable approved source
      run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: subosito/flutter-action@v2.23.0
      with:
        flutter-version: 3.47.5
        channel: stable
        cache: true
    - name: Validate retained Maps and Firebase configuration
      run: |
        node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_ANDROID_API_KEY --surface='Passenger password Android'
        node tooling/validate-firebase-mobile-config.mjs --platform=android --surface='Passenger password Android'
    - run: flutter pub get --enforce-lockfile
      working-directory: apps/passenger
    - name: Build connected Android APK with retained stable test signing
      working-directory: apps/passenger
      run: |
        flutter build apk --release --no-pub --build-number="$SOURCE_BUILD" \
