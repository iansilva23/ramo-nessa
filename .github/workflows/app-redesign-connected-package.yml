        root=Path('release/redesign')
        files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
        data={'schema':1,'source':os.environ['SOURCE_COMMIT'],'workflowCommit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'buildNumber':int(os.environ['SOURCE_BUILD']),'role':'passenger','platform':'android','apiOrigin':os.environ['RAMO_CORE_BASE_URL'],'previewMode':False,'signing':'stable-test-key','installed':False,'files':files}
