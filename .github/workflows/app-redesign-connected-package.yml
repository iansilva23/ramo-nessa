        root=Path('release/redesign')
        files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
        data={'schema':1,'source':os.environ['SOURCE_COMMIT'],'workflowCommit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'buildNumber':int(os.environ['SOURCE_BUILD']),'role':'passenger','platform':'ios','apiOrigin':os.environ['RAMO_CORE_BASE_URL'],'previewMode':False,'signing':'unsigned-apple-provisioning-required','installed':False,'files':files}
        (root/'BUILD-MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
        REPORT
    - name: Keep approved application code unchanged
      run: git diff --exit-code -- apps/passenger/lib apps/passenger/pubspec.yaml apps/passenger/pubspec.lock packages/
    - uses: actions/upload-artifact@v4
      with:
        name: redesign-passenger-ios
        path: release/redesign/
        if-no-files-found: error
        retention-days: 14
    needs: identify
    name: passenger connected ios unsigned
  verify-packages:
    needs:
    - driver
    - passenger
    - ios
    - passenger-ios
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: redesign-*
        path: packages
    - name: Verify coherent source and all packaged checksums
      run: |
        python3 - <<'VERIFY'
        import os,json,hashlib
        from pathlib import Path
        root=Path('packages')
        reports=sorted(root.glob('*/BUILD-MANIFEST.json'))
        assert len(reports)==4, 'Quatro pacotes esperados.'
        identities=set()
        builds=set()
        for path in reports:
         data=json.loads(path.read_text())
         assert data['source']==os.environ['SOURCE_COMMIT']
         assert data['previewMode'] is False and data['installed'] is False
         assert data['apiOrigin']==os.environ['RAMO_CORE_BASE_URL']
         identities.add((data['role'],data['platform']))
         builds.add(data['buildNumber'])
         assert data['files']
         for name,digest in data['files'].items():
          assert Path(name).name==name and name not in ('.','..')
          assert hashlib.sha256((path.parent/name).read_bytes()).hexdigest()==digest
        assert len(builds)==1
        assert identities=={(role,platform) for role in ('driver','passenger') for platform in ('android','ios')}
        summary={'source':os.environ['SOURCE_COMMIT'],'buildNumber':builds.pop(),'packages':[json.loads(p.read_text()) for p in reports],'deployed':False,'physicalAcceptance':False,'storeReady':False}
        Path('PACKAGE-REPORT.json').write_text(json.dumps(summary,indent=2)+'\n')
        print('Quatro pacotes coerentes e checksums conferidos; nada instalado.')
        VERIFY
    - uses: actions/upload-artifact@v4
      with:
        name: redesign-package-report
        path: PACKAGE-REPORT.json
        if-no-files-found: error
        retention-days: 14
