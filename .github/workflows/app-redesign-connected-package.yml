          --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
          --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
          --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
          --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
          --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
          --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
    - name: Prepare retained public Web configuration
      run: |
        python3 -m pip install --quiet Pillow==11.3.0
        python3 scripts/web/generate_pwa_icons.py
        node scripts/web/prepare_configured_web.mjs --role=passenger
    - name: Build Passenger Web
      working-directory: apps/passenger
      run: flutter build web --release --no-pub --no-web-resources-cdn --base-href=/passageiro/ --dart-define=RAMO_CORE_BASE_URL= --dart-define=RAMO_PREVIEW_MODE=false
    - name: Verify and package connected artifacts
      run: |
        node scripts/web/verify_web_bundle.mjs --role=passenger --dist=apps/passenger/build/web
        signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
        "$signer" verify apps/passenger/build/app/outputs/flutter-apk/app-release.apk
        mkdir -p release/redesign
        cp apps/passenger/build/app/outputs/flutter-apk/app-release.apk release/redesign/RamoNessa-Passageiro-Redesign-Android.apk
        python3 - <<'PY'
        import zipfile, pathlib, os, json, hashlib
        root=pathlib.Path('apps/passenger/build/web')
        files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
        with zipfile.ZipFile('release/redesign/RamoNessa-Passageiro-Redesign-Web.zip','w',zipfile.ZIP_DEFLATED) as z:
            z.writestr('manifest.json',json.dumps({'schema':1,'source':os.environ['SOURCE_COMMIT'],'role':'passenger','basePath':'/passageiro/','files':files}))
            for path in files: z.write(root/path,'passenger/'+path)
        PY
        cd release/redesign
        sha256sum *.apk *.zip > SHA256SUMS-Passenger
        printf 'source=%s\napi=https://app.ramonessa.com.br\npreviewMode=false\nsigning=existing-test-key-not-for-store\n' "$SOURCE_COMMIT" > LEIA-ME-Passageiro.txt
    - name: Verify retained Android identity and certificate
      run: |
        set -euo pipefail
        apk=apps/passenger/build/app/outputs/flutter-apk/app-release.apk
        signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
        aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
        "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/certificate.txt"
        "$aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
        python3 - <<'CHECK'
        import os,re,pathlib
        certificate=pathlib.Path(os.environ['RUNNER_TEMP'],'certificate.txt').read_text()
        match=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F:]+)',certificate)
        assert match and match[1].replace(':','').lower()=='21867b7cf8beb84b4c55d648e7be3aa18f0ca78a5c57d18c1557fb503cd9efc9', 'Certificado Android diferente da chave de teste estável.'
        package=pathlib.Path(os.environ['RUNNER_TEMP'],'package.txt').read_text()
        assert "name='br.com.ramonessa.passenger.preview'" in package, 'Package Android mudou.'
        assert "versionCode='"+os.environ['SOURCE_BUILD']+"'" in package, 'Número do build diverge.'
        CHECK
        cp "$RUNNER_TEMP/certificate.txt" release/redesign/CERTIFICADO.txt
        cp "$RUNNER_TEMP/package.txt" release/redesign/PACOTE-ANDROID.txt
