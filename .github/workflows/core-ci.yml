name: Core CI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "backend/core/**"
      - ".github/workflows/core-ci.yml"
  pull_request:
    paths:
      - "backend/core/**"
      - ".github/workflows/core-ci.yml"

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ramonessa:ramonessa@127.0.0.1:5432/ramonessa
      DB_SSL: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ramonessa
          POSTGRES_PASSWORD: ramonessa
          POSTGRES_DB: ramonessa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ramonessa -d ramonessa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend/core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/core/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Verify migrations are idempotent
        run: npm run db:migrate

      - name: Tests
        run: npm test
