name: Passenger reservation duplicate protection review
on:
  push:
    branches: [feature/passenger-preparation-replay-20261030]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passenger-preparation-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  passenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/passenger
      - run: flutter analyze
        working-directory: apps/passenger
      - run: flutter test
        working-directory: apps/passenger
      - name: Compile enabled candidate without deploying it
        run: flutter build web --release --base-href=/passageiro/ --dart-define=RAMO_PREPARATION_REPLAY=true --dart-define=RAMO_PREVIEW_MODE=false --dart-define=RAMO_CORE_BASE_URL=https://app.ramonessa.com.br
        working-directory: apps/passenger
