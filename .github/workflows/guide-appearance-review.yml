name: Guide light and dark appearance - Web review
on:
  push:
    branches: [feature/guide-appearance-20261024]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: guide-appearance-review
  cancel-in-progress: true
jobs:
  passenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preserve backend, ADM, Driver and nearby vehicle behavior
        run: git diff --exit-code 674f18a32b125bcb1964a9d5057e4272f922894d HEAD -- backend apps/admin apps/driver packages apps/passenger/lib/src/features/home config/web
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/passenger
      - run: flutter analyze && flutter test
        working-directory: apps/passenger
      - name: Both appearances, all Guide templates and responsive visual review
        run: flutter test test/local_guide_visual_review.dart --update-goldens
        working-directory: apps/passenger
      - run: flutter build web --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
        working-directory: apps/passenger
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: guide-appearance-visual-review, path: apps/passenger/guide-test-artifacts/, if-no-files-found: ignore}
