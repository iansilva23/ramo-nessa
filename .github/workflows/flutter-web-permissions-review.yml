name: Flutter Web and Permissions Review

on:
  push:
    branches: [feature/flutter-web-permissions-20261013]
  workflow_dispatch:

concurrency:
  group: flutter-web-permissions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-realtime:
    name: Core browser authentication and realtime regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/core/package-lock.json
      - name: Install Core dependencies
        working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - name: Typecheck, test and build Core (no deploy)
        working-directory: backend/core
        run: |
          npm run typecheck
          npm test
          npm run build

  push-postgres-contract:
    name: Web Push persistence (disposable PostgreSQL only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ramo_push_test
          POSTGRES_PASSWORD: local_ci_fixture_only
          POSTGRES_DB: ramo_push_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ramo_push_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/core/package-lock.json
      - name: Install Core dependencies
        working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - name: Validate isolated migration and repository, without staging access
        working-directory: backend/core
        env:
          RAMO_PUSH_TEST_DATABASE_URL: postgresql://ramo_push_test:local_ci_fixture_only@localhost:5432/ramo_push_test
        run: node --import tsx --test test/postgres_web_push.test.ts

  web-card-contract:
    name: Browser card and Web Push contracts (mock providers)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/web/browser-tests/package-lock.json
      - name: Install browser test runner
        run: npm ci --prefix scripts/web/browser-tests --ignore-scripts --no-audit --no-fund
      - name: Use preinstalled Chrome for local-only tests
        run: |
          RAMO_CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          test -x "$RAMO_CHROMIUM_PATH"
          echo "RAMO_CHROMIUM_EXECUTABLE_PATH=$RAMO_CHROMIUM_PATH" >> "$GITHUB_ENV"
      - name: Check card bridge and run browser contracts without real credentials
        run: |
          node --check apps/passenger/web/ramo_card_fields.js
          node --test scripts/web/card_fields_browser_test.mjs scripts/web/push_browser_test.mjs
          node --test scripts/web/push_worker_test.mjs

  flutter-web:
    name: Web build and regressions - ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: passenger
            path: passageiro
          - app: driver
            path: motorista
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Test shared browser realtime transport
        working-directory: packages/ramo_realtime
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Analyze shared Web Push bridge
        working-directory: packages/ramo_push
        run: |
          dart pub get
          dart analyze lib
      - name: Test shared permission onboarding widgets
        working-directory: packages/design_system
        run: |
          flutter pub get
          flutter test test/ramo_permission_onboarding_test.dart test/ramo_notification_settings_test.dart
      - name: Generate correctly-sized PWA icons
        run: |
          python3 -m pip install --quiet "Pillow==11.3.0"
          python3 scripts/web/generate_pwa_icons.py
      - name: Prepare isolated Web Push (disabled in review without public config)
        run: node scripts/web/prepare_web_push.mjs --role=${{ matrix.app }}
      - name: Resolve Flutter dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get
      - name: Store resolved dependency locks for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: ramo-web-dependency-locks-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/pubspec.lock
            packages/ramo_realtime/pubspec.lock
          retention-days: 7
      - name: Check formatting of Web card source
        if: matrix.app == 'passenger'
        run: |
          dart format --output=none --set-exit-if-changed \
            apps/passenger/lib/src/features/payments/data/platform_card_tokenization_service*.dart \
            apps/passenger/lib/src/features/payments/presentation/web_card_entry_screen.dart
      - name: Store formatted card source for reproducibility
        if: matrix.app == 'passenger'
        uses: actions/upload-artifact@v4
        with:
          name: ramo-web-card-source-formatted
          path: |
            apps/passenger/lib/src/features/payments/data/platform_card_tokenization_service*.dart
            apps/passenger/lib/src/features/payments/presentation/web_card_entry_screen.dart
          retention-days: 7
      - name: Format new push source for reproducibility
        run: |
          dart format packages/ramo_push/lib \
            apps/${{ matrix.app }}/lib/src/core/communications/firebase_push_registration_service.dart \
            apps/${{ matrix.app }}/lib/src/features/profile/presentation/${{ matrix.app }}_notifications_screen.dart \
            packages/design_system/lib/src/onboarding/ramo_notification_settings.dart
      - name: Store formatted push source
        uses: actions/upload-artifact@v4
        with:
          name: ramo-web-push-source-${{ matrix.app }}
          path: |
            packages/ramo_push/lib/
            apps/${{ matrix.app }}/lib/src/core/communications/firebase_push_registration_service.dart
            apps/${{ matrix.app }}/lib/src/features/profile/presentation/${{ matrix.app }}_notifications_screen.dart
            packages/design_system/lib/src/onboarding/ramo_notification_settings.dart
          retention-days: 7
      - name: Analyze app and run regression tests
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter analyze
          flutter test
      - name: Prepare browser Google Maps key
        env:
          RAMO_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_WEB_API_KEY }}
        shell: bash
        run: |
          KEY="${RAMO_GOOGLE_MAPS_WEB_API_KEY:-WEB_KEY_NOT_CONFIGURED_FOR_CI}"
          sed -i "s|__RAMO_GOOGLE_MAPS_WEB_KEY__|${KEY}|g" apps/${{ matrix.app }}/web/index.html
      - name: Build browser/PWA application
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build web --release
          --base-href=/${{ matrix.path }}/
          --dart-define=RAMO_CORE_BASE_URL=
          --dart-define=RAMO_PREVIEW_MODE=false
      - name: Check web artifact and PWA manifest
        shell: bash
        run: |
          test -s "apps/${{ matrix.app }}/build/web/index.html"
          test -s "apps/${{ matrix.app }}/build/web/manifest.json"
          test -s "apps/${{ matrix.app }}/build/web/icons/Icon-192.png"
          test -s "apps/${{ matrix.app }}/build/web/flutter_bootstrap.js"
      - name: Verify bundle structure and route isolation
        run: >
          node scripts/web/verify_web_bundle.mjs
          --role=${{ matrix.app }}
          --dist=apps/${{ matrix.app }}/build/web
          --ci-review
      - name: Verify isolated browser security headers
        run: node scripts/web/verify_web_gateway.mjs
      - name: Validate Caddy staging config (no server changes)
        env:
          APP_DOMAIN: example.com
          ACME_EMAIL: ci@example.com
        run: |
          docker run --rm \
            -e APP_DOMAIN -e ACME_EMAIL \
            -v "$PWD/deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile
      - name: Store review-only static bundle
        uses: actions/upload-artifact@v4
        with:
          name: ramo-nessa-web-${{ matrix.app }}-review
          path: apps/${{ matrix.app }}/build/web/
          retention-days: 7
