name: Validate Android Firebase Builds

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/passenger/**"
      - "apps/driver/**"
      - ".github/workflows/validate-firebase-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve Passenger
        working-directory: apps/passenger
        run: flutter pub get --enforce-lockfile

      - name: Build Passenger APK
        working-directory: apps/passenger
        run: flutter build apk --debug --dart-define=RAMO_CORE_BASE_URL=https://example.invalid

      - name: Resolve Driver
        working-directory: apps/driver
        run: flutter pub get --enforce-lockfile

      - name: Build Driver APK
        working-directory: apps/driver
        run: flutter build apk --debug --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
