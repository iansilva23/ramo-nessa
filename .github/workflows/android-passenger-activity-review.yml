name: Passenger Android ride activity review
on:
  push:
    branches: [feature/android-lock-offer-safety-20261031]
    paths:
      - 'apps/passenger/android/**'
      - 'apps/passenger/lib/src/features/rides/presentation/ride_tracking_screen.dart'
      - '.github/workflows/android-passenger-activity-review.yml'
concurrency:
  group: passenger-activity-review
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/passenger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/features/rides/presentation/ride_tracking_screen.dart
      - run: flutter test test/passenger_ride_tracking_snapshot_test.dart test/notification_intent_test.dart
      - run: flutter build apk --debug --no-pub
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: apps/passenger/android
