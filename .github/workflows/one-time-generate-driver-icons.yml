name: One-time Generate Driver Native Icons
# retry-validated-png-v4

on:
  push:
    branches:
      - feature/zone-aware-pricing
    paths:
      - .github/workflows/one-time-generate-driver-icons.yml
      - apps/driver/assets/brand/driver/app_icon_source.png

permissions:
  contents: write

concurrency:
  group: one-time-generate-driver-icons
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate native icons
        shell: bash
        run: |
          cat > /tmp/generate_driver_icons.py <<'PY'
          from pathlib import Path
          from PIL import Image
          
          root = Path("apps/driver")
          source_path = root / "assets/brand/driver/app_icon_source.png"
          source = Image.open(source_path).convert("RGB")
          
          android = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in android.items():
              target = root / "android/app/src/main/res" / folder / "ic_launcher.png"
              target.parent.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(
                  target,
                  optimize=True,
                  compress_level=9,
              )
          
          ios = {
              "Icon-App-20x20@1x.png": 20,
              "Icon-App-20x20@2x.png": 40,
              "Icon-App-20x20@3x.png": 60,
              "Icon-App-29x29@1x.png": 29,
              "Icon-App-29x29@2x.png": 58,
              "Icon-App-29x29@3x.png": 87,
              "Icon-App-40x40@1x.png": 40,
              "Icon-App-40x40@2x.png": 80,
              "Icon-App-40x40@3x.png": 120,
              "Icon-App-50x50@1x.png": 50,
              "Icon-App-50x50@2x.png": 100,
              "Icon-App-57x57@1x.png": 57,
              "Icon-App-57x57@2x.png": 114,
              "Icon-App-60x60@2x.png": 120,
              "Icon-App-60x60@3x.png": 180,
              "Icon-App-72x72@1x.png": 72,
              "Icon-App-72x72@2x.png": 144,
              "Icon-App-76x76@1x.png": 76,
              "Icon-App-76x76@2x.png": 152,
              "Icon-App-83.5x83.5@2x.png": 167,
              "Icon-App-1024x1024@1x.png": 1024,
          }
          ios_dir = root / "ios/Runner/Assets.xcassets/AppIcon.appiconset"
          ios_dir.mkdir(parents=True, exist_ok=True)
          for filename, size in ios.items():
              source.resize((size, size), Image.Resampling.LANCZOS).save(
                  ios_dir / filename,
                  optimize=True,
                  compress_level=9,
              )
          
          legacy = root / "android/app/src/main/res/drawable/ic_launcher.xml"
          if legacy.exists():
              legacy.unlink()
          
          PY
          python /tmp/generate_driver_icons.py
      - name: Resolve Driver dependencies
        working-directory: apps/driver
        run: flutter pub get --enforce-lockfile
      - name: Build Driver Android release
        working-directory: apps/driver
        run: flutter build apk --release

