      - name: Commit validated native icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/driver/assets/brand/driver/app_icon_source.png apps/driver/android/app/src/main/res apps/driver/ios/Runner/Assets.xcassets/AppIcon.appiconset
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "feat(driver): apply approved native app icon"
