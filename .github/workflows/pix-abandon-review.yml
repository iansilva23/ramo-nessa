name: Pix abandonment persisted cancellation
on:
  push:
    branches: [fix/pix-abandon-activity-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ramo_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: ramo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ramo_test -d ramo_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://ramo_test:isolated_test_only@127.0.0.1:5432/ramo_test
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - name: Migrate isolated test database only
        run: node --import tsx scripts/migrate.ts
      - name: Verify cancellation, driver reservations, activities and payment confirmation
        run: node --import tsx --test --test-concurrency=1 test/prepayment_driver_confirmation.test.ts test/ride_payment_confirmation.test.ts test/postgres_driver_consent.test.ts test/post_payment_dispatch.test.ts
      - run: npm run build
