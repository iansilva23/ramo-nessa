name: Motorista cupons - validar toque integrado

on:
  push:
    branches: [feature/driver-tone-coupons-20261102]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Motorista ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            runner: ubuntu-24.04
          - target: android
            runner: ubuntu-24.04
          - target: ios
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve locked packages
        working-directory: apps/driver
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter app
        working-directory: apps/driver
        run: flutter analyze
      - name: Run tests
        working-directory: apps/driver
        run: flutter test
      - name: Build Web
        if: matrix.target == 'web'
        working-directory: apps/driver
        run: flutter build web --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Build Android debug
        if: matrix.target == 'android'
        working-directory: apps/driver
        run: flutter build apk --debug --no-pub --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Build iOS simulator
        if: matrix.target == 'ios'
        working-directory: apps/driver
        run: flutter build ios --simulator --debug --no-pub --no-codesign --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
