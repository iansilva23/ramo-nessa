name: GeoAgent Review
on:
  push:
    branches:
      - feature/geo-cost-optimization-20261012
concurrency:
  group: geoagent-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core-and-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ramonessa
          POSTGRES_PASSWORD: ramonessa
          POSTGRES_DB: ramonessa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ramonessa -d ramonessa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ramonessa:ramonessa@127.0.0.1:5432/ramonessa
      DB_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/core/package-lock.json
      - name: Check staging GeoAgent Compose configuration
        run: |
          docker compose --env-file deploy/staging/.env.example -f deploy/staging/compose.yml config --quiet
          node --check deploy/staging/start.mjs
          node --check deploy/staging/env.mjs
          node --check deploy/staging/validate-env.mjs
          node --check deploy/staging/firebase.mjs
      - name: Install backend dependencies
        working-directory: backend/core
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        working-directory: backend/core
        run: npm run typecheck
      - name: Apply DB migrations twice
        working-directory: backend/core
        run: npm run db:migrate && npm run db:migrate
      - name: Run backend tests
        working-directory: backend/core
        run: npm test
      - name: Build backend
        working-directory: backend/core
        run: npm run build
      - name: Check Admin JavaScript
        working-directory: apps/admin
        run: npm run check
      - name: Test Admin
        working-directory: apps/admin
        run: npm test
