name: Mobile Source Review
on:
  push:
    branches: [fix/mobile-polish-cpf-session-20261003]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Apply compiler suggested style fixes and collect diagnostics
        shell: bash
        run: |
          set -eu
          mkdir -p /tmp/mobile-review
          for dir in packages/design_system apps/passenger apps/driver; do
            (cd "$dir" && flutter pub get --enforce-lockfile && dart fix --apply && flutter analyze --no-fatal-infos --no-fatal-warnings) > "/tmp/mobile-review/$(basename "$dir").log" 2>&1 || true
          done
          git diff --binary > /tmp/mobile-review/style.patch
          git diff --stat
          cat /tmp/mobile-review/*.log
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: mobile-source-review
          path: /tmp/mobile-review/*
          retention-days: 2
