name: Driver password - reversible installer rehearsal
on:
  push:
    branches: [feature/driver-password-login-20261103]
    paths: ['deploy/driver-password/**', '.github/workflows/driver-password-installer.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: driver-password-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions: {contents: write}
    env:
      APP_SOURCE: fbadbe433fb5a00ae073e3e1e5abbd87de546913
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix backend/core --no-audit --no-fund
      - name: Installer contracts - preservation, divergence and rollback
        run: |
          python3 deploy/driver-password/test_runtime.py
          python3 deploy/driver-password/test_installer.py
          python3 -m py_compile deploy/driver-password/*.py
          node --check deploy/driver-password/migrate-one.mjs
          node --check deploy/driver-password/candidate-http.test.mjs
      - name: Obtain only packages from the successful application build
        run: |
          tag="driver-password-${APP_SOURCE:0:12}"
          ready=false
          for attempt in $(seq 1 60); do
            if gh release view "$tag" --json tagName >/dev/null 2>&1; then ready=true; break; fi
            echo "Waiting for tested application packages ($attempt/60)..."
            sleep 20
          done
          test "$ready" = true
          mkdir -p incoming package
          gh release download "$tag" --dir incoming --pattern '*Core.zip' --pattern '*Web.zip' --pattern 'SHA256SUMS*'
          python3 - <<'PY'
          import hashlib,pathlib,zipfile,json
          root=pathlib.Path('incoming')
          sums={}
          for f in root.glob('SHA256SUMS*'):
              for row in f.read_text().splitlines():
                  sha,name=row.split(None,1);name=name.strip().lstrip('*')
                  if name in sums and sums[name]!=sha: raise RuntimeError('Conflicting checksums')
                  sums[name]=sha
          for f in root.glob('*.zip'):
              assert hashlib.sha256(f.read_bytes()).hexdigest()==sums[f.name]
              with zipfile.ZipFile(f) as z:
                  for n in z.namelist():
                      p=pathlib.PurePosixPath(n)
                      assert not p.is_absolute() and '..' not in p.parts
                  if f.name.endswith('Web.zip'):
                      pathlib.Path('package/web-manifest.json').write_bytes(z.read('manifest.json'))
                      for n in z.namelist():
                          if n.startswith('driver/') and not n.endswith('/'): z.extract(n,'package')
                  else:z.extractall('package')
          PY
          node deploy/driver-password/package-installer.mjs package
      - name: Rehearse the actual overlay with PostgreSQL, HTTP, Web cookies and restart
        run: python3 -u deploy/driver-password/rehearse.py package
      - name: Publish verified reversible operator package
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('RamoNessa-Motorista-Login-Instalador.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(pathlib.Path('package').rglob('*')):
                  if p.is_file():z.write(p,'driver-password/'+str(p.relative_to('package')))
          PY
          sha256sum RamoNessa-Motorista-Login-Instalador.zip > SHA256SUMS-Instalador
          gh release create "driver-password-installer-${GITHUB_SHA:0:12}" RamoNessa-Motorista-Login-Instalador.zip SHA256SUMS-Instalador --target "$GITHUB_SHA" --prerelease --latest=false --title 'Instalador reversível - login motorista' --notes "Rehearsed source overlay and disposable PostgreSQL/HTTP tests. Application source $APP_SOURCE. Does not deploy VPS automatically."
      - uses: actions/upload-artifact@v4
        with:
          name: driver-password-installer
          path: |
            RamoNessa-Motorista-Login-Instalador.zip
            SHA256SUMS-Instalador
          if-no-files-found: error
