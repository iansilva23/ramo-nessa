name: Refresh Flutter Lockfiles

on:
  push:
    branches:
      - feature/zone-aware-pricing
    paths:
      - .github/workflows/refresh-lockfiles.yml
      - apps/passenger/pubspec.yaml
      - apps/driver/pubspec.yaml

permissions:
  contents: read

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Refresh Passenger lockfile
        working-directory: apps/passenger
        run: flutter pub get

      - name: Refresh Driver lockfile
        working-directory: apps/driver
        run: flutter pub get

      - name: Upload lockfiles
        uses: actions/upload-artifact@v7.0.1
        with:
          name: refreshed-flutter-lockfiles
          path: |
            apps/passenger/pubspec.lock
            apps/driver/pubspec.lock
          if-no-files-found: error
          retention-days: 1
