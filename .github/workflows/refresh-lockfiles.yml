name: Refresh Flutter Lockfiles

on:
  push:
    branches:
      - feature/zone-aware-pricing
    paths:
      - .github/workflows/refresh-lockfiles.yml
      - apps/passenger/pubspec.yaml
      - apps/driver/pubspec.yaml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/zone-aware-pricing

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Refresh Passenger lockfile
        working-directory: apps/passenger
        run: flutter pub get

      - name: Refresh Driver lockfile
        working-directory: apps/driver
        run: flutter pub get

      - name: Commit generated lockfiles
        shell: bash
        run: |
          if git diff --quiet -- apps/passenger/pubspec.lock apps/driver/pubspec.lock; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/passenger/pubspec.lock apps/driver/pubspec.lock
          git commit -m "chore(flutter): refresh dependency lockfiles"
          git push origin HEAD:feature/zone-aware-pricing
