name: APKs atualizados do Ramo Nessa
on:
  push:
    branches: [build/android-sync-20261121]
    paths: [.github/workflows/android-sync-20261121.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  RAMO_PRODUCTION_SIGNING: 'false'
  RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: passenger
            label: Passageiro
            upper: PASSENGER
          - app: driver
            label: Motorista
            upper: DRIVER
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets[format('RAMO_GOOGLE_MAPS_ANDROID_{0}_API_KEY', matrix.upper)] || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY }}
      RAMO_FIREBASE_API_KEY: ${{ secrets[format('RAMO_FIREBASE_ANDROID_{0}_API_KEY', matrix.upper)] || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets[format('RAMO_FIREBASE_ANDROID_{0}_APP_ID', matrix.upper)] }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
      RAMO_GOOGLE_SERVER_CLIENT_ID: ${{ secrets[format('RAMO_GOOGLE_ANDROID_{0}_SERVER_CLIENT_ID', matrix.upper)] || secrets.RAMO_GOOGLE_SERVER_CLIENT_ID }}
      RAMO_PREVIEW_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Validate Android browser-independent Maps and Firebase configuration
        run: |
          node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_ANDROID_API_KEY --surface="${{ matrix.label }} Android connected"
          node tooling/validate-firebase-mobile-config.mjs --platform=android --surface="${{ matrix.label }} Android connected"
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/${{ matrix.app }}
      - name: Test current checkout and sign-in flows
        working-directory: apps/${{ matrix.app }}
        run: |
          if [[ "${{ matrix.app }}" == passenger ]]; then
            flutter test --no-pub test/flow_safety_test.dart test/payment_method_toggle_ui_test.dart test/google_access_test.dart
          else
            flutter test --no-pub test/auth_flow_test.dart test/driver_password_flow_test.dart
          fi
      - name: Resolve Kotlin dependencies from Maven Central
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          settings = Path(os.environ['FLUTTER_ROOT']) / 'packages/flutter_tools/gradle/settings.gradle.kts'
          original = settings.read_text()
          if 'pluginManagement {' not in original:
              repositories = 'pluginManagement { repositories { mavenCentral(); gradlePluginPortal(); google() } }'
              settings.write_text(repositories + chr(10) + original)
          PYCODE
      - name: Build connected Android APK with stable test signature
        working-directory: apps/${{ matrix.app }}
        run: |
          social_google=false
          if [[ "$RAMO_GOOGLE_SERVER_CLIENT_ID" == *.apps.googleusercontent.com ]]; then
            social_google=true
          fi
          printf 'google_sign_in=%s\n' "$social_google" > "$RUNNER_TEMP/native-config.txt"
          flutter build apk --release --no-pub \
            --build-number="$(date +%s)" \
            --dart-define=RAMO_SOCIAL_GOOGLE_ENABLED="$social_google" \
            --dart-define=RAMO_GOOGLE_SERVER_CLIENT_ID="$RAMO_GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=RAMO_PREVIEW_MODE=false \
            --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
            --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
            --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
            --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
            --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
      - name: Verify signature and package application identity
        run: |
          apk=apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          fingerprint=$(sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]+)$/\1/p' "$RUNNER_TEMP/signature.txt")
          test "$fingerprint" = 21867b7cf8beb84b4c55d648e7be3aa18f0ca78a5c57d18c1557fb503cd9efc9
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          node -e "if(!require('fs').readFileSync(process.env.RUNNER_TEMP+'/package.txt','utf8').includes(\"name='br.com.ramonessa.${{ matrix.app }}.preview'\"))throw Error('Unexpected APK application ID')"
          version=$(sed -nE "s/^package:.*versionCode='([0-9]+)'.*/\1/p" "$RUNNER_TEMP/package.txt")
          test "$version" -gt 1795104000
          mkdir -p artifacts/android
          printf '%s\n' "$fingerprint" > artifacts/android/CERTIFICATE-SHA256.txt
          cp "$apk" artifacts/android/RamoNessa-${{ matrix.label }}-Android-Atualizado-20261121.apk
          cp "$RUNNER_TEMP/package.txt" artifacts/android/package.txt
          cp "$RUNNER_TEMP/native-config.txt" artifacts/android/native-config.txt
          git rev-parse HEAD > artifacts/android/SOURCE.txt
          cd artifacts/android
          sha256sum RamoNessa-${{ matrix.label }}-Android-Atualizado-20261121.apk > SHA256SUMS
          printf '%s\n' '${{ matrix.label }} Android conectado a https://app.ramonessa.com.br. Fonte registrada em SOURCE.txt. RAMO_PREVIEW_MODE=false; assinatura de homologacao e pacote br.com.ramonessa.${{ matrix.app }}.preview. Nao destinado a publicacao nas lojas. GPS, login e push exigem aceite no aparelho. Nenhuma configuração do servidor é alterada.' > LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ramo-${{ matrix.app }}-android-atualizado-20261121
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14
