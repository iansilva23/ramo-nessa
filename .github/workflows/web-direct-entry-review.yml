name: Web direct entry - no swipe screen
on:
  push:
    branches: [feature/admin-web-entry-toggle-20261021]
    paths-ignore: ['docs/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: web-direct-entry-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve approved apps, Core, ADM, providers and native source
        run: |
          git diff --exit-code 7dece1706d617ea15ef3df2ab78310ca873762fe -- backend apps/admin apps/passenger/lib apps/driver/lib packages apps/passenger/android apps/passenger/ios apps/driver/android apps/driver/ios apps/passenger/pubspec.yaml apps/passenger/pubspec.lock apps/driver/pubspec.yaml apps/driver/pubspec.lock
          test ! -e apps/passenger/web/ramo_entry_gate.js
          test ! -e apps/passenger/web/ramo_entry_gate.css
          test ! -e apps/driver/web/ramo_entry_gate.js
          test ! -e apps/driver/web/ramo_entry_gate.css
      - working-directory: backend/core
        run: npm ci --no-audit --no-fund && npm run build
      - name: Prepare isolated browser
        run: |
          npm ci --prefix scripts/web/browser-tests --ignore-scripts --no-audit --no-fund
          node scripts/web/browser-tests/node_modules/playwright/cli.js install --with-deps ${{ matrix.engine }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39693460184
          artifact-ids: '12389892455'
          path: approved
          merge-multiple: true
      - name: Remove the surface from the exact approved pair
        run: |
          node scripts/web/prepare_direct_entry_review.mjs approved
          for role in passenger driver; do
            mkdir -p "apps/$role/build/web"
            cp -a "approved/$role/." "apps/$role/build/web/"
            node scripts/web/verify_web_bundle.mjs --role="$role" --dist="apps/$role/build/web"
          done
      - name: Installed launch, foreground, first controls, cookie recovery and logout
        env:
          RAMO_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          for role in passenger driver; do
            RAMO_WEB_TEST_ROLE="$role" node --test scripts/web/web_direct_entry_auth_test.mjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-direct-entry-${{ matrix.engine }}
          path: artifacts/web-csp/
          retention-days: 14
