name: App redesign release candidate
on:
  push:
    branches: [release/app-redesign-review-20261105]
    paths: ['apps/driver/**','apps/passenger/**','packages/**','.github/workflows/app-redesign-candidate.yml']
  workflow_dispatch:
concurrency:
  group: app-redesign-candidate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  retire-obsolete-checks:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Retire older checks of the same release branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          base = 'https://api.github.com/repos/' + os.environ['REPO'] + '/actions/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          url = base + 'workflows/app-redesign-candidate.yml/runs?per_page=100&branch=' + urllib.parse.quote(os.environ['BRANCH'], safe='')
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          for run in runs:
              if run['id'] >= int(os.environ['RUN_ID']) or run['head_branch'] != os.environ['BRANCH'] or run['status'] == 'completed':
                  continue
              request = urllib.request.Request(base + 'runs/' + str(run['id']) + '/cancel', headers=headers, data=b'', method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      print('Retired obsolete check', run['id'])
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
          PY
  validate:
    needs: retire-obsolete-checks
    name: Validate ${{ matrix.app }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: driver, platform: android, runner: ubuntu-24.04}
          - {app: passenger, platform: android, runner: ubuntu-24.04}
          - {app: driver, platform: ios, runner: macos-15}
          - {app: passenger, platform: ios, runner: macos-15}
    env:
      RAMO_PREVIEW_SIGNING: 'false'
      RAMO_PRODUCTION_SIGNING: 'false'
      RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ''
      RAMO_MERCADO_PAGO_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2.23.0
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - name: Resolve committed dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test every app state
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter analyze
          flutter test
      - name: Compile Android
        if: matrix.platform == 'android'
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --debug --no-pub --dart-define=RAMO_PREVIEW_MODE=false --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Compile Web
        if: matrix.platform == 'android'
        working-directory: apps/${{ matrix.app }}
        run: flutter build web --release --no-pub
      - name: Compile iOS simulator
        if: matrix.platform == 'ios'
        working-directory: apps/${{ matrix.app }}
        run: flutter build ios --simulator --debug --no-pub --no-codesign --dart-define=RAMO_PREVIEW_MODE=false --dart-define=RAMO_CORE_BASE_URL=https://example.invalid
      - name: Preserve visual evidence
        if: always() && matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-shots-${{ matrix.app }}
          path: release/access-shots/${{ matrix.app }}-*.png
          if-no-files-found: error
      - name: Preserve committed source and dependencies
        run: git diff --exit-code -- apps/*/lib apps/*/pubspec.yaml apps/*/pubspec.lock packages/
  source-package:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Package the exact validated source
        run: |
          mkdir -p release-candidate
          git rev-parse HEAD > release-candidate/SOURCE_COMMIT.txt
          git diff --name-only 210ccb00837b543ed223c7b94664f0bba046901e HEAD > release-candidate/CHANGED_FILES.txt
          test -z "$(git diff --name-only 210ccb00837b543ed223c7b94664f0bba046901e HEAD -- apps/admin backend)"
          git archive --format=tar.gz --prefix=ramo-nessa/ HEAD > release-candidate/RamoNessa-Redesign-Fonte.tar.gz
          cd release-candidate
          sha256sum RamoNessa-Redesign-Fonte.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: RamoNessa-Redesign-Candidato-Fonte
          path: release-candidate/
