name: One-time Mobile Build Verification

on:
  push:
    branches:
      - feature/zone-aware-pricing
    paths:
      - .github/workflows/one-time-mobile-build-verification.yml

concurrency:
  group: one-time-mobile-build-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  passenger-android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Resolve Passenger dependencies from lockfile
        working-directory: apps/passenger
        run: flutter pub get --enforce-lockfile
      - name: Build Passenger Android release
        working-directory: apps/passenger
        run: flutter build apk --release

  driver-android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Resolve Driver dependencies from lockfile
        working-directory: apps/driver
        run: flutter pub get --enforce-lockfile
      - name: Build Driver Android release
        working-directory: apps/driver
        run: flutter build apk --release

  passenger-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Resolve Passenger dependencies from lockfile
        working-directory: apps/passenger
        run: flutter pub get --enforce-lockfile
      - name: Build Passenger iOS simulator
        working-directory: apps/passenger
        run: flutter build ios --simulator --debug
