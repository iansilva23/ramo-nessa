        RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
        RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
        RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
      run: 'flutter build ios --simulator --debug --dart-define=RAMO_CORE_BASE_URL=$RAMO_CORE_BASE_URL --dart-define=RAMO_FIREBASE_API_KEY=$RAMO_FIREBASE_API_KEY
        --dart-define=RAMO_FIREBASE_APP_ID=$RAMO_FIREBASE_APP_ID --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID=$RAMO_FIREBASE_MESSAGING_SENDER_ID
        --dart-define=RAMO_FIREBASE_PROJECT_ID=$RAMO_FIREBASE_PROJECT_ID --dart-define=RAMO_FIREBASE_STORAGE_BUCKET=$RAMO_FIREBASE_STORAGE_BUCKET

        '
  gate:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
    - uses: actions/checkout@v4
    - id: ready
      env:
        KEYSTORE: ${{ secrets.RAMO_ANDROID_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.RAMO_ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RAMO_ANDROID_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.RAMO_ANDROID_KEY_PASSWORD }}
      run: 'python3 - <<''PYCODE''

        import json,os

        from pathlib import Path

        state=json.loads(Path(''tooling/release/final-readiness.json'').read_text())

        required=[''passenger_vehicle_selection_restored'',''account_deletion_enabled_and_verified'',''legal_documents_published_and_verified'']

        ready=all(state.get(k)is True for k in required)and all(bool(os.environ.get(k))for k in [''KEYSTORE'',''STORE_PASSWORD'',''KEY_ALIAS'',''KEY_PASSWORD''])

        print(''Official Android generation ready:'',ready)

        with open(os.environ[''GITHUB_OUTPUT''],''a'')as f:f.write(''ready=''+str(ready).lower()+''\n'')

        PYCODE'
'on':
  workflow_dispatch: {}
