    - name: Upload Driver APK
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ramo-nessa-driver-release
        path: apps/driver/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
    if: needs.gate.outputs.ready == 'true'
  passenger-ios-simulator:
    if: needs.gate.outputs.ready == 'true'
    needs:
    - gate
    - preflight
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2.23.0
      with:
        flutter-version: 3.47.5
        channel: stable
        cache: true
    - name: Resolve Passenger dependencies from lockfile
      working-directory: apps/passenger
      run: flutter pub get --enforce-lockfile
    - name: Validate production Core URL
      env:
        RAMO_CORE_BASE_URL: ${{ secrets.RAMO_CORE_BASE_URL || 'https://app.ramonessa.com.br' }}
      run: "if [[ ! \"$RAMO_CORE_BASE_URL\" =~ ^https://[^[:space:]]+$ ]]; then\n  echo \"::error::Configure RAMO_CORE_BASE_URL\
        \ com a URL HTTPS p\xFAblica do Core antes do release.\"\n  exit 1\nfi\n"
    - name: Validate Passenger Google Maps iOS key
      env:
        RAMO_GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_IOS_PASSENGER_API_KEY }}
      run: 'node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_IOS_API_KEY --surface="Passenger iOS"

        '
    - name: Configure Passenger Google Maps iOS key
      working-directory: apps/passenger/ios/Flutter
      env:
        RAMO_GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_IOS_PASSENGER_API_KEY }}
      run: printf 'GOOGLE_MAPS_API_KEY = %s\n' "$RAMO_GOOGLE_MAPS_IOS_API_KEY" > GoogleMaps.local.xcconfig
    - name: Validate Passenger iOS Firebase push config
      env:
        RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
        RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_APP_ID }}
        RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
        RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      run: 'node tooling/validate-firebase-mobile-config.mjs --platform=ios --surface="Passenger iOS"

        '
    - name: Build Passenger iOS simulator
      working-directory: apps/passenger
      env:
        RAMO_CORE_BASE_URL: ${{ secrets.RAMO_CORE_BASE_URL || 'https://app.ramonessa.com.br' }}
        RAMO_MERCADO_PAGO_PUBLIC_KEY: APP_USR-d88c8e2c-cc73-4792-a348-41d6282af1fd
        RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
        RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_IOS_PASSENGER_APP_ID }}
        RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
        RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
        RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
        SWIFT_VERSION: '5.0'
      run: 'flutter build ios --simulator --debug --dart-define=RAMO_CORE_BASE_URL=$RAMO_CORE_BASE_URL --dart-define=RAMO_MERCADO_PAGO_PUBLIC_KEY=$RAMO_MERCADO_PAGO_PUBLIC_KEY
        --dart-define=RAMO_FIREBASE_API_KEY=$RAMO_FIREBASE_API_KEY --dart-define=RAMO_FIREBASE_APP_ID=$RAMO_FIREBASE_APP_ID
        --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID=$RAMO_FIREBASE_MESSAGING_SENDER_ID --dart-define=RAMO_FIREBASE_PROJECT_ID=$RAMO_FIREBASE_PROJECT_ID
        --dart-define=RAMO_FIREBASE_STORAGE_BUCKET=$RAMO_FIREBASE_STORAGE_BUCKET

        '
