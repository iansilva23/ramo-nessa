        --dart-define=RAMO_FIREBASE_PROJECT_ID=$RAMO_FIREBASE_PROJECT_ID --dart-define=RAMO_FIREBASE_STORAGE_BUCKET=$RAMO_FIREBASE_STORAGE_BUCKET

        '
    - name: Verify Driver production APK signature
      run: "APK=\"apps/driver/build/app/outputs/flutter-apk/app-release.apk\"\ntest -f \"$APK\"\nAPKSIGNER=\"$(find \"$ANDROID_HOME/build-tools\"\
