name: Final Android release (gated until accepted)
concurrency:
  group: mobile-build-audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml
    needs:
    - gate
    if: needs.gate.outputs.ready == 'true'
  passenger-android-release:
    needs:
    - gate
    - preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Java 21 for Android build
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up Flutter
      uses: subosito/flutter-action@v2.23.0
      with:
        flutter-version: 3.47.5
        channel: stable
        cache: true
    - name: Resolve Passenger dependencies from lockfile
      working-directory: apps/passenger
      run: flutter pub get --enforce-lockfile
    - name: Validate production Core URL
      env:
        RAMO_CORE_BASE_URL: ${{ secrets.RAMO_CORE_BASE_URL || 'https://app.ramonessa.com.br' }}
      run: "if [[ ! \"$RAMO_CORE_BASE_URL\" =~ ^https://[^[:space:]]+$ ]]; then\n  echo \"::error::Configure RAMO_CORE_BASE_URL\
        \ com a URL HTTPS p\xFAblica do Core antes do release.\"\n  exit 1\nfi\n"
    - name: Validate Passenger Google Maps key
      env:
        RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_ANDROID_PASSENGER_API_KEY }}
      run: 'node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_ANDROID_API_KEY --surface="Passenger Android"

        '
    - name: Validate Passenger Android Firebase push config
      env:
        RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
        RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_APP_ID }}
        RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
        RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      run: 'node tooling/validate-firebase-mobile-config.mjs --platform=android --surface="Passenger Android"

        '
    - name: Prepare Passenger Android production signing
      env:
        RAMO_ANDROID_KEYSTORE_BASE64: ${{ secrets.RAMO_ANDROID_KEYSTORE_BASE64 }}
        RAMO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RAMO_ANDROID_KEYSTORE_PASSWORD }}
        RAMO_ANDROID_KEY_ALIAS: ${{ secrets.RAMO_ANDROID_KEY_ALIAS }}
        RAMO_ANDROID_KEY_PASSWORD: ${{ secrets.RAMO_ANDROID_KEY_PASSWORD }}
      run: "for variable in RAMO_ANDROID_KEYSTORE_BASE64 RAMO_ANDROID_KEYSTORE_PASSWORD RAMO_ANDROID_KEY_ALIAS RAMO_ANDROID_KEY_PASSWORD;\
        \ do\n  if [[ -z \"${!variable}\" ]]; then\n    echo \"::error::Configure o Secret $variable antes do build Android\
        \ de produ\xE7\xE3o.\"\n    exit 1\n  fi\ndone\nprintf '%s' \"$RAMO_ANDROID_KEYSTORE_BASE64\" | base64 --decode >\
        \ \"$RUNNER_TEMP/ramo-android-release.jks\"\nchmod 600 \"$RUNNER_TEMP/ramo-android-release.jks\"\nkeytool -list  \
        \           -keystore \"$RUNNER_TEMP/ramo-android-release.jks\"             -storepass \"$RAMO_ANDROID_KEYSTORE_PASSWORD\"\
        \             -alias \"$RAMO_ANDROID_KEY_ALIAS\" > /dev/null\n"
    - name: Build Passenger Android release
      working-directory: apps/passenger
      env:
        RAMO_CORE_BASE_URL: ${{ secrets.RAMO_CORE_BASE_URL || 'https://app.ramonessa.com.br' }}
        RAMO_PRODUCTION_SIGNING: 'true'
        RAMO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ramo-android-release.jks
        RAMO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RAMO_ANDROID_KEYSTORE_PASSWORD }}
        RAMO_ANDROID_KEY_ALIAS: ${{ secrets.RAMO_ANDROID_KEY_ALIAS }}
        RAMO_ANDROID_KEY_PASSWORD: ${{ secrets.RAMO_ANDROID_KEY_PASSWORD }}
        RAMO_MERCADO_PAGO_PUBLIC_KEY: APP_USR-d88c8e2c-cc73-4792-a348-41d6282af1fd
        RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.RAMO_GOOGLE_MAPS_ANDROID_PASSENGER_API_KEY }}
        RAMO_FIREBASE_API_KEY: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_API_KEY || secrets.RAMO_FIREBASE_API_KEY }}
        RAMO_FIREBASE_APP_ID: ${{ secrets.RAMO_FIREBASE_ANDROID_PASSENGER_APP_ID }}
        RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
        RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
        RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
      run: 'flutter build apk --release --dart-define=RAMO_CORE_BASE_URL=$RAMO_CORE_BASE_URL --dart-define=RAMO_MERCADO_PAGO_PUBLIC_KEY=$RAMO_MERCADO_PAGO_PUBLIC_KEY
        --dart-define=RAMO_FIREBASE_API_KEY=$RAMO_FIREBASE_API_KEY --dart-define=RAMO_FIREBASE_APP_ID=$RAMO_FIREBASE_APP_ID
        --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID=$RAMO_FIREBASE_MESSAGING_SENDER_ID --dart-define=RAMO_FIREBASE_PROJECT_ID=$RAMO_FIREBASE_PROJECT_ID
        --dart-define=RAMO_FIREBASE_STORAGE_BUCKET=$RAMO_FIREBASE_STORAGE_BUCKET

        '
    - name: Verify Passenger production APK signature
      run: "APK=\"apps/passenger/build/app/outputs/flutter-apk/app-release.apk\"\ntest -f \"$APK\"\nAPKSIGNER=\"$(find \"\
        $ANDROID_HOME/build-tools\" -type f -name apksigner | sort -V | tail -n 1)\"\nif [[ -z \"$APKSIGNER\" ]]; then\n \
        \ echo \"::error::apksigner n\xE3o foi encontrado no Android SDK.\"\n  exit 1\nfi\n\"$APKSIGNER\" verify --verbose\
        \ --print-certs \"$APK\"\n"
    - name: Upload Passenger APK
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ramo-nessa-passenger-release
        path: apps/passenger/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
    if: needs.gate.outputs.ready == 'true'
