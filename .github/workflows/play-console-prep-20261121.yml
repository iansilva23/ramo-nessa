name: Android production bundle preparation
on:
  push:
    branches: [prepare/play-console-20261121]
    paths: [.github/workflows/play-console-prep-20261121.yml]
permissions:
  contents: read
jobs:
  signing-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check production approval and signing configuration
        env:
          KEYSTORE: ${{ secrets.RAMO_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RAMO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RAMO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RAMO_ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          state = json.loads(Path('tooling/release/final-readiness.json').read_text())
          names = ('KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          print('Production signing variables configured:', all(os.environ.get(name) for name in names))
          print('Production gate flags:', json.dumps(state, sort_keys=True))
          PYCODE
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: passenger
            upper: PASSENGER
          - app: driver
            upper: DRIVER
    env:
      # Increment for each new Play release. Both app IDs have independent counters.
      PLAY_VERSION_CODE: '1'
      RAMO_PREVIEW_SIGNING: 'false'
      RAMO_PRODUCTION_SIGNING: 'false'
      RAMO_CORE_BASE_URL: https://app.ramonessa.com.br
      RAMO_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets[format('RAMO_GOOGLE_MAPS_ANDROID_{0}_API_KEY', matrix.upper)] || secrets.RAMO_GOOGLE_MAPS_ANDROID_API_KEY }}
      RAMO_FIREBASE_API_KEY: ${{ secrets[format('RAMO_FIREBASE_ANDROID_{0}_API_KEY', matrix.upper)] || secrets.RAMO_FIREBASE_API_KEY }}
      RAMO_FIREBASE_APP_ID: ${{ secrets[format('RAMO_FIREBASE_ANDROID_{0}_APP_ID', matrix.upper)] }}
      RAMO_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RAMO_FIREBASE_MESSAGING_SENDER_ID }}
      RAMO_FIREBASE_PROJECT_ID: ${{ secrets.RAMO_FIREBASE_PROJECT_ID }}
      RAMO_FIREBASE_STORAGE_BUCKET: ${{ secrets.RAMO_FIREBASE_STORAGE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Validate supplied mobile configurations
        run: |
          node tooling/validate-google-maps-key.mjs --env=RAMO_GOOGLE_MAPS_ANDROID_API_KEY --surface="Android ${{ matrix.app }}"
          node tooling/validate-firebase-mobile-config.mjs --platform=android --surface="Android ${{ matrix.app }}"
      - name: Resolve Flutter dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get --enforce-lockfile
      - name: Test the current Android app flows
        working-directory: apps/${{ matrix.app }}
        run: |
          if [[ "${{ matrix.app }}" == passenger ]]; then
            flutter test --no-pub test/flow_safety_test.dart test/payment_method_toggle_ui_test.dart test/google_access_test.dart
          else
            flutter test --no-pub test/auth_flow_test.dart test/driver_password_flow_test.dart
          fi
      - name: Resolve Kotlin dependencies from Maven Central
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          settings = Path(os.environ['FLUTTER_ROOT']) / 'packages/flutter_tools/gradle/settings.gradle.kts'
          original = settings.read_text()
          if 'pluginManagement {' not in original:
              repositories = 'pluginManagement { repositories { mavenCentral(); gradlePluginPortal(); google() } }'
              settings.write_text(repositories + chr(10) + original)
          PYCODE
      - name: Build unsigned AAB for verification only
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build appbundle --release --no-pub --build-number="$PLAY_VERSION_CODE" \
            --dart-define=RAMO_PREVIEW_MODE=false \
            --dart-define=RAMO_CORE_BASE_URL="$RAMO_CORE_BASE_URL" \
            --dart-define=RAMO_FIREBASE_API_KEY="$RAMO_FIREBASE_API_KEY" \
            --dart-define=RAMO_FIREBASE_APP_ID="$RAMO_FIREBASE_APP_ID" \
            --dart-define=RAMO_FIREBASE_MESSAGING_SENDER_ID="$RAMO_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=RAMO_FIREBASE_PROJECT_ID="$RAMO_FIREBASE_PROJECT_ID" \
            --dart-define=RAMO_FIREBASE_STORAGE_BUCKET="$RAMO_FIREBASE_STORAGE_BUCKET"
      - name: Verify unsigned bundle exists and record digest
        working-directory: apps/${{ matrix.app }}
        run: |
          file=build/app/outputs/bundle/release/app-release.aab
          test -s "$file"
          unzip -t "$file" > /dev/null
          if unzip -Z1 "$file" | grep -Ei '^META-INF/.*\.(RSA|DSA|EC)$'; then
            echo 'Expected an unsigned inspection bundle.'
            exit 1
          fi
          mkdir -p artifacts/play
          name="RamoNessa-${{ matrix.app }}-Play-v${PLAY_VERSION_CODE}-SEM-ASSINATURA.aab"
          cp "$file" "artifacts/play/$name"
          git rev-parse HEAD > artifacts/play/SOURCE.txt
          cd artifacts/play
          sha256sum "$name" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.app }}-play-v1-unsigned
          path: apps/${{ matrix.app }}/artifacts/play/
          if-no-files-found: error
          retention-days: 7
