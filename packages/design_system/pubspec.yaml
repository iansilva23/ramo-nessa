name: ramo_design_system
description: Design system compartilhado do Ramo Nessa.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  firebase_auth: 6.7.0
  firebase_core: ^4.15.0
  google_sign_in: 7.2.0
  http: ^1.6.0
  pointer_interceptor: 0.10.1+3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_markers/
    - assets/auth/
    - web/ramo_firebase_auth.js
